<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>XSD в WSDL Конвертер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="main-content generator-page-container">
    <h2 style="flex-shrink: 0;">XSD в WSDL</h2>
    <div class="generator-columns-container">
        <div class="generator-panel" style="width: 45%;">
            <div class="generator-controls">
                <label for="xsd-filename">Имя XSD файла (например, MyMessage.xsd)</label>
                <input type="text" id="xsd-filename" placeholder="Имя для генерации имен в WSDL">
            </div>
            <div class="generator-controls">
                <label for="service-type">Тип сервиса</label>
                <select id="service-type"><option value="synchronous">Синхронный (Request-Response)</option><option value="asynchronous">Асинхронный (One-Way)</option></select>
            </div>
            <label for="input-xsd" style="margin-top: 10px;">Содержимое XSD</label>
            <textarea id="input-xsd"></textarea>
            <button id="convert-btn" style="margin-top:10px; padding: 12px 20px;">Конвертировать</button>
        </div>
        <div class="generator-panel" style="width: 55%;">
            <label for="output-wsdl">Сгенерированный WSDL</label>
            <textarea id="output-wsdl" readonly placeholder="Результат появится здесь..."></textarea>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const convertBtn = document.getElementById('convert-btn');
        const inputXsd = document.getElementById('input-xsd');
        const outputWsdl = document.getElementById('output-wsdl');
        const xsdFilenameInput = document.getElementById('xsd-filename');
        const serviceTypeSelect = document.getElementById('service-type');

        const exampleXsd = `<?xml version="1.0" encoding="UTF-8"?>
<xsd:schema xmlns:xsd="http://www.w3.org/2001/XMLSchema">
    <xsd:element name="SimpleRequest">
        <xsd:complexType>
            <xsd:sequence>
                <xsd:element name="requestId" type="xsd:string"/>
                <xsd:element name="payload" type="xsd:string"/>
            </xsd:sequence>
        </xsd:complexType>
    </xsd:element>
</xsd:schema>`;
        inputXsd.value = exampleXsd;
        xsdFilenameInput.value = "MyMessage.xsd";

        convertBtn.addEventListener('click', () => {
            const payload = { xsdContent: inputXsd.value, xsdFileName: xsdFilenameInput.value, serviceType: serviceTypeSelect.value };
            if (!payload.xsdContent.trim() || !payload.xsdFileName.trim()) return alert('Все поля должны быть заполнены.');

            convertBtn.disabled = true;
            outputWsdl.value = 'Генерация...';

            fetch('/api/xsd-to-wsdl', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
                .then(async response => {
                    const text = await response.text();
                    if (!response.ok) {
                        try { throw new Error(JSON.parse(text).message); }
                        catch (e) { throw new Error(text); }
                    }
                    return text;
                })
                .then(wsdlResult => { outputWsdl.value = wsdlResult; })
                .catch(error => { outputWsdl.value = 'Ошибка: ' + error.message; })
                .finally(() => { convertBtn.disabled = false; });
        });
    });
</script>
</body>
</html>
