<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Справочники и Шаблоны</title>
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Общие стили -->
  <link rel="stylesheet" href="style.css">
  <style>
    /* === ЛОКАЛЬНЫЕ СТИЛИ СТРАНИЦЫ === */
    body {
      background-color: #f4f7f9;
      margin: 0;
      padding: 20px;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 1fr 2fr; /* Левая колонка уже, правая шире */
      gap: 20px;
      height: calc(100% - 60px); /* Вычет высоты шапки */
    }

    /* Панели */
    .panel {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      overflow: hidden;
      height: 100%;
    }

    .panel-head {
      padding: 12px 15px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-weight: 600;
      color: #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .panel-body {
      padding: 15px;
      overflow-y: auto;
      flex: 1;
      background-color: #fff;
    }

    /* Списки */
    .list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
    }
    .list-item:hover { background: #f8fafc; }
    .list-item b { color: #2c3e50; }
    .list-item span.desc { color: #888; font-size: 0.9em; margin-left: 10px; }

    /* Drag & Drop Правая колонка */
    .dd-list { list-style: none; padding: 0; margin: 0; }

    .dd-item {
      display: flex; align-items: center;
      padding: 10px; margin-bottom: 6px;
      background: #fff;
      border: 1px solid #dce4ec;
      border-radius: 4px;
      transition: 0.1s;
    }
    .dd-item:hover { background: #f1f8ff; border-color: #a5b4fc; }
    .dd-item.dragging { opacity: 0.6; background: #e0e7ff; border: 2px dashed #4f46e5; }

    .dd-handle {
      margin-right: 12px;
      color: #cbd5e1;
      cursor: grab;
      font-size: 20px;
      width: 24px; text-align: center;
      user-select: none;
    }

    .item-inputs { flex: 1; display: flex; gap: 10px; align-items: center; }

    input[type="text"], select {
      padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box;
    }
    .title-input { flex: 2; font-weight: 600; border:1px solid transparent; background:transparent; }
    .title-input:focus { border:1px solid #3b82f6; background:#fff; }

    /* Тип контента badge */
    .type-label {
      font-size: 11px; color: #64748b; background: #f1f5f9; padding: 4px 8px;
      border-radius: 4px; border: 1px solid #e2e8f0; cursor: pointer;
      white-space: nowrap; min-width: 60px; text-align: center;
    }
    .type-label:hover { background: #e2e8f0; color: #0f172a; }

    /* Кнопки */
    .btn-rem { color: #ef4444; background: none; border: none; cursor: pointer; font-size: 18px; margin-left: 5px; }
    .btn-rem:hover { color: #c82333; }
    .btn-content { font-size: 11px; padding: 4px 10px; background: #fff; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
    .btn-content:hover { border-color: #3b82f6; color: #3b82f6; background: #eff6ff; }

    /* MODAL */
    .modal-wrap { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9000; }
    .modal-win {
      background: #fff; width: 600px; margin: 5% auto; padding: 25px;
      border-radius: 8px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    .badge { padding:2px 6px; border-radius:4px; font-size:10px; color:white; font-weight:bold; }
  </style>
</head>
<body>

<div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px; flex-shrink: 0;">
  <button onclick="window.location.href='index.html'" class="secondary">🏠 Домой</button>
  <h2 style="margin: 0; font-size: 20px; color: #1e293b;">Мастер-данные и Шаблоны</h2>
</div>

<div class="layout-grid">

  <!-- LEFT COLUMN -->
  <div style="display: flex; flex-direction: column; gap: 20px;">

    <!-- ENVIRONMENTS -->
    <div class="panel" style="flex: 0 0 45%;">
      <div class="panel-head">
        <span>🌍 Окружения (Config DB)</span>
        <button onclick="saveSettings('envs')" style="background:#27ae60; color:white; font-weight:bold; padding:4px 10px; border:none; border-radius:4px; cursor:pointer;">💾 Save</button>
      </div>
      <div class="panel-body">
        <div style="display:flex; gap:5px; margin-bottom:10px;">
          <input id="in_host" placeholder="Хост (e.g. brmq-dev1)" style="flex:1;">
          <select id="in_env" style="width:80px;"><option>DEV</option><option>TEST</option><option>PROD</option><option>OTHER</option></select>
          <button onclick="addEnv()" style="background:#3b82f6; color:white; font-weight:bold;">+</button>
        </div>
        <div id="env_list">Загрузка...</div>
      </div>
    </div>

    <!-- SYSTEMS -->
    <div class="panel" style="flex: 1;">
      <div class="panel-head">🖥️ Системы (Table: systems)</div>
      <div class="panel-body">
        <div style="display:flex; gap:5px; margin-bottom:10px;">
          <input id="in_sid" placeholder="SID (e.g. BS_CRM)" style="flex:1;">
          <input id="in_desc" placeholder="Описание" style="flex:2;">
          <button onclick="addSys()" style="background:#3b82f6; color:white;">Добавить</button>
        </div>
        <div id="sys_list">Загрузка...</div>
      </div>
    </div>

  </div>

  <!-- RIGHT COLUMN: TEMPLATE EDITOR -->
  <div class="panel">
    <div class="panel-head">
      <span>📑 Шаблоны ТЗ (Config DB)</span>
      <button onclick="saveSettings('tpl')" style="background:#27ae60; color:white; padding:5px 15px;">💾 Сохранить Шаблоны</button>
    </div>
    <div class="panel-body">

      <!-- Mode Selector -->
      <div style="background:#eff6ff; padding:15px; border-radius:6px; border:1px solid #dbeafe; margin-bottom:15px;">
        <label style="color:#1e40af; font-weight:bold; font-size:12px; display:block; margin-bottom:5px;">Редактируемый режим:</label>
        <select id="mode_sel" onchange="renderTplList()" style="width:100%; padding:8px; border:1px solid #93c5fd; font-weight:600;">
          <option value="sync">Синхронный (Request-Response)</option>
          <option value="async">Асинхронный (One-Way)</option>
          <option value="multi">Мульти-обмен (Complex)</option>
        </select>
        <div style="font-size:11px; color:#666; margin-top:5px;">Выберите режим для настройки разделов документа.</div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <b style="font-size:13px; color:#333;">Список разделов:</b>
        <button onclick="addItem()" class="secondary" style="font-size:11px;">+ Добавить раздел</button>
      </div>

      <ul id="tpl_list" class="dd-list" style="padding-bottom:50px; min-height:200px;"></ul>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-wrap" id="modal_edit">
  <div class="modal-win">
    <div style="display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:15px;">
      <h3 style="margin:0;">Настройка Раздела</h3>
      <span onclick="$('#modal_edit').fadeOut(100)" style="cursor:pointer; font-size:20px; color:#aaa;">×</span>
    </div>

    <label style="font-size:12px; font-weight:600;">Тип поля (Логика генерации):</label>
    <select id="m_type" style="width:100%; margin-bottom:15px; background:#f9fafb;">
      <option value="text">Текст (Описание)</option>
      <option value="mermaid">Диаграмма (Mermaid Code)</option>
      <option value="table">Таблица (Col1 | Col2)</option>
      <option value="kv">Пары Ключ-Значение</option>
      <option value="passport">Паспорт (Авто-поля)</option>
      <option value="history">История (Авто-таблица)</option>
    </select>

    <label style="font-size:12px; font-weight:600;">Контент по умолчанию (Рыба):</label>
    <textarea id="m_content" style="width:100%; height:200px; font-family:monospace; font-size:12px; padding:10px; border:1px solid #ccc; border-radius:4px; background:#fafafa;"></textarea>

    <div style="text-align:right; margin-top:15px;">
      <button onclick="$('#modal_edit').fadeOut(100)" class="secondary">Отмена</button>
      <button onclick="saveModal()" style="background:#2563eb; color:white; border:none; margin-left:10px; padding:8px 20px;">Применить</button>
    </div>
  </div>
</div>

<script>
  // === DEFAULTS ===
  const DEF_TPL = {
    sync: [
      {id:'pass', title:'1. Паспорт документа', type:'passport', val:''},
      {id:'hist', title:'2. Лист изменений', type:'history', val:''},
      {id:'desc', title:'3. Краткое описание', type:'text', val:'Взаимодействие синхронное.'},
      {id:'diag', title:'4. Сценарий (Diagram)', type:'mermaid', val:'sequenceDiagram\nS->>E: Req\nE->>R: Call\nR-->>E: Resp\nE-->>S: Final'},
      {id:'tech', title:'5. Технические детали', type:'text', val:''}
    ],
    async: [
      {id:'pass', title:'1. Паспорт', type:'passport'},
      {id:'diag', title:'2. Схема (Async)', type:'mermaid', val:'sequenceDiagram\nS->>Q: Msg'},
      {id:'tech', title:'3. Параметры очереди', type:'table', val:'Queue | DLQ | Size\nNAME.IN | NAME.DLQ | 10MB'}
    ],
    multi: [
      {id:'pass', title:'1. Паспорт', type:'passport'},
      {id:'desc', title:'2. Описание', type:'text'},
      {id:'diag', title:'3. Complex Schema', type:'mermaid', val:'sequenceDiagram\npar Parallel\n S->>E: 1\n S->>B: 2\nend'},
      {id:'map',  title:'5. Маппинги', type:'table', val:'Src | Dst | Rule'}
    ]
  };

  // State
  let DATA_ENV = [];
  let DATA_SYS = [];
  let DATA_TPL = {};
  let editIdx = -1;

  // === INIT ===
  $(function(){
    loadInitialData();
    initDnD();
  });

  function loadInitialData() {
    // 1. Load Systems (from SQLite Table)
    $.get('/api/systems', function(data) {
      DATA_SYS = data || []; // expects [{id, sid, description}]
      renderSys();
    }).fail(()=> $('#sys_list').text('Ошибка загрузки систем'));

    // 2. Load Settings (Env & Templates) from SQLite 'task_settings' table
    $.get('/api/tasks/settings', function(data) {
      // Envs
      try {
        DATA_ENV = data.env_dictionary ? JSON.parse(data.env_dictionary) : [];
      } catch(e) { DATA_ENV = []; }
      if(!DATA_ENV.length) {
        DATA_ENV = [{host:'fesb-dev',type:'DEV'},{host:'fesb-prod',type:'PROD'}];
      }
      renderEnv();

      // Templates
      try {
        DATA_TPL = data.doc_structure_templates ? JSON.parse(data.doc_structure_templates) : JSON.parse(JSON.stringify(DEF_TPL));
      } catch(e) { DATA_TPL = JSON.parse(JSON.stringify(DEF_TPL)); }
      renderTplList();

    }).fail(() => alert('Ошибка подключения к БД'));
  }

  // === ENVIRONMENTS (JSON Blob in DB) ===
  function renderEnv() {
    const c = $('#env_list').empty();
    DATA_ENV.forEach((e, i)=>{
      let bg = '#64748b';
      if(e.type==='PROD') bg='#16a34a';
      if(e.type==='TEST') bg='#ca8a04';
      if(e.type==='DEV') bg='#0284c7';

      c.append(`
            <div class="list-item">
                <span>${e.host} <span class="badge" style="background:${bg};margin-left:5px;">${e.type}</span></span>
                <button class="btn-rem" onclick="delEnv(${i})">×</button>
            </div>`);
    });
  }

  window.addEnv = () => {
    const h = $('#in_host').val();
    if(!h) return;
    DATA_ENV.push({host:h, type:$('#in_env').val()});
    renderEnv();
    // Auto save or wait for button?
    // Button "Save" provided for config
  };

  window.delEnv = (i) => {
    DATA_ENV.splice(i,1);
    renderEnv();
  };

  // === SYSTEMS (Relational Table in DB) ===
  function renderSys() {
    const c = $('#sys_list').empty();
    DATA_SYS.forEach((s) => {
      c.append(`<div class="list-item">
            <div style="flex:1"><b>${escapeHtml(s.sid)}</b> <span class="desc">${escapeHtml(s.description)}</span></div>
            <button class="btn-rem" onclick="delSys(${s.id})">×</button>
        </div>`);
    });
  }

  window.addSys = () => {
    const sid = $('#in_sid').val().trim();
    const desc = $('#in_desc').val().trim();
    if(!sid) return;

    $.ajax({
      url: '/api/systems',
      type: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({ sid: sid, description: desc }),
      success: () => {
        $('#in_sid').val(''); $('#in_desc').val('');
        // Reload list to get IDs
        $.get('/api/systems', (d) => { DATA_SYS = d; renderSys(); });
      },
      error: (xhr) => alert("Ошибка добавления: " + xhr.responseText)
    });
  };

  window.delSys = (id) => {
    if(!confirm('Удалить систему?')) return;
    $.ajax({
      url: '/api/systems',
      type: 'DELETE',
      contentType: 'application/json',
      data: JSON.stringify({ id: id }),
      success: () => {
        DATA_SYS = DATA_SYS.filter(x => x.id !== id);
        renderSys();
      },
      error: (xhr) => alert("Ошибка удаления")
    });
  };

  // === TEMPLATES (JSON Blob in DB) ===
  window.renderTplList = () => {
    const m = $('#mode_sel').val();
    const list = DATA_TPL[m] || [];
    const c = $('#tpl_list').empty();

    list.forEach((it, i) => {
      const safeType = (it.type || 'text').toUpperCase();
      c.append(`
         <li class="dd-item" draggable="true" data-idx="${i}">
             <div class="dd-handle">☰</div>
             <div class="item-inputs">
                 <input value="${escapeHtml(it.title)}" class="title-input" onchange="uTitle(${i},this.value)">
                 <span class="type-label" onclick="openMod(${i})" title="Нажми чтобы изменить контент">${safeType} ⚙</span>
             </div>
             <button class="btn-rem" onclick="delIt(${i})">×</button>
         </li>
      `);
    });
    initDnD(); // Rebind
  };

  window.addItem = () => {
    const m = $('#mode_sel').val();
    if(!DATA_TPL[m]) DATA_TPL[m] = [];
    DATA_TPL[m].push({id:'new'+Math.random(), title:'Новый раздел', type:'text', val:''});
    renderTplList();
  };

  window.delIt = (i) => {
    if(confirm('Удалить раздел?')) {
      DATA_TPL[$('#mode_sel').val()].splice(i,1);
      renderTplList();
    }
  };

  window.uTitle = (i,v) => { DATA_TPL[$('#mode_sel').val()][i].title = v; };

  // === SAVE SETTINGS ===
  window.saveSettings = (type) => {
    const payload = {};
    if(type === 'envs') payload.env_dictionary = JSON.stringify(DATA_ENV);
    if(type === 'tpl') payload.doc_structure_templates = JSON.stringify(DATA_TPL);

    $.ajax({
      url: '/api/tasks/settings',
      type: 'POST',
      contentType: 'application/json',
      data: JSON.stringify(payload),
      success: () => alert('Настройки сохранены в базе данных!'),
      error: () => alert('Ошибка сохранения')
    });
  };

  // === MODAL LOGIC ===
  window.openMod = (i) => {
    editIdx = i;
    const m = $('#mode_sel').val();
    const item = DATA_TPL[m][i];
    $('#m_type').val(item.type || 'text');
    $('#m_content').val(item.val || item.defaultContent || '');
    $('#modal_edit').fadeIn(100);
  };

  window.saveModal = () => {
    const m = $('#mode_sel').val();
    DATA_TPL[m][editIdx].type = $('#m_type').val();
    DATA_TPL[m][editIdx].val = $('#m_content').val();
    // Gen UID
    if(!DATA_TPL[m][editIdx].id || DATA_TPL[m][editIdx].id.startsWith('new')) {
      DATA_TPL[m][editIdx].id = $('#m_type').val().substring(0,3) + Math.random().toString(36).substr(2,5);
    }
    $('#modal_edit').fadeOut(100);
    renderTplList();
  };

  // === UTILS ===
  function escapeHtml(text) {
    if (!text) return '';
    return $('<div>').text(text).html();
  }

  // === DRAG & DROP (NATIVE) ===
  function initDnD() {
    const list = document.getElementById('tpl_list');
    let dragging = null;

    list.querySelectorAll('li').forEach(li => {
      li.addEventListener('dragstart', () => {
        dragging = li;
        setTimeout(() => li.classList.add('dragging'), 0);
      });
      li.addEventListener('dragend', () => {
        li.classList.remove('dragging');
        dragging = null;
        saveOrder();
      });
    });

    list.addEventListener('dragover', (e) => {
      e.preventDefault();
      const after = getAfter(list, e.clientY);
      if(after) list.insertBefore(dragging, after); else list.appendChild(dragging);
    });
  }

  function saveOrder() {
    const m = $('#mode_sel').val();
    const oldList = DATA_TPL[m];
    const newList = [];
    $('#tpl_list li').each((_, el) => {
      const idx = $(el).data('idx');
      newList.push(oldList[idx]);
    });
    DATA_TPL[m] = newList;
    renderTplList(); // Re-index
  }

  function getAfter(cont, y) {
    return [...cont.querySelectorAll('li:not(.dragging)')].reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const off = y - box.top - box.height/2;
      return off < 0 && off > closest.off ? {off, el:child} : closest;
    }, {off: -Infinity}).el;
  }

</script>
</body>
</html>
