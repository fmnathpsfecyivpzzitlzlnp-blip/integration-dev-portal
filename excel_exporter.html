<!DOCTYPE html>
<html>
<head>
    <title>JSON to Excel Structure</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: calc(100vh - 40px); }
        h2 { margin-top: 0; }
        textarea { width: 100%; flex-grow: 1; font-family: monospace; font-size: 14px; box-sizing: border-box; margin-top: 10px; }
        button { padding: 10px 15px; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

<h2>Экспорт структуры JSON в Excel</h2>
<p>Вставьте ваш JSON в поле ниже и нажмите кнопку, чтобы скачать `.xlsx` файл со структурой данных.</p>

<button id="exportBtn">Скачать структуру в Excel</button>
<div id="error-panel" style="display: none; padding: 10px; background: #ffebee; color: #c62828; border: 1px solid #c62828; margin-top: 10px;"></div>

<textarea id="json-input" placeholder="Вставьте сюда ваш JSON..."></textarea>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $(function () {
        const errorPanel = $('#error-panel');

        $('#exportBtn').on('click', function() {
            errorPanel.hide();
            const jsonText = $('#json-input').val();
            if (!jsonText.trim()) {
                alert("Пожалуйста, вставьте JSON-данные.");
                return;
            }

            // Создаем форму и отправляем POST-запрос для скачивания файла
            // AJAX не подходит для скачивания файлов напрямую
            var form = $('<form></form>').attr('action', '/api/export-to-excel').attr('method', 'post');
            form.append($('<input></input>').attr('type', 'hidden').attr('name', 'json').attr('value', jsonText));
            form.appendTo('body').submit().remove();
        });

        // Перехват отправки для AJAX, чтобы показать ошибку если она есть
        // Не работает для скачивания, поэтому оставляем как есть, но для сложных сценариев потребовалась бы другая логика
        $(document).ajaxError(function(event, jqxhr, settings, thrownError) {
            if (settings.url === '/api/export-to-excel') {
                errorPanel.text('Ошибка экспорта: ' + jqxhr.responseText).show();
            }
        });

        const exampleJson = `{ ... }`; // Вставьте ваш пример JSON сюда
        $('#json-input').val(exampleJson);
    });
</script>

</body>
</html>
