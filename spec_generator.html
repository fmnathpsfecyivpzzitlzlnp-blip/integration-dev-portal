<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор Спецификации (DB Mode)</title>
    <!-- Библиотеки -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <!-- Общие стили -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* === Layout Styles === */
        body { background:#f4f7f9; margin:0; height:100vh; display:flex; flex-direction:column; overflow:hidden; font-family:'Segoe UI', sans-serif; }

        /* Header */
        .header {
            background:#2c3e50; height:50px; display:flex; justify-content:space-between; align-items:center;
            padding:0 20px; color:#fff; flex-shrink:0; box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        .btn-nav { background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.25); color:white; padding:5px 12px; border-radius:4px; cursor:pointer; font-size:13px; }
        .btn-nav:hover { background:rgba(255,255,255,0.3); }

        .header-right { display:flex; gap:10px; align-items: center; }
        .btn-action { border:none; padding:7px 15px; border-radius:4px; font-weight:600; cursor:pointer; color:white; font-size:13px; transition: opacity 0.2s; }
        .btn-action:hover { opacity: 0.9; }
        .save-status { font-size: 11px; color: #bbb; margin-right: 10px; font-style: italic; }

        .workspace { display:flex; flex:1; overflow:hidden; }

        /* Sidebar */
        .sidebar { width:540px; min-width:540px; background:#fff; border-right:1px solid #ccc; display:flex; flex-direction:column; z-index:2; box-shadow:2px 0 10px rgba(0,0,0,0.05); }
        .sb-scroll { flex:1; overflow-y:auto; padding:15px; }
        .sb-footer { padding:10px; background:#f8f9fa; border-top:1px solid #eee; text-align:center; color:#888; font-size:11px; }

        /* Blocks */
        .block { background:#fff; border:1px solid #ddd; border-radius:6px; padding:12px; margin-bottom:15px; }
        .block-head {
            font-size:11px; font-weight:bold; color:#95a5a6; text-transform:uppercase;
            border-bottom:1px solid #eee; padding-bottom:5px; margin-bottom:10px;
        }

        /* Controls */
        label { display:block; font-size:12px; font-weight:600; color:#374151; margin-bottom:4px; }
        input, select, textarea { width:100%; padding:7px; font-size:13px; border:1px solid #d1d5db; border-radius:4px; box-sizing:border-box; margin-bottom:8px; font-family:inherit; }
        input:focus, textarea:focus { border-color:#3b82f6; outline:none; }
        textarea.code { font-family:'Consolas', monospace; background:#282c34; color:#abb2bf; font-size:12px; line-height:1.5; resize:vertical; }

        /* Helper */
        .help-box {
            background: #fffbeb; border: 1px solid #fcd34d; padding: 8px; border-radius: 4px; font-size: 11px; display:none; margin-bottom:8px;
        }
        .help-row { display:flex; justify-content:space-between; border-bottom:1px dashed #fae8b0; padding:3px 0; color:#92400e; }
        .help-row span.code-snippet { font-family:monospace; font-weight:bold; background:rgba(255,255,255,0.6); padding:0 4px; border-radius:3px; color:#b45309; }

        /* Sections (Accordion) */
        .acc-item { border:1px solid #e5e7eb; background:#fff; border-radius:4px; margin-bottom:5px; overflow:hidden; transition: box-shadow 0.2s; }
        .acc-head {
            padding:10px; background:#f9fafb; cursor:pointer; font-weight:500; font-size:13px; display:flex; align-items:center; user-select:none;
        }
        .acc-head:hover { background:#f0f9ff; }
        .acc-body { padding:10px; border-top:1px solid #e5e7eb; display:none; background:#fff; }

        .btn-icon { background:none; border:none; cursor:pointer; font-size:16px; color:#ef4444; margin-left:auto; padding:0 5px;}
        .drag-h { color:#ccc; margin-right:10px; cursor:grab; font-size:14px; }

        /* Preview */
        .preview-zone { flex:1; background:#525659; overflow-y:auto; display:flex; justify-content:center; padding:40px; }
        .a4-page {
            width:210mm; min-height:297mm; background:#fff; padding:20mm; box-shadow:0 0 20px rgba(0,0,0,0.5); box-sizing:border-box;
            font-family: 'Times New Roman', serif; color:#000; font-size:12pt; line-height:1.4;
        }

        /* Document Content Styles */
        h1 { font-family:Arial,sans-serif; font-size:18pt; color:#1e40af; border-bottom:2px solid #1e40af; margin:0 0 25px 0; }
        h2 { font-family:Arial,sans-serif; font-size:14pt; color:#111827; margin:25px 0 10px 0; font-weight:bold; }
        p, li { margin-bottom:6px; text-align:justify; }
        table { width:100%; border-collapse:collapse; margin-bottom:15px; font-family:Arial,sans-serif; font-size:10pt; }
        th, td { border:1px solid #000; padding:5px; vertical-align:top; text-align:left; }
        th { background:#f3f4f6; font-weight:bold; }
        .mermaid { text-align:center; margin:20px 0; }

        /* Modal */
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; display:none; }
        .modal-win { width:400px; background:#fff; margin:15% auto; padding:20px; border-radius:6px; box-shadow:0 10px 25px rgba(0,0,0,0.3); }
        .tags-cloud { display:flex; gap:5px; flex-wrap:wrap; margin:10px 0; }
        .tag { background:#eef2ff; color:#4f46e5; font-size:11px; padding:4px 10px; border-radius:12px; border:1px solid #c7d2fe; cursor:pointer; }
        .tag:hover { background:#e0e7ff; }
    </style>
</head>
<body>

<div class="header">
    <div style="display:flex; align-items:center; gap:15px;">
        <button class="btn-nav" onclick="window.location.href='task_tracker.html'">← Назад к задачам</button>
        <h3 style="margin:0;">Генератор Спецификации</h3>
        <span id="ver_label" style="background:rgba(255,255,255,0.2); padding:2px 6px; font-size:11px; border-radius:4px;">v0.0</span>
    </div>
    <div class="header-right">
        <span class="save-status" id="save_indicator">Все изменения сохранены</span>
        <button class="btn-action" onclick="doAutoFill()" style="background:#f59e0b;">⚡ Авто-заполнение из БД</button>
        <button class="btn-action" onclick="showSave()" style="background:#27ae60;">💾 Новая версия</button>
        <button class="btn-action" onclick="dl()" style="background:#3b82f6;">📥 Скачать HTML</button>
    </div>
</div>

<div class="workspace">
    <div class="sidebar">
        <div class="sb-scroll">

            <!-- 1. НАСТРОЙКИ -->
            <div class="block">
                <div class="block-head">1. Контекст интеграции</div>
                <label>Режим (Шаблон диаграммы):</label>
                <select id="in_mode" onchange="applyTemplate(true)">
                    <option value="sync">Синхронный (REST/SOAP)</option>
                    <option value="async">Асинхронный (One-Way)</option>
                    <option value="multi">Мульти-обмен (Complex)</option>
                </select>

                <div style="display:flex; gap:5px;">
                    <div style="flex:1">
                        <label style="color:#27ae60;">Отправитель (Sender)</label>
                        <input type="text" id="in_s" value="SENDER" oninput="updGlobal();">
                    </div>
                    <div style="flex:1">
                        <label style="color:#c0392b;">Получатель (Receiver)</label>
                        <input type="text" id="in_r" value="RECEIVER" oninput="updGlobal();">
                    </div>
                </div>
            </div>

            <!-- 2. СТРУКТУРА ДОКУМЕНТА -->
            <div class="block">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; align-items:center;">
                    <div class="block-head" style="margin:0; border:none;">2. Разделы Документа</div>
                    <div>
                        <a href="#" onclick="addSec()" style="font-size:11px; color:#2563eb; margin-right:10px;">+ Добавить</a>
                        <a href="#" onclick="resetAll()" style="font-size:11px; color:#dc2626;">Сброс</a>
                    </div>
                </div>
                <div id="list_area"></div>
            </div>

        </div>
        <div class="sb-footer">Данные сохраняются в базе (SQLite)</div>
    </div>

    <div class="preview-zone">
        <div class="a4-page" id="doc_output"></div>
    </div>
</div>

<!-- MODAL SAVE -->
<div class="modal-overlay" id="modal_save">
    <div class="modal-win">
        <h3 style="margin-top:0;">Сохранить версию</h3>
        <label>Комментарий (для Истории изменений):</label>
        <div class="tags-cloud">
            <span class="tag" onclick="setComm(this)">Создание черновика</span>
            <span class="tag" onclick="setComm(this)">Добавлены диаграммы</span>
            <span class="tag" onclick="setComm(this)">Заполнены методы</span>
            <span class="tag" onclick="setComm(this)">Согласовано</span>
        </div>
        <textarea id="ver_comment" style="height:60px;" placeholder="Описание изменений..."></textarea>
        <div style="text-align:right; margin-top:15px;">
            <button onclick="$('#modal_save').fadeOut()" style="background:none; border:1px solid #ddd; padding:6px 12px; cursor:pointer; border-radius:4px; margin-right:5px;">Отмена</button>
            <button onclick="commitVersion()" style="background:#27ae60; border:none; color:white; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer;">Сохранить</button>
        </div>
    </div>
</div>

<script>
    // === CONFIGURATION ===
    const urlParams = new URLSearchParams(location.search);
    const TASK_ID = urlParams.get('task_id');
    // Имя документа в БД для этой задачи
    const DOC_NAME = `SPEC_DRAFT_TASK_${TASK_ID}`;

    // Диаграммы по умолчанию
    const DIAG_PRESETS = {
        sync: `sequenceDiagram\nautonumber\nparticipant S as SENDER\nparticipant E as ESB\nparticipant R as RECEIVER\nS->>E: Request\nactivate E\nE->>R: Call Service\nactivate R\nR-->>E: Response\ndeactivate R\nE-->>S: Final Result\ndeactivate E`,
        async: `sequenceDiagram\nautonumber\nparticipant S as SENDER\nparticipant Q as Queue/Topic\nparticipant R as RECEIVER\nS->>Q: Publish Message\nactivate S\nQ-->>S: Ack\ndeactivate S\nQ--)R: Consume (Trigger)\nactivate R\nNote right of R: Async Processing\ndeactivate R`,
        multi: `sequenceDiagram\nautonumber\nparticipant S as SENDER\nparticipant E as ESB\nparticipant A as SUB_SYSTEM_A\nparticipant B as SUB_SYSTEM_B\nS->>E: 1. Init (Async)\nactivate S\nE-->>S: 2. Ack 200 OK\ndeactivate S\npar Parallel Enrichment\n E->>A: Get Info\n E->>B: Validate User\nend\nE->>E: Map Data\nE->>S: 3. Final Callback\ndeactivate E`
    };

    const DEFAULT_STRUCT = [
        {id:'pass', title:'Паспорт документа', type:'passport'},
        {id:'chg', title:'Лист изменений', type:'history'},
        {id:'desc', title:'Краткое описание', type:'text'},
        {id:'diag', title:'Сценарий (Diagram)', type:'mermaid'},
        {id:'flow', title:'Особенности реализации', type:'text'},
        {id:'map', title:'Описание интерфейсов', type:'table'}
    ];

    let state = {
        ver: '0.1',
        mode: 'sync',
        sys: {s:'', r:''},
        sections: [],
        content: {},
        history: []
    };

    $(function(){
        if(!TASK_ID) {
            alert("Ошибка: Нет ID задачи в URL");
            return;
        }

        mermaid.initialize({startOnLoad:false, theme:'default'});

        loadFromDB();
    });

    // === LOAD / SAVE to SQLITE via Server.groovy ===

    function loadFromDB() {
        // 1. Получаем список документов
        $.get('/api/documents', function(docs) {
            // Ищем документ с нашим именем
            const found = docs.find(d => d.name === DOC_NAME);

            if(found) {
                // 2. Если есть, грузим контент
                $.get('/api/documents/' + found.id, function(jsonStr) {
                    try {
                        const loadedState = JSON.parse(jsonStr);
                        state = loadedState;
                        initUI();
                    } catch(e) {
                        console.error("Parse error", e);
                        initNew();
                    }
                });
            } else {
                // 3. Если нет, инициализируем новый
                initNew();
            }
        }).fail(() => initNew()); // Fallback
    }

    function saveToDB() {
        $('#save_indicator').text('Сохранение...').css('color','#f59e0b');

        // Мы используем эндпоинт сохранения документов (generic storage)
        const payload = {
            name: DOC_NAME,
            content: JSON.stringify(state)
        };

        $.ajax({
            url: '/api/documents',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            success: function() {
                $('#save_indicator').text('Сохранено').css('color','#aaa');
            },
            error: function(x) {
                $('#save_indicator').text('Ошибка сохранения').css('color','red');
                console.error(x.responseText);
            }
        });
    }

    function initNew() {
        state.mode = 'sync';
        state.sys = {s:'SENDER', r:'RECEIVER'};
        state.history = [{ver:'0.1', date:new Date().toLocaleDateString(), author:'System', comment:'Создание черновика'}];
        state.sections = JSON.parse(JSON.stringify(DEFAULT_STRUCT)).map(t => ({
            ...t, uid: genUID()
        }));
        const dSec = state.sections.find(s=>s.type==='mermaid');
        if(dSec) state.content[dSec.uid] = DIAG_PRESETS.sync;

        initUI();
    }

    function initUI() {
        $('#in_mode').val(state.mode);
        $('#in_s').val(state.sys.s);
        $('#in_r').val(state.sys.r);
        $('#ver_label').text('v'+state.ver);
        renderList();
        renderDoc();
    }

    // === AUTO FILL LOGIC (SQlite Sources) ===

    async function doAutoFill() {
        const btn = $('button[onclick="doAutoFill()"]');
        btn.prop('disabled', true).text('Загрузка из БД...');

        try {
            // 1. Получаем список потоков из таблицы integration_flows
            const flows = await $.get(`/api/flows?task_id=${TASK_ID}`);

            if(!flows || flows.length === 0) {
                alert('В "Организации Сервиса" (БД) нет сохраненных потоков для этой задачи!');
                return;
            }

            // 2. Устанавливаем хедер (отправитель 1-го и получатель последнего)
            const newS = flows[0].sender;
            const newR = flows[flows.length-1].receiver;
            $('#in_s').val(newS); state.sys.s = newS;
            $('#in_r').val(newR); state.sys.r = newR;

            // 3. Собираем текст
            let descText = `### Интеграционные потоки (${flows.length})\n`;
            let mapText = "";

            // Используем Promise.all для параллельной загрузки деталей
            const detailPromises = flows.map(flow => {
                return $.get(`/api/flow-details?task_id=${TASK_ID}&flow_order=${flow.order_num}`)
                    .then(details => ({ flow, details }))
                    .catch(() => ({ flow, details: {} }));
            });

            const results = await Promise.all(detailPromises);

            results.forEach((res, i) => {
                const f = res.flow;
                const d = res.details || {};

                descText += `\n**${i+1}. ${f.sender} -> ${f.receiver}**\n`;
                if(d.protocol) descText += `- Протокол: ${d.protocol}\n`;
                if(d.format) descText += `- Формат: ${d.format}\n`;
                if(d.connection_type) descText += `- Тип: ${d.connection_type}\n`;
                if(d.description) descText += `- Описание: ${d.description}\n`;
                if(d.file_path && d.file_path.startsWith('http')) descText += `- Ссылка: [Spec](${d.file_path})\n`;

                // Таблица структуры
                if(d.service_description) {
                    mapText += `\n#### Поток ${i+1}: ${f.sender} -> ${f.receiver}\nStructure:\n` + d.service_description + "\n";
                }
            });

            // 4. Вставляем в разделы

            // A. Текстовое описание
            const targetDesc = state.sections.find(s =>
                s.type === 'text' &&
                (s.title.toLowerCase().includes('особенности') || s.title.toLowerCase().includes('потоки'))
            );

            if(targetDesc) {
                state.content[targetDesc.uid] = (state.content[targetDesc.uid] || '') + "\n" + descText;
            } else {
                // Если нет подходящего раздела, создаем новый
                const newUid = genUID();
                state.sections.push({id: 'auto_flows', title: 'Интеграционные потоки (Авто)', type: 'text', uid: newUid});
                state.content[newUid] = descText;
            }

            // B. Маппинги / Структуры
            if (mapText) {
                const targetMap = state.sections.find(s => s.title.toLowerCase().includes('интерфейс') || s.title.toLowerCase().includes('маппинг'));
                if(targetMap) {
                    state.content[targetMap.uid] = (state.content[targetMap.uid] || '') + "\n" + mapText;
                }
            }

            alert('Данные из базы успешно добавлены в разделы документа!');
            renderList();
            renderDoc();
            saveToDB();

        } catch (e) {
            console.error(e);
            alert('Ошибка автозаполнения: ' + e.statusText);
        } finally {
            btn.prop('disabled', false).text('⚡ Авто-заполнение из БД');
        }
    }

    // === LOGIC ===

    function commitVersion() {
        const c = $('#ver_comment').val().trim() || 'Update';
        let nv = parseFloat(state.ver) + 0.1;
        state.ver = nv.toFixed(1);
        state.history.unshift({
            ver: state.ver,
            date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString(),
            author: 'User',
            comment: c
        });
        $('#ver_label').text('v'+state.ver);
        $('#modal_save').fadeOut();
        saveToDB();
        renderDoc();
        renderList(); // update history
    }

    function showSave() { $('#modal_save').fadeIn(); $('#ver_comment').focus(); }
    function setComm(el) { $('#ver_comment').val($(el).text()); }

    function applyTemplate(force) {
        if(force && !confirm('Смена режима очистит текущую структуру. Продолжить?')) {
            $('#in_mode').val(state.mode); return;
        }
        const m = $('#in_mode').val();
        // Можно подтянуть шаблон из БД (через task_settings doc_templates), но для простоты пока default
        // ToDo: Implement fetching templates from DB in init
        const list = JSON.parse(JSON.stringify(DEFAULT_STRUCT));

        state.mode = m;
        state.sections = list.map(t => ({ ...t, uid: genUID() }));
        state.content = {};
        const duid = state.sections.find(x=>x.type==='mermaid')?.uid;
        if(duid) state.content[duid] = DIAG_PRESETS[m];

        renderList(); renderDoc(); saveToDB();
    }

    window.updGlobal = () => {
        state.sys.s = $('#in_s').val();
        state.sys.r = $('#in_r').val();
        delayedSave();
        renderDoc();
    };

    // === RENDERING ===

    function renderList() {
        const c = $('#list_area').empty();
        state.sections.forEach((sec, idx) => {
            let body = '';
            const v = state.content[sec.uid] || '';

            if(sec.type === 'mermaid') {
                body = `<div style="font-size:11px;color:#999;">Редактор диаграммы</div><textarea class="code" style="height:160px" oninput="updData('${sec.uid}',this.value)">${v}</textarea>`;
            } else if (sec.type.includes('table') || sec.type === 'kv') {
                body = `<textarea style="height:120px" placeholder="Колонка1 | Колонка2\nVal 1 | Val 2" oninput="updData('${sec.uid}',this.value)">${v}</textarea>`;
            } else if (sec.type === 'history' || sec.type === 'passport') {
                body = `<div style="background:#f3f4f6;padding:10px;font-size:12px;color:#666;text-align:center;">Заполняется автоматически</div>`;
            } else {
                body = `<textarea style="height:100px" oninput="updData('${sec.uid}',this.value)">${v}</textarea>`;
            }

            const el = $(`
                <div class="acc-item draggable" draggable="true" data-idx="${idx}">
                    <div class="acc-head" onclick="$(this).next().slideToggle()">
                        <span class="drag-h">☰</span> <span>${sec.title}</span>
                        <button class="btn-icon" onclick="remSec(${idx}); event.stopPropagation()">×</button>
                    </div>
                    <div class="acc-body">${body}</div>
                </div>
            `);
            c.append(el);
        });
        bindDnD();
    }

    function renderDoc() {
        const out = $('#doc_output').empty();
        const S = $('#in_s').val();
        const R = $('#in_r').val();

        state.sections.forEach(sec => {
            let h = '';
            let v = state.content[sec.uid] || '';

            // Aliases replacer
            if(sec.type === 'mermaid') {
                v = v.replace(/SENDER/g, S).replace(/RECEIVER/g, R);
                h = `<div class="mermaid">${v}</div>`;
            } else if (sec.type === 'passport') {
                h = `<table>
                     <tr><td width="30%" style="background:#f8f9fa"><b>ID Задачи</b></td><td>${TASK_ID}</td></tr>
                     <tr><td style="background:#f8f9fa"><b>Инициатор</b></td><td>${S}</td></tr>
                     <tr><td style="background:#f8f9fa"><b>Получатель</b></td><td>${R}</td></tr>
                     <tr><td style="background:#f8f9fa"><b>Версия</b></td><td>${state.ver}</td></tr>
                     <tr><td style="background:#f8f9fa"><b>Дата</b></td><td>${new Date().toLocaleDateString()}</td></tr>
                 </table>`;
            } else if (sec.type === 'history') {
                const r = state.history.map(row=>`<tr><td>${row.ver}</td><td>${row.date}</td><td>${row.author}</td><td>${row.comment}</td></tr>`).join('');
                h = `<table><thead><tr><th width="50">Ver</th><th width="120">Дата</th><th>Автор</th><th>Описание</th></tr></thead><tbody>${r}</tbody></table>`;
            } else if (sec.type.includes('table')) {
                const trs = v.split('\n').map(l => l.trim()).filter(l=>l).map(l => {
                    return `<tr><td>` + l.split('|').join('</td><td>') + `</td></tr>`;
                }).join('');
                h = trs ? `<table>${trs}</table>` : '<p style="color:#ccc; font-style:italic;">Нет данных</p>';
            } else {
                // Simple Markdown-like
                let html = v
                    .replace(/### (.*)/g, '<h3>$1</h3>')
                    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                    .replace(/- (.*)/g, '<li>$1</li>')
                    .replace(/\n/g, '<br>');
                h = `<div>${html}</div>`;
            }

            out.append(`<div><h2>${sec.title}</h2>${h}</div>`);
        });

        // Init mermaid
        $('.mermaid').removeAttr('data-processed');
        try { mermaid.init(undefined, $('.mermaid')); } catch(e){}
    }

    window.updData = (uid, v) => {
        state.content[uid] = v;
        renderDoc();
        delayedSave();
    }

    let _dsTimer;
    function delayedSave() {
        clearTimeout(_dsTimer);
        _dsTimer = setTimeout(saveToDB, 1000);
    }

    window.addSec = () => {
        state.sections.push({title:'Новый раздел', type:'text', uid:genUID()});
        renderList(); renderDoc(); saveToDB();
    }
    window.remSec = (i) => {
        if(confirm('Удалить?')){ state.sections.splice(i,1); renderList(); renderDoc(); saveToDB(); }
    }
    window.resetAll = () => {
        if(confirm('Сбросить весь документ к шаблону?')){ applyTemplate(true); }
    }

    window.dl = () => {
        const html = `<html><head><meta charset="UTF-8"><title>Spec ${TASK_ID}</title><style>
            body{padding:40px;font-family:Arial;color:#333} h1{color:#1e40af;border-bottom:2px solid #1e40af}
            h2{background:#f3f4f6;padding:5px;border-left:5px solid #1e40af}
            table{width:100%;border-collapse:collapse;margin:15px 0;font-size:13px} td,th{border:1px solid #ccc;padding:6px}
            th{background:#eee}
        </style></head><body>${$('#doc_output').html()}</body></html>`;

        const blob = new Blob([html], {type:'text/html'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Specification_${TASK_ID}_v${state.ver}.html`;
        a.click();
    }

    function genUID() { return Math.random().toString(36).substr(2,8); }

    // Drag & Drop (Same as logic)
    function bindDnD() {
        const list = document.querySelector('#list_area');
        let dragged = null;
        list.querySelectorAll('.acc-item').forEach(el => {
            el.addEventListener('dragstart', e => { dragged=el; e.dataTransfer.effectAllowed='move'; });
            el.addEventListener('dragend', () => {
                // Sync
                const newSec = [];
                $('#list_area .acc-item').each((i, n) => newSec.push(state.sections[$(n).data('idx')]));
                state.sections = newSec;
                renderList(); renderDoc(); saveToDB();
            });
        });
        list.addEventListener('dragover', e => {
            e.preventDefault();
            const after = [...list.querySelectorAll('.acc-item:not(.dragging)')].reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = e.clientY - box.top - box.height / 2;
                return offset < 0 && offset > closest.offset ? { offset: offset, element: child } : closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
            if (after == null) list.appendChild(dragged); else list.insertBefore(dragged, after);
        });
    }

</script>
</body>
</html>
