<!DOCTYPE html>
<html>
<head>
    <title>JSON Schema Generator</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="main-content generator-page-container">
    <h2 style="flex-shrink: 0;">Генератор JSON Schema</h2>
    <div class="generator-controls">
        <button id="generateBtn" style="padding: 10px 15px;">Сгенерировать схему</button>
    </div>
    <div id="error-panel" style="display:none; padding:10px; background:#ffebee; color:#c62828; border:1px solid #c62828; margin-bottom:10px;"></div>

    <div class="generator-columns-container">
        <div class="generator-panel">
            <label for="json-input">Входной JSON:</label>
            <textarea id="json-input" placeholder="Вставьте сюда ваш JSON..."></textarea>
        </div>
        <div class="generator-panel">
            <label for="schema-output">Сгенерированная JSON Schema:</label>
            <textarea id="schema-output" readonly></textarea>
        </div>
    </div>
</div>
<script src="libs/jquery-3.6.0.min.js"></script>
<script>
    $(function () {
        const errorPanel = $('#error-panel');
        $('#generateBtn').on('click', function() {
            errorPanel.hide();
            const jsonText = $('#json-input').val();
            if (!jsonText.trim()) return alert("Пожалуйста, вставьте JSON.");

            try { JSON.parse(jsonText); } catch (e) { return alert("Ошибка: невалидный JSON."); }

            $.ajax({
                url: '/api/generate-schema', type: 'POST',
                contentType: 'application/json', data: jsonText,
                success: schema => $('#schema-output').val(JSON.stringify(schema, null, 4)),
                error: xhr => errorPanel.text('Ошибка: ' + (xhr.responseJSON?.message || xhr.responseText)).show()
            });
        });

        const exampleJson = `{
  "Request": {
    "ClientInfo": {
      "INN": "1234567890", "KPP": "123456789", "OGRNIP": null,
      "contactEmails": ["john.doe@example.com"],
      "preferences": { "newsletter": true }
    }
  }
}`;
        $('#json-input').val(exampleJson);
    });
</script>
</body>
</html>
