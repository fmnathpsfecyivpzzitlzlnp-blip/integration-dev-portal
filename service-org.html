<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Организация сервиса</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; margin:0; padding:20px; }
        .container { max-width: 1100px; margin: 0 auto; background: #1e293b; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { background: #4f46e5; padding: 24px; text-align: center; color: white; }
        .header h1 { margin:0; font-size: 26px; }
        .content { padding: 30px; }
        .btn-group { margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
        .btn {
            padding: 12px 24px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .btn-add { background: #6366f1; color: white; }
        .btn-add:hover { background: #4f46e5; }
        .btn-edit { background: #475569; color: white; }
        .btn-edit.active { background: #818cf8; }
        .btn-save { background: #10b981; color: white; font-size: 16px; padding: 16px 36px; margin-top: 20px; }
        .btn-save:hover { background: #059669; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #334155; padding: 16px; text-align: left; font-weight: 600; color: #cbd5e1; }
        td { padding: 14px 16px; border-bottom: 1px solid #334155; vertical-align: middle; }
        tr:hover { background: #334155; }
        tr.dragging { opacity: 0.5; background: #6366f1; }

        select { width: 100%; padding: 10px; background: #334155; color: white; border: 1px solid #475569; border-radius: 8px; font-size: 15px; }
        select:focus { outline: none; border-color: #818cf8; }

        .view-mode { font-weight: 500; }
        .edit-mode { display: none; align-items: center; gap: 12px; }
        .edit-mode.active { display: flex; }
        .arrow { font-weight: bold; color: #818cf8; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Организация сервиса</h1>
        <div style="margin-top:8px; opacity:0.9;">Задача: <span id="task-num">—</span> (ID: <span id="task-id">—</span>)</div>
    </div>

    <div class="content">
        <div class="btn-group">
            <button class="btn btn-add" onclick="addFlow()">Добавить поток</button>
            <button class="btn btn-edit" id="edit-btn" onclick="toggleEdit()">Редактировать</button>
        </div>

        <table>
            <thead>
            <tr>
                <th width="60">#</th>
                <th>Система-отправитель → Система-приёмник</th>
                <th width="180">Действия</th>
            </tr>
            </thead>
            <tbody id="flows-body"></tbody>
        </table>

        <div style="text-align:center; margin-top:30px;">
            <button class="btn btn-save" onclick="saveFlows()">Сохранить потоки</button>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(location.search);
    const taskId = urlParams.get('id');
    if (!taskId) { alert('Ошибка: не указан ID задачи'); history.back(); }

    document.getElementById('task-id').textContent = taskId;

    let allSystems = [];
    let isEditMode = false;
    let currentFlows = []; // храним актуальные данные из БД

    async function init() {
        // Загружаем системы
        const sysRes = await fetch('/api/systems');
        allSystems = await sysRes.json();
        allSystems.sort((a,b) => a.sid.localeCompare(b.sid));

        // Загружаем задачу
        const taskRes = await fetch(`/api/tasks/${taskId}`);
        const task = await taskRes.json();
        document.getElementById('task-num').textContent = task.task_number || '—';

        // Загружаем потоки
        await loadFlowsFromDB();
    }

    async function loadFlowsFromDB() {
        const res = await fetch(`/api/flows?task_id=${taskId}`);
        currentFlows = await res.json(); // [{id, sender, receiver, order_num}, ...]
        currentFlows.sort((a,b) => a.order_num - b.order_num);

        const tbody = document.getElementById('flows-body');
        tbody.innerHTML = '';
        currentFlows.forEach((flow, index) => {
            addFlowRow(flow.sender, flow.receiver, flow.order_num);
        });
        if (currentFlows.length === 0) addFlowRow();
    }

    function createSelect(selected = '') {
        const sel = document.createElement('select');
        allSystems.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.sid;
            opt.textContent = s.sid + (s.description ? ` — ${s.description}` : '');
            if (s.sid === selected) opt.selected = true;
            sel.appendChild(opt);
        });
        return sel;
    }

    function addFlowRow(sender = '', receiver = '', orderNum = null) {
        const tbody = document.getElementById('flows-body');
        const tr = document.createElement('tr');
        tr.draggable = true;
        const displayNum = orderNum || (tbody.children.length + 1);

        tr.innerHTML = `
            <td class="num">${displayNum}</td>
            <td>
                <div class="view-mode">${sender || '—'} <span class="arrow">→</span> ${receiver || '—'}</div>
                <div class="edit-mode">
                    ${createSelect(sender).outerHTML}
                    <span class="arrow">→</span>
                    ${createSelect(receiver).outerHTML}
                </div>
            </td>
            <td>
                <button onclick="openDetails(${displayNum})"
                        style="background:#6366f1; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; margin-right:8px;">
                    Детали
                </button>
                <button onclick="this.closest('tr').remove(); updateNumbers()"
                        style="color:#ef4444; background:none; border:none; cursor:pointer;">
                    Удалить
                </button>
            </td>
        `;

        // Drag & Drop
        tr.addEventListener('dragstart', () => tr.classList.add('dragging'));
        tr.addEventListener('dragover', e => e.preventDefault());
        tr.addEventListener('dragend', () => tr.classList.remove('dragging'));
        tr.addEventListener('drop', e => {
            e.preventDefault();
            const after = getDragAfter(tbody, e.clientY);
            if (after == null) tbody.appendChild(tr);
            else tbody.insertBefore(tr, after);
            updateNumbers();
        });

        tbody.appendChild(tr);
    }

    function getDragAfter(container, y) {
        const els = [...container.querySelectorAll('tr:not(.dragging)')];
        return els.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) return { offset, element: child };
            return closest;
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function updateNumbers() {
        document.querySelectorAll('#flows-body tr').forEach((tr, i) => {
            tr.querySelector('.num').textContent = i + 1;
        });
    }

    window.toggleEdit = function() {
        isEditMode = !isEditMode;
        document.querySelectorAll('.view-mode').forEach(el => el.style.display = isEditMode ? 'none' : 'block');
        document.querySelectorAll('.edit-mode').forEach(el => el.classList.toggle('active', isEditMode));
        document.getElementById('edit-btn').textContent = isEditMode ? 'Просмотр' : 'Редактировать';
        document.getElementById('edit-btn').classList.toggle('active', isEditMode);
    }

    window.addFlow = () => addFlowRow();

    window.openDetails = function(orderNum) {
        location.href = `flow-details.html?task_id=${taskId}&flow_order=${orderNum}`;
    }

    window.saveFlows = async function() {
        const flows = [];
        let order = 1;
        document.querySelectorAll('#flows-body tr').forEach(tr => {
            let sender, receiver;
            if (isEditMode) {
                const selects = tr.querySelectorAll('select');
                sender = selects[0].value;
                receiver = selects[1].value;
            } else {
                const text = tr.querySelector('.view-mode').textContent;
                [sender, receiver] = text.split('→').map(s => s.trim());
                if (sender === '—') sender = '';
                if (receiver === '—') receiver = '';
            }
            if (sender && receiver) {
                flows.push({ sender, receiver, order_num: order++ });
            }
        });

        await fetch('/api/flows', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ task_id: taskId, flows })
        });

        alert('Потоки успешно сохранены!');
        await loadFlowsFromDB(); // перезагружаем из БД — 100% актуально
        toggleEdit(); // выключаем режим редактирования
    }

    // Старт
    init();
</script>
</body>
</html>
