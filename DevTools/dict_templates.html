<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-i18n="dt_page_title">Настройка шаблонов ТЗ</title>
    <!-- Библиотеки -->
    <script src="libs/jquery-3.6.0.min.js"></script>
    <script src="utils.js"></script>
    <script src="libs/tinymce_8.3.1/tinymce.min.js"></script>
    <!-- Общие стили -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* === ПЕРЕМЕННЫЕ ДЛЯ ТЕМНОЙ ТЕМЫ === */
        :root {
            --bg-main: #f4f7f9;
            --bg-panel: #ffffff;
            --bg-header: #f8fafc;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --item-hover: #f1f5f9;
            --hint-bg: #fffbeb;
            --hint-border: #fcd34d;
            --hint-text: #92400e;
        }

        body.dark-theme {
            --bg-main: #0f172a;
            --bg-panel: #1e293b;
            --bg-header: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --item-hover: #334155;
            --hint-bg: rgba(245, 158, 11, 0.1);
            --hint-border: #b45309;
            --hint-text: #fde68a;
        }

        /* === БРОНЕБОЙНАЯ ИЗОЛЯЦИЯ ОТ style.css === */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            height: 100vh !important;
            overflow: hidden !important;
        }

        body {
            background-color: var(--bg-main) !important;
            padding: 20px !important;
            box-sizing: border-box !important;
            font-family: 'Inter', 'Segoe UI', sans-serif !important;
            display: flex !important;
            flex-direction: column !important;
            color: var(--text-main) !important;
            transition: background 0.3s, color 0.3s;
        }

        .top-bar {
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px; flex-shrink: 0;
        }

        /* Центральная панель */
        .workspace {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
            background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            max-width: 1200px; margin: 0 auto; width: 100%;
            transition: background 0.3s, border-color 0.3s;
        }

        .panel-head {
            padding: 15px 20px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            transition: background 0.3s, border-color 0.3s;
        }

        .panel-body {
            padding: 20px; overflow-y: auto; flex: 1; background: var(--bg-main);
            transition: background 0.3s;
        }

        /* Drag & Drop Лист */
        .dd-list { list-style: none; padding: 0; margin: 0; padding-bottom: 50px; }

        .dd-item {
            display: flex; align-items: center; padding: 12px 15px;
            margin-bottom: 8px; background: var(--bg-panel); border: 1px solid var(--border-color);
            border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            transition: all 0.2s; color: var(--text-main);
        }
        .dd-item:hover { border-color: #3b82f6; transform: translateX(2px); background: var(--item-hover); }
        .dd-item.dragging { opacity: 0.5; border: 2px dashed #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .dd-item.over { border-top: 3px solid #3b82f6; }

        .dd-handle {
            margin-right: 15px; cursor: grab; color: var(--text-muted); font-size: 20px;
        }

        .dd-content { flex: 1; display: flex; align-items: center; gap: 15px; }

        .dd-input {
            flex: 1; border: none; font-size: 14px; font-weight: 600; color: var(--text-main); padding: 5px;
            border-bottom: 1px solid transparent; transition: 0.2s; background: transparent;
        }
        .dd-input:focus { outline: none; border-bottom: 1px solid #3b82f6; }

        .btn-config {
            padding: 6px 12px; font-size: 12px; background: rgba(59, 130, 246, 0.1); color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 4px; cursor: pointer; transition: 0.2s;
        }
        .btn-config:hover { background: #3b82f6; color: #fff; }

        .btn-rem { color: var(--text-muted); font-size: 22px; cursor: pointer; border:none; background:none; transition: 0.2s; }
        .btn-rem:hover { color: #ef4444; }

        /* Выпадающий список выбора режима */
        .mode-selector {
            background: var(--bg-header); padding: 10px; border: 1px solid var(--border-color);
            border-radius: 6px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
            transition: background 0.3s, border-color 0.3s;
        }

        /* Модалка */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:10000; justify-content:center; align-items:center; backdrop-filter: blur(2px); }
        .modal-content { background: var(--bg-panel); border-radius:8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid var(--border-color); color: var(--text-main); display: flex; flex-direction: column; overflow: hidden; transition: 0.3s; }
        .modal-content.fullscreen { width: 100vw !important; height: 100vh !important; border-radius: 0; border: none; }

        .m-header {
            padding: 15px 20px; background: var(--bg-header); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .m-body { padding: 20px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: var(--bg-main); }
        .m-footer {
            padding: 15px 20px; border-top: 1px solid var(--border-color); text-align: right; background: var(--bg-header);
        }

        .m-body select { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); }

        .tox-tinymce-aux {
            z-index: 99999 !important;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <button onclick="window.location.href='index.html'" class="secondary" data-i18n="btn_home">🏠 Домой</button>
    <h2 style="margin:0;" data-i18n="dt_title">Настройка шаблонов документации</h2>
</div>

<div class="workspace">
    <div class="panel-head">
        <div>
            <h3 style="margin:0; font-size: 16px;" data-i18n="dt_panel_title">Конструктор разделов (Generator Template)</h3>
            <span style="font-size:12px; color:var(--text-muted);" data-i18n="dt_panel_desc">Настройте какие разделы будут создаваться для разных типов интеграций.</span>
        </div>
        <button onclick="saveSettings()" class="success" id="btn-save" style="padding: 8px 20px;" data-i18n="dt_btn_save">💾 Сохранить структуру</button>
    </div>

    <div class="panel-body">

        <div class="mode-selector">
            <label style="font-weight: 600; font-size:13px; color:var(--text-main);" data-i18n="dt_lbl_mode">Выберите тип интеграции для редактирования:</label>
            <select id="mode_sel" onchange="renderList()" style="padding:6px; flex:1; font-size:14px; border:1px solid var(--border-color); border-radius:4px; background: var(--input-bg); color: var(--text-main);">
                <option value="sync" data-i18n="dt_opt_sync">Синхронный (REST / SOAP Request-Response)</option>
                <option value="async" data-i18n="dt_opt_async">Асинхронный (Kafka / MQ One-Way)</option>
                <option value="multi" data-i18n="dt_opt_multi">Мульти-обмен (Complex / Saga)</option>
            </select>
        </div>

        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <strong style="color:var(--text-main); font-size:14px;" data-i18n="dt_lbl_list">Список разделов:</strong>
            <button onclick="addItem()" class="secondary" style="font-size:12px;" data-i18n="dt_btn_add">+ Добавить новый раздел</button>
        </div>

        <ul id="tpl_list" class="dd-list">
            <!-- Генерируется через JS -->
        </ul>

        <div style="margin-top:20px; padding:15px; background:var(--hint-bg); border:1px solid var(--hint-border); border-radius:6px; font-size:12px; color:var(--hint-text);">
            <strong data-i18n="dt_hint_word">💡 Подсказка:</strong> <span data-i18n="dt_hint_drag">Перетаскивайте разделы за иконку <b>☰</b>, чтобы изменить их порядок в итоговом документе.</span>
        </div>
    </div>
</div>

<!-- MODAL EDITOR -->
<div class="modal" id="modal_edit">
    <div class="modal-content" id="modal_win_inner" style="width: 800px; height: 80vh;">
        <div class="m-header">
            <h3 id="m_head_title" style="margin:0; color: var(--text-main);" data-i18n="dt_modal_title">Контент раздела</h3>
            <div>
                <button onclick="toggleFull()" class="secondary" style="margin-right:10px; font-size:12px;" id="btn-fullscreen-toggle" data-i18n="dt_btn_full">⤢ На весь экран</button>
                <span onclick="$('#modal_edit').fadeOut(200)" style="cursor:pointer; font-size:24px; color:var(--text-muted); line-height: 1;">&times;</span>
            </div>
        </div>
        <div class="m-body">

            <div style="display:flex; gap:20px; margin-bottom:15px;">
                <div style="flex:1">
                    <label style="font-weight:600; font-size:12px; display:block; margin-bottom:5px; color: var(--text-main);" data-i18n="dt_lbl_type">Тип раздела:</label>
                    <select id="m_type" style="width:100%; padding:8px; border-radius:4px;">
                        <option value="text" data-i18n="dt_opt_text">Текстовое описание (HTML)</option>
                        <option value="mermaid" data-i18n="dt_opt_mermaid">Диаграмма (Mermaid)</option>
                        <option value="table" data-i18n="dt_opt_table">Таблица (Generic)</option>
                        <option value="passport" data-i18n="dt_opt_passport">Авто: Паспорт документа</option>
                        <option value="history" data-i18n="dt_opt_history">Авто: История изменений</option>
                    </select>
                </div>
            </div>

            <label style="font-weight:600; font-size:12px; display:block; margin-bottom:5px; color: var(--text-main);" data-i18n="dt_lbl_def">Содержимое по умолчанию («Рыба»):</label>
            <div style="flex: 1; display: flex; flex-direction: column;">
                <textarea id="m_content" style="flex: 1;"></textarea>
            </div>
        </div>
        <div class="m-footer">
            <button onclick="$('#modal_edit').fadeOut(200)" class="secondary" style="margin-right:10px;" data-i18n="dt_btn_cancel">Отмена</button>
            <button onclick="saveModal()" class="primary" data-i18n="dt_btn_apply">Применить</button>
        </div>
    </div>
</div>

<script>
    // Универсальная функция перевода
    function t(key, defaultStr) {
        try {
            const lang = localStorage.getItem('app_lang') || 'ru';
            const dictStr = localStorage.getItem('portal_dictionary');
            if (dictStr) {
                const dict = JSON.parse(dictStr)[lang];
                if (dict && dict[key]) return dict[key];
            }
        } catch(e) {}
        return defaultStr;
    }

    let DATA_TPL = {};
    let editIdx = -1;

    window.toggleFull = function() {
        const win = document.getElementById('modal_win_inner');
        win.classList.toggle('fullscreen');

        const btn = document.getElementById('btn-fullscreen-toggle');
        const isFull = win.classList.contains('fullscreen');
        btn.innerHTML = isFull ? t('dt_btn_collapse', '⤡ Свернуть') : t('dt_btn_full', '⤢ На весь экран');
    }

    function initTinyMCE(isDark) {
        if (tinymce.get('m_content')) {
            tinymce.remove('#m_content');
        }

        tinymce.init({
            selector: '#m_content',
            promotion: false,
            license_key: 'gpl',
            language: localStorage.getItem('app_lang') === 'ru' ? 'ru' : 'en',
            height: '100%',
            menubar: true,
            skin: isDark ? 'oxide-dark' : 'oxide',
            content_css: isDark ? 'dark' : 'default',
            plugins: [
                'advlist', 'autolink', 'lists', 'link', 'image', 'charmap', 'preview',
                'anchor', 'searchreplace', 'visualblocks', 'code', 'fullscreen',
                'insertdatetime', 'table', 'help', 'wordcount', 'codesample'
            ],
            toolbar: 'undo redo | blocks | bold italic forecolor | codesample |' +
                'alignleft aligncenter alignright alignjustify | ' +
                'bullist numlist outdent indent | ' +
                'table link image | removeformat | fullscreen',
            codesample_languages: [
                {text: 'HTML/XML', value: 'markup'},
                {text: 'JavaScript', value: 'javascript'},
                {text: 'JSON', value: 'json'},
                {text: 'CSS', value: 'css'},
                {text: 'Java', value: 'java'},
                {text: 'SQL', value: 'sql'}
            ],
            image_title: true,
            automatic_uploads: true,
            file_picker_types: 'image',
            images_upload_handler: function (blobInfo, progress) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(blobInfo.blob());
                    reader.onload = function () { resolve(reader.result); };
                    reader.onerror = function (error) { reject({ message: t('dt_err_read_file', 'Ошибка чтения файла: ') + error.message, remove: true }); };
                });
            },
            table_default_attributes: { border: '1' },
            table_default_styles: { 'width': '100%', 'border-collapse': 'collapse' },
            setup: function(editor) {
                editor.on('change', function () { editor.save(); });
            },
            verify_html: false
        });
    }

    $(function(){
        if(typeof initLocalization === 'function') initLocalization();
        const isDark = localStorage.getItem('global_dark_theme') === 'true';
        if(typeof applyTheme === 'function') applyTheme(isDark);

        initTinyMCE(isDark);

        window.addEventListener('themeChanged', function(e) {
            initTinyMCE(e.detail.isDark);
        });

        loadData();
    });

    function loadData() {
        $.ajax({
            url: '/api/tasks/settings',
            cache: false,
            success: function(data) {
                try {
                    if (data && data.doc_structure_templates) {
                        DATA_TPL = JSON.parse(data.doc_structure_templates);
                    } else {
                        DATA_TPL = {};
                    }
                    if (!DATA_TPL) DATA_TPL = {};
                } catch(e) {
                    DATA_TPL = {};
                }
                renderList();
            },
            error: function(xhr) {
                alert(t('dt_err_load', 'Не удалось загрузить настройки.'));
            }
        });
    }

    window.renderList = function() {
        const m = $('#mode_sel').val();
        if (!DATA_TPL[m]) DATA_TPL[m] = [];

        const list = DATA_TPL[m];
        const ul = $('#tpl_list').empty();

        if(!list.length) {
            ul.append(`<div style="text-align:center; padding:30px; color:var(--text-muted);">${t('dt_empty_tpl', 'Шаблон пуст. Нажмите "+ Добавить раздел"')}</div>`);
            return;
        }

        // Локализованные подписи типов для кнопок
        const typeLabels = {
            text: t('dt_type_text', 'Текст'),
            mermaid: t('dt_type_mermaid', 'Схема'),
            table: t('dt_type_table', 'Таблица'),
            passport: t('dt_type_passport', 'Паспорт'),
            history: t('dt_type_history', 'История')
        };

        list.forEach((item, i) => {
            const displayType = typeLabels[item.type] || item.type || 'text';
            const li = $(`
                <li class="dd-item" draggable="true" data-index="${i}">
                    <div class="dd-handle">☰</div>
                    <div class="dd-content">
                        <input class="dd-input" value="${escapeHtml(item.title)}" onchange="updateTitle(${i}, this.value)">
                        <button class="btn-config" onclick="openEditor(${i})">⚙ ${displayType}</button>
                    </div>
                    <button class="btn-rem" onclick="delItem(${i})" title="${t('dt_btn_delete', 'Удалить')}">&times;</button>
                </li>
            `);
            bindDnD(li[0]);
            ul.append(li);
        });
    }

    window.updateTitle = (i, v) => {
        const m = $('#mode_sel').val();
        if(DATA_TPL[m] && DATA_TPL[m][i]) {
            DATA_TPL[m][i].title = v;
        }
    }

    window.addItem = () => {
        const m = $('#mode_sel').val();
        if(!DATA_TPL[m]) DATA_TPL[m] = [];
        DATA_TPL[m].push({ id: 's_'+Date.now(), title: t('dt_new_sec', 'Новый раздел'), type: 'text', val: '' });
        renderList();
    }

    window.delItem = (i) => {
        if(confirm(t('dt_conf_del', 'Удалить этот раздел?'))) {
            const m = $('#mode_sel').val();
            DATA_TPL[m].splice(i,1);
            renderList();
        }
    }

    window.openEditor = (i) => {
        editIdx = i;
        const m = $('#mode_sel').val();
        const item = DATA_TPL[m][i];

        $('#m_head_title').text(t('dt_modal_edit', 'Настройка: ') + item.title);
        $('#m_type').val(item.type || 'text');

        const content = item.val || '';
        if (tinymce.get('m_content')) {
            tinymce.get('m_content').setContent(content);
        } else {
            $('#m_content').val(content);
        }

        $('#modal_edit').fadeIn(200);
    }

    window.saveModal = () => {
        const m = $('#mode_sel').val();

        if (!DATA_TPL[m] || !DATA_TPL[m][editIdx]) {
            $('#modal_edit').fadeOut(200);
            return;
        }

        const item = DATA_TPL[m][editIdx];
        item.type = $('#m_type').val();

        if (tinymce.get('m_content')) {
            item.val = tinymce.get('m_content').getContent();
        } else {
            item.val = $('#m_content').val();
        }

        $('#modal_edit').fadeOut(200);
        renderList();
    }

    window.saveSettings = function() {
        const payload = {
            doc_structure_templates: JSON.stringify(DATA_TPL)
        };

        const btn = $('#btn-save');
        const oldText = btn.text();
        btn.text(t('dt_saving', 'Сохранение...')).prop('disabled', true);

        $.ajax({
            url: '/api/tasks/settings',
            type: 'POST',
            contentType: 'application/json; charset=utf-8',
            data: JSON.stringify(payload),
            success: () => {
                btn.text(t('dt_saved', '✅ Сохранено'));
                setTimeout(()=>btn.text(oldText).prop('disabled',false), 1500);
            },
            error: (x) => {
                alert(t('dt_err_save', 'Ошибка сохранения: ') + x.responseText);
                btn.text(oldText).prop('disabled',false);
            }
        });
    }

    let dragEl = null;
    function bindDnD(el) {
        el.addEventListener('dragstart', function(e) {
            this.style.opacity = '0.4';
            this.classList.add('dragging');
            dragEl = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.getAttribute('data-index'));
        });
        el.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        });
        el.addEventListener('dragenter', function() { this.classList.add('over'); });
        el.addEventListener('dragleave', function() { this.classList.remove('over'); });
        el.addEventListener('drop', function(e) {
            e.stopPropagation();
            if (dragEl && dragEl !== this) {
                const m = $('#mode_sel').val();
                const fromIdx = parseInt(dragEl.getAttribute('data-index'));
                const toIdx = parseInt(this.getAttribute('data-index'));
                const arr = DATA_TPL[m];
                const [movedItem] = arr.splice(fromIdx, 1);
                arr.splice(toIdx, 0, movedItem);
                renderList();
            }
            return false;
        });
        el.addEventListener('dragend', function() {
            this.style.opacity = '1';
            this.classList.remove('dragging');
            document.querySelectorAll('.dd-item').forEach(x => x.classList.remove('over'));
        });
    }

    function escapeHtml(text) {
        if (!text) return "";
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
