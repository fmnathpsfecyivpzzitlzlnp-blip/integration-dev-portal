<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Настройка шаблонов ТЗ</title>
    <!-- Библиотеки -->
    <script src="libs/jquery-3.6.0.min.js"></script>

    <!-- CodeMirror (Редактор) -->
<!--    <link rel="stylesheet" href="libs/codemirror.min.css">-->
<!--    <link rel="stylesheet" href="libs/dracula.min.css">-->

<!--    <script src="libs/codemirror.min.js"></script>-->
<!--    <script src="libs/xml.min.js"></script>-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js"></script>
    <!-- Общие стили -->
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: #f4f7f9;
            margin: 0; padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px; flex-shrink: 0;
        }

        /* Центральная панель */
        .workspace {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
            background: #fff; border: 1px solid #e2e8f0; border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            max-width: 1200px; margin: 0 auto; width: 100%;
        }

        .panel-head {
            padding: 15px 20px; background: #fff; border-bottom: 1px solid #e2e8f0;
            display: flex; justify-content: space-between; align-items: center;
        }

        .panel-body {
            padding: 20px; overflow-y: auto; flex: 1; background: #fdfdfd;
        }

        /* Drag & Drop Лист */
        .dd-list { list-style: none; padding: 0; margin: 0; padding-bottom: 50px; }

        .dd-item {
            display: flex; align-items: center; padding: 12px 15px;
            margin-bottom: 8px; background: #fff; border: 1px solid #e2e8f0;
            border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            transition: all 0.2s;
        }
        .dd-item:hover { border-color: #a5b4fc; transform: translateX(2px); }
        .dd-item.dragging { opacity: 0.5; border: 2px dashed #6366f1; background: #eef2ff; }
        .dd-item.over { border-top: 3px solid #3b82f6; }

        .dd-handle {
            margin-right: 15px; cursor: grab; color: #cbd5e1; font-size: 20px;
        }

        .dd-content { flex: 1; display: flex; align-items: center; gap: 15px; }

        .dd-input {
            flex: 1; border: none; font-size: 14px; font-weight: 600; color: #333; padding: 5px;
            border-bottom: 1px solid transparent; transition: 0.2s; background: transparent;
        }
        .dd-input:focus { outline: none; border-bottom: 1px solid #3b82f6; }

        .btn-config {
            padding: 6px 12px; font-size: 12px; background: #eff6ff; color: #2563eb;
            border: 1px solid #dbeafe; border-radius: 4px; cursor: pointer;
        }
        .btn-config:hover { background: #2563eb; color: #fff; }

        .btn-rem { color: #94a3b8; font-size: 22px; cursor: pointer; border:none; background:none;}
        .btn-rem:hover { color: #ef4444; }

        /* Выпадающий список выбора режима */
        .mode-selector {
            background: #f8fafc; padding: 10px; border: 1px solid #e2e8f0;
            border-radius: 6px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
        }

        /* --- MODAL --- */
        .modal-wrap {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 9000;
            align-items: center; justify-content: center;
        }
        .modal-win {
            background: #fff; width: 800px; max-width: 95%; height: 700px;
            border-radius: 8px; display: flex; flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.15);
        }
        .modal-win.fullscreen {
            width: 100vw; height: 100vh; max-width: 100%; margin: 0; border-radius: 0;
        }
        .m-header {
            padding: 15px 20px; background: #f8fafc; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
        }
        .m-body { padding: 20px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .m-footer {
            padding: 15px 20px; border-top: 1px solid #eee; text-align: right;
        }
        .CodeMirror {
            flex: 1; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; height: auto;
        }
        .tox-tinymce-aux {
            z-index: 99999 !important;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <button onclick="window.location.href='index.html'" class="secondary">🏠 Домой</button>
    <h2 style="margin:0;">Настройка шаблонов документации</h2>
</div>

<div class="workspace">
    <div class="panel-head">
        <div>
            <h3 style="margin:0; font-size: 16px;">Конструктор разделов (Generator Template)</h3>
            <span style="font-size:12px; color:#666;">Настройте какие разделы будут создаваться для разных типов интеграций.</span>
        </div>
        <button onclick="saveSettings()" class="success" id="btn-save" style="padding: 8px 20px;">💾 Сохранить структуру</button>
    </div>

    <div class="panel-body">

        <div class="mode-selector">
            <label style="font-weight: 600; font-size:13px; color:#475569;">Выберите тип интеграции для редактирования:</label>
            <select id="mode_sel" onchange="renderList()" style="padding:6px; flex:1; font-size:14px; border:1px solid #cbd5e1; border-radius:4px;">
                <option value="sync">Синхронный (REST / SOAP Request-Response)</option>
                <option value="async">Асинхронный (Kafka / MQ One-Way)</option>
                <option value="multi">Мульти-обмен (Complex / Saga)</option>
            </select>
        </div>

        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <strong style="color:#334155; font-size:14px;">Список разделов:</strong>
            <button onclick="addItem()" class="secondary" style="font-size:12px;">+ Добавить новый раздел</button>
        </div>

        <ul id="tpl_list" class="dd-list">
            <!-- Генерируется через JS -->
        </ul>

        <div style="margin-top:20px; padding:15px; background:#fffbeb; border:1px solid #fcd34d; border-radius:6px; font-size:12px; color:#92400e;">
            <strong>💡 Подсказка:</strong> Перетаскивайте разделы за иконку <b>☰</b>, чтобы изменить их порядок в итоговом документе.
        </div>
    </div>
</div>

<!-- MODAL EDITOR -->
<div class="modal-wrap" id="modal_edit">
    <div class="modal-win" id="modal_win_inner">
        <div class="m-header">
            <h3 id="m_head_title" style="margin:0">Контент раздела</h3>
            <div>
                <button onclick="toggleFull()" class="secondary" style="margin-right:10px; font-size:12px;">⤢ На весь экран</button>
                <span onclick="$('#modal_edit').fadeOut(200)" style="cursor:pointer; font-size:20px; color:#999;">&times;</span>
            </div>
        </div>
        <div class="m-body">

            <div style="display:flex; gap:20px; margin-bottom:15px;">
                <div style="flex:1">
                    <label style="font-weight:600; font-size:12px; display:block; margin-bottom:5px;">Тип раздела:</label>
                    <select id="m_type" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
                        <option value="text">Текстовое описание (HTML)</option>
                        <option value="mermaid">Диаграмма (Mermaid)</option>
                        <option value="table">Таблица (Generic)</option>
                        <option value="passport">Авто: Паспорт документа</option>
                        <option value="history">Авто: История изменений</option>
                    </select>
                </div>
                <div style="align-self: flex-end;">
                    <button onclick="pasteExcel()" class="secondary" style="border-color:#16a34a; color:#16a34a; font-weight:600;">📋 Вставить таблицу из Excel</button>
                </div>
            </div>

            <label style="font-weight:600; font-size:12px; display:block; margin-bottom:5px;">Содержимое по умолчанию («Рыба»):</label>
            <textarea id="m_content"></textarea>
        </div>
        <div class="m-footer">
            <button onclick="$('#modal_edit').fadeOut(200)" class="secondary" style="margin-right:10px;">Отмена</button>
            <button onclick="saveModal()" class="primary">Применить</button>
        </div>
    </div>
</div>

<script>
    // --- Глобальные переменные ---
    let DATA_TPL = {};
    let editIdx = -1;

    $(function(){
        // 1. Инициализация редактора TinyMCE
        tinymce.init({
            selector: '#m_content',
            language: 'ru',
            height: 400,
            menubar: false,
            // Плагины и тулбар
            plugins: 'table lists link image fullscreen code help',
            toolbar: 'undo redo | bold italic link | alignleft aligncenter alignright | bullist numlist | table | fullscreen code',
            // Исправление для модальных окон
            setup: function(editor) {
                editor.on('change', function () {
                    editor.save(); // Синхронизация с textarea
                });
            }
        });

        // 2. Загрузка данных
        loadData();
    });

    // --- Функция загрузки настроек ---
    function loadData() {
        $.ajax({
            url: '/api/tasks/settings',
            cache: false,
            success: function(data) {
                try {
                    if (data && data.doc_structure_templates) {
                        DATA_TPL = JSON.parse(data.doc_structure_templates);
                    } else {
                        DATA_TPL = {};
                    }
                    // Защита: если после парсинга получился null
                    if (!DATA_TPL) DATA_TPL = {};
                } catch(e) {
                    console.error("Ошибка парсинга JSON:", e);
                    DATA_TPL = {};
                }
                renderList();
            },
            error: function(xhr) {
                console.error("Ошибка API:", xhr);
                alert("Не удалось загрузить настройки.");
            }
        });
    }

    // --- Отрисовка списка (Render List) ---
    window.renderList = function() {
        const m = $('#mode_sel').val();
        // Если для этого режима нет массива, создаем пустой
        if (!DATA_TPL[m]) DATA_TPL[m] = [];

        const list = DATA_TPL[m];
        const ul = $('#tpl_list').empty();

        if(!list.length) {
            ul.append('<div style="text-align:center; padding:30px; color:#aaa;">Шаблон пуст. Нажмите "+ Добавить раздел"</div>');
            return;
        }

        list.forEach((item, i) => {
            const li = $(`
                <li class="dd-item" draggable="true" data-index="${i}">
                    <div class="dd-handle">☰</div>
                    <div class="dd-content">
                        <input class="dd-input" value="${escapeHtml(item.title)}" onchange="updateTitle(${i}, this.value)">
                        <button class="btn-config" onclick="openEditor(${i})">⚙ ${item.type || 'text'}</button>
                    </div>
                    <button class="btn-rem" onclick="delItem(${i})" title="Удалить">&times;</button>
                </li>
            `);
            bindDnD(li[0]);
            ul.append(li);
        });
    }

    // --- Логика работы со списком ---
    window.updateTitle = (i, v) => {
        const m = $('#mode_sel').val();
        if(DATA_TPL[m] && DATA_TPL[m][i]) {
            DATA_TPL[m][i].title = v;
        }
    }

    window.addItem = () => {
        const m = $('#mode_sel').val();
        if(!DATA_TPL[m]) DATA_TPL[m] = [];
        DATA_TPL[m].push({ id: 's_'+Date.now(), title: 'Новый раздел', type: 'text', val: '' });
        renderList();
    }

    window.delItem = (i) => {
        if(confirm('Удалить этот раздел?')) {
            const m = $('#mode_sel').val();
            DATA_TPL[m].splice(i,1);
            renderList();
        }
    }

    // --- Работа с модальным окном (TinyMCE) ---
    window.openEditor = (i) => {
        editIdx = i;
        const m = $('#mode_sel').val();
        const item = DATA_TPL[m][i];

        $('#m_head_title').text('Настройка: ' + item.title);
        $('#m_type').val(item.type || 'text');

        // Устанавливаем значение в TinyMCE
        const content = item.val || '';
        if (tinymce.get('m_content')) {
            tinymce.get('m_content').setContent(content);
        } else {
            $('#m_content').val(content);
        }

        $('#modal_edit').fadeIn(200);
    }

    // --- СОХРАНЕНИЕ ИЗ МОДАЛКИ (ВАЖНО!) ---
    window.saveModal = () => {
        const m = $('#mode_sel').val();

        // Проверка на корректность индекса
        if (!DATA_TPL[m] || !DATA_TPL[m][editIdx]) {
            console.error("Ошибка: элемент не найден");
            $('#modal_edit').fadeOut(200);
            return;
        }

        const item = DATA_TPL[m][editIdx];

        item.type = $('#m_type').val();

        // Забираем данные из TinyMCE
        if (tinymce.get('m_content')) {
            item.val = tinymce.get('m_content').getContent();
        } else {
            item.val = $('#m_content').val();
        }

        $('#modal_edit').fadeOut(200);
        renderList(); // Обновляем список (на всякий случай)
    }

    // --- Глобальное сохранение настроек ---
    window.saveSettings = function() {
        // Формируем объект для отправки
        // JSON.stringify нужен, чтобы превратить объект в строку, которую примет сервер
        const payload = {
            doc_structure_templates: JSON.stringify(DATA_TPL)
        };

        const btn = $('#btn-save');
        const oldText = btn.text();
        btn.text('Сохранение...').prop('disabled', true);

        $.ajax({
            url: '/api/tasks/settings',
            type: 'POST',
            contentType: 'application/json; charset=utf-8', // Явно указываем кодировку!
            data: JSON.stringify(payload),
            success: () => {
                btn.text('✅ Сохранено');
                setTimeout(()=>btn.text(oldText).prop('disabled',false), 1500);
            },
            error: (x) => {
                alert('Ошибка сохранения: ' + x.responseText);
                btn.text(oldText).prop('disabled',false);
            }
        });
    }

    function escapeHtml(t) { return t ? t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g, '&quot;') : ''; }

    // --- Drag & Drop (Без изменений) ---
    let dragEl = null;
    function bindDnD(el) {
        el.addEventListener('dragstart', function(e) {
            this.style.opacity = '0.4';
            this.classList.add('dragging');
            dragEl = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.getAttribute('data-index'));
        });
        el.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        });
        el.addEventListener('dragenter', function() { this.classList.add('over'); });
        el.addEventListener('dragleave', function() { this.classList.remove('over'); });
        el.addEventListener('drop', function(e) {
            e.stopPropagation();
            if (dragEl && dragEl !== this) {
                const m = $('#mode_sel').val();
                const fromIdx = parseInt(dragEl.getAttribute('data-index'));
                const toIdx = parseInt(this.getAttribute('data-index'));
                const arr = DATA_TPL[m];
                const [movedItem] = arr.splice(fromIdx, 1);
                arr.splice(toIdx, 0, movedItem);
                renderList();
            }
            return false;
        });
        el.addEventListener('dragend', function() {
            this.style.opacity = '1';
            this.classList.remove('dragging');
            document.querySelectorAll('.dd-item').forEach(x => x.classList.remove('over'));
        });
    }
</script>
</body>
</html>
