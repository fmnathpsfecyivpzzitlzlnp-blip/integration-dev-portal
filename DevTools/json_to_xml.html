<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-i18n="j2x_page_title">Конвертер JSON в XML</title>

    <script src="libs/jquery-3.6.0.min.js"></script>
    <script src="utils.js"></script>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="libs/codemirror.min.css">
    <link rel="stylesheet" href="libs/dracula.min.css">
    <script src="libs/codemirror.min.js"></script>
    <script src="libs/javascript.min.js"></script>
    <script src="libs/xml.min.js"></script>

    <style>
        /* === ПЕРЕМЕННЫЕ ДЛЯ ТЕМНОЙ ТЕМЫ === */
        :root {
            --bg-main: #f4f7f9;
            --bg-card: #ffffff;
            --bg-header: #f8fafc;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --btn-sec-bg: #e2e8f0;
        }

        body.dark-theme {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-header: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --btn-sec-bg: #334155;
        }

        /* === БРОНЕБОЙНАЯ ИЗОЛЯЦИЯ ОТ style.css === */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            height: 100vh !important;
            overflow: hidden !important;
        }

        body {
            background: var(--bg-main) !important;
            padding: 20px !important;
            font-family: 'Inter', 'Segoe UI', sans-serif !important;
            display: flex !important;
            flex-direction: column !important;
            box-sizing: border-box !important;
            color: var(--text-main) !important;
            transition: background 0.3s, color 0.3s;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .header h2 { margin: 0; font-size: 22px; color: var(--text-main); }

        .btn { padding: 8px 15px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn.primary { background: #3b82f6; color: white; }
        .btn.primary:hover { background: #2563eb; }
        .btn.secondary { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn.secondary:hover { filter: brightness(0.95); }

        .workspace { flex: 1; display: flex; gap: 20px; overflow: hidden; min-height: 0; }

        .col { flex: 1; display: flex; flex-direction: column; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); overflow: hidden; transition: 0.3s; min-width: 0; }
        .panel-head { background: var(--bg-header); padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-weight: 600; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; transition: 0.3s; }

        /* CodeMirror */
        .CodeMirror { flex: 1; font-family: 'Consolas', monospace; font-size: 13px; height: 100% !important; background: var(--input-bg); color: var(--text-main); border-top: none; }

        /* Ошибки */
        .error-box { display: none; padding: 12px 15px; background: rgba(220, 38, 38, 0.1); color: #ef4444; font-family: 'Consolas', monospace; font-size: 13px; border-bottom: 1px solid rgba(220, 38, 38, 0.3); word-break: break-all; margin-bottom: 15px; border-radius: 4px; }
        .error-line-bg { background-color: rgba(220, 38, 38, 0.2) !important; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

<div class="header">
    <div style="display: flex; align-items: center; gap: 15px;">
        <button onclick="window.location.href='index.html'" class="btn secondary" data-i18n="btn_home">🏠 Домой</button>
        <h2 data-i18n="j2x_title">Конвертер JSON в XML</h2>
    </div>
    <div style="display: flex; gap: 10px;">
        <button id="clearBtn" class="btn secondary" data-i18n="j2x_btn_clear">🧹 Очистить</button>
        <button id="btn-convert" class="btn primary" style="background: #10b981; border-color: #10b981;" data-i18n="j2x_btn_convert">🚀 Конвертировать</button>
    </div>
</div>

<div id="error-panel" class="error-box"></div>

<div class="workspace">
    <div class="col">
        <div class="panel-head">
            <span data-i18n="j2x_lbl_json">Входной JSON:</span>
        </div>
        <textarea id="input-area"></textarea>
    </div>
    <div class="col">
        <div class="panel-head">
            <span data-i18n="j2x_lbl_xml">Результат в XML:</span>
        </div>
        <textarea id="output-area"></textarea>
    </div>
</div>

<script>
    let editorIn, editorOut;
    let errorLineHandle = null;

    $(function () {
        if(typeof initLocalization === 'function') initLocalization();
        const isDark = localStorage.getItem('global_dark_theme') === 'true';
        if(typeof applyTheme === 'function') applyTheme(isDark);

        const cmThemeIn = isDark ? "dracula" : "default";
        const cmThemeOut = isDark ? "dracula" : "dracula"; // Вывод всегда темный для контраста, либо по вкусу

        editorIn = CodeMirror.fromTextArea(document.getElementById('input-area'), {
            mode: "application/json",
            lineNumbers: true,
            matchBrackets: true,
            theme: cmThemeIn,
            lineWrapping: true
        });

        editorOut = CodeMirror.fromTextArea(document.getElementById('output-area'), {
            mode: "xml",
            lineNumbers: true,
            matchBrackets: true,
            theme: cmThemeOut,
            lineWrapping: true,
            readOnly: true
        });

        window.addEventListener('themeChanged', function(e) {
            editorIn.setOption('theme', e.detail.isDark ? 'dracula' : 'default');
            editorOut.setOption('theme', e.detail.isDark ? 'dracula' : 'dracula');
        });

        const savedJson = localStorage.getItem('json_to_xml_input');
        if (savedJson) {
            editorIn.setValue(savedJson);
        } else {
            const exampleJson = '{\n  "Request": {\n    "ClientInfo": {\n      "INN": "1234567890"\n    }\n  }\n}';
            editorIn.setValue(exampleJson);
        }

        editorIn.on('change', function() {
            localStorage.setItem('json_to_xml_input', editorIn.getValue());
            clearError();
        });

        $('#clearBtn').on('click', function() {
            const msg = typeof t === 'function' ? t('j2x_conf_clear', 'Очистить поле ввода?') : 'Очистить поле ввода?';
            if (confirm(msg)) {
                editorIn.setValue('');
                editorOut.setValue('');
                localStorage.removeItem('json_to_xml_input');
                clearError();
            }
        });

        $('#btn-convert').on('click', function() {
            clearError();

            const inputText = editorIn.getValue();
            if (!inputText.trim()) {
                const msg = typeof t === 'function' ? t('j2x_err_empty', 'Пожалуйста, вставьте JSON.') : 'Пожалуйста, вставьте JSON.';
                alert(msg);
                return;
            }

            try {
                JSON.parse(inputText);
            } catch (e) {
                const match = e.message.match(/line\s+(\d+)/i) || e.message.match(/position\s+(\d+)/i);
                if (match && e.message.includes("line")) {
                    const lineNum = parseInt(match[1], 10);
                    errorLineHandle = editorIn.addLineClass(lineNum - 1, 'background', 'error-line-bg');
                    editorIn.scrollIntoView({line: lineNum - 1, ch: 0}, 60);
                }
                const errPrefix = typeof t === 'function' ? t('j2x_err_syntax', '❌ Ошибка синтаксиса JSON:\n') : '❌ Ошибка синтаксиса JSON:\n';
                $('#error-panel').text(errPrefix + e.message).show();
                return;
            }

            const btn = $(this);
            const originalText = btn.text();
            const waitingText = typeof t === 'function' ? t('j2x_btn_converting', '⏳ Конвертация...') : '⏳ Конвертация...';
            btn.text(waitingText).prop('disabled', true);
            editorOut.setValue('Обработка...');

            $.ajax({
                url: '/api/convert',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ text: inputText, from: 'json', to: 'xml' }),
                success: (convertedText) => {
                    editorOut.setValue(convertedText);
                },
                error: (xhr) => {
                    const msg = xhr.responseJSON ? xhr.responseJSON.message : xhr.responseText;
                    const errSrv = typeof t === 'function' ? t('j2x_err_server', '⚠️ Ошибка конвертации на сервере:\n') : '⚠️ Ошибка конвертации на сервере:\n';
                    $('#error-panel').text(errSrv + msg).show();
                    editorOut.setValue('');
                },
                complete: () => {
                    btn.text(originalText).prop('disabled', false);
                }
            });
        });
    });

    function clearError() {
        $('#error-panel').hide();
        if (errorLineHandle) {
            editorIn.removeLineClass(errorLineHandle, 'background', 'error-line-bg');
            errorLineHandle = null;
        }
    }

    function escapeHtml(text) {
        if (!text) return "";
        return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
