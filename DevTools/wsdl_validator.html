<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-i18n="wv_page_title">XML / WSDL Validator</title>

    <script src="libs/jquery-3.6.0.min.js"></script>
    <script src="utils.js"></script>

    <link rel="stylesheet" href="libs/codemirror.min.css">
    <link rel="stylesheet" href="libs/dracula.min.css">
    <script src="libs/codemirror.min.js"></script>
    <script src="libs/xml.min.js"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        /* === ПЕРЕМЕННЫЕ ДЛЯ ТЕМНОЙ ТЕМЫ === */
        :root {
            --bg-main: #f4f7f9;
            --bg-card: #ffffff;
            --bg-header: #f8fafc;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --success-bg: #dcfce7;
            --success-border: #86efac;
            --success-text: #166534;
            --warning-bg: #fef9c3;
            --warning-border: #fde047;
            --warning-text: #854d0e;
            --error-bg: #fef2f2;
            --error-border: #fca5a5;
            --error-text: #991b1b;
        }

        body.dark-theme {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-header: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --success-bg: rgba(22, 163, 74, 0.1);
            --success-border: #15803d;
            --success-text: #4ade80;
            --warning-bg: rgba(202, 138, 4, 0.1);
            --warning-border: #a16207;
            --warning-text: #facc15;
            --error-bg: rgba(220, 38, 38, 0.1);
            --error-border: #b91c1c;
            --error-text: #f87171;
        }

        /* === БРОНЕБОЙНАЯ ИЗОЛЯЦИЯ ОТ style.css === */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            height: 100vh !important;
            overflow: hidden !important;
        }

        body {
            background: var(--bg-main) !important;
            padding: 20px !important;
            font-family: 'Inter', 'Segoe UI', sans-serif !important;
            display: flex !important;
            flex-direction: column !important;
            box-sizing: border-box !important;
            color: var(--text-main) !important;
            transition: background 0.3s, color 0.3s;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .header h2 { margin: 0; font-size: 22px; color: var(--text-main); }

        .btn { padding: 8px 15px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn.primary { background: #3b82f6; color: white; border: 1px solid #3b82f6; }
        .btn.primary:hover { background: #2563eb; }
        .btn.secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn.secondary:hover { filter: brightness(0.95); }

        .workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

        .editor-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-card);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: 0.3s;
        }

        .CodeMirror {
            height: 100% !important;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--text-main);
        }

        .error-line-bg { background-color: rgba(220, 38, 38, 0.2) !important; }

        #results-panel {
            padding: 15px 20px;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            display: none;
            margin-bottom: 15px;
            flex-shrink: 0;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .success-panel { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success-text); }
        .warning-panel { background: var(--warning-bg); border: 1px solid var(--warning-border); color: var(--warning-text); }
        .error-panel { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); }

        .check-list { margin-top: 10px; padding-left: 20px; color: var(--text-main); }
        .check-list li { margin-bottom: 6px; font-weight: bold; }
        .check-ok { color: var(--success-text); }
        .check-fail { color: var(--error-text); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

<div class="header">
    <div style="display: flex; align-items: center; gap: 15px;">
        <button onclick="window.location.href='index.html'" class="btn secondary" data-i18n="btn_home">🏠 Домой</button>
        <h2 data-i18n="wv_title">XML / WSDL Validator</h2>
    </div>
    <div style="display: flex; gap: 10px;">
        <button id="clearBtn" class="btn secondary" data-i18n="wv_btn_clear">🧹 Очистить</button>
        <button id="validateBtn" class="btn primary" style="background: #8b5cf6; border-color: #8b5cf6;" data-i18n="wv_btn_validate">⚡ Проверить WSDL</button>
    </div>
</div>

<div class="workspace">
    <div id="results-panel"></div>

    <div class="editor-wrapper">
        <textarea id="xml-input"></textarea>
    </div>
</div>

<script>
    $(function () {
        if(typeof initLocalization === 'function') initLocalization();
        const isDark = localStorage.getItem('global_dark_theme') === 'true';
        if(typeof applyTheme === 'function') applyTheme(isDark);

        const cmTheme = isDark ? "dracula" : "default";
        const resultsPanel = $('#results-panel');
        let errorLineHandle = null;

        const editor = CodeMirror.fromTextArea(document.getElementById('xml-input'), {
            mode: "xml",
            lineNumbers: true,
            matchBrackets: true,
            lineWrapping: true,
            theme: cmTheme
        });

        window.addEventListener('themeChanged', function(e) {
            editor.setOption('theme', e.detail.isDark ? 'dracula' : 'default');
        });

        if (typeof window.t === 'function') {
            $('#xml-input').attr('placeholder', window.t('wv_ph_input', 'Вставьте сюда ваш код XML или WSDL...'));
        }

        if (localStorage.getItem('validator_wsdl')) {
            editor.setValue(localStorage.getItem('validator_wsdl'));
        }

        editor.on('change', function() {
            localStorage.setItem('validator_wsdl', editor.getValue());
            if (errorLineHandle) {
                editor.removeLineClass(errorLineHandle, 'background', 'error-line-bg');
                errorLineHandle = null;
            }
            resultsPanel.hide();
        });

        $('#clearBtn').on('click', function() {
            const msg = typeof window.t === 'function' ? window.t('wv_conf_clear', 'Очистить редактор?') : 'Очистить редактор?';
            if(confirm(msg)) {
                editor.setValue('');
                localStorage.removeItem('validator_wsdl');
                resultsPanel.hide();
            }
        });

        $('#validateBtn').on('click', function() {
            resultsPanel.removeClass('success-panel warning-panel error-panel').empty().hide();

            let xmlText = editor.getValue().trim();
            if (!xmlText) {
                const msg = typeof window.t === 'function' ? window.t('wv_err_empty', 'Пожалуйста, вставьте XML/WSDL код.') : 'Пожалуйста, вставьте XML/WSDL код.';
                return alert(msg);
            }

            // Авто-исправление "кривых" кавычек
            xmlText = xmlText.replace(/[\u201C\u201D\u00AB\u00BB]/g, '"').replace(/[\u2018\u2019]/g, "'");
            if (xmlText !== editor.getValue().trim()) {
                editor.setValue(xmlText);
            }

            // ШАГ 1: Базовая валидация синтаксиса XML
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "application/xml");
            const errorNode = xmlDoc.querySelector("parsererror");

            if (errorNode) {
                const errorMsg = errorNode.textContent;
                const match = errorMsg.match(/line number (\d+)/i) || errorMsg.match(/line (\d+)/i);
                if (match) {
                    const lineNum = parseInt(match[1], 10);
                    errorLineHandle = editor.addLineClass(lineNum - 1, 'background', 'error-line-bg');
                    editor.scrollIntoView({line: lineNum - 1, ch: 0}, 60);
                }

                const titleErr = typeof window.t === 'function' ? window.t('wv_err_syntax', '❌ Критическая ошибка синтаксиса XML:') : '❌ Критическая ошибка синтаксиса XML:';
                resultsPanel.addClass('error-panel')
                    .html(`<h3 style="margin-top:0;">${titleErr}</h3><p style="white-space: pre-wrap;">${escapeHtml(errorMsg)}</p>`)
                    .slideDown();
                return;
            }

            // ШАГ 2: Семантическая проверка WSDL
            const rootName = xmlDoc.documentElement.localName;

            const titleXmlOk = typeof window.t === 'function' ? window.t('wv_msg_xml_ok', '✅ XML синтаксис корректен!') : '✅ XML синтаксис корректен!';

            if (rootName !== 'definitions' && !xmlText.includes('wsdl:definitions')) {
                const msgNotWsdl = typeof window.t === 'function' ? window.t('wv_msg_not_wsdl', 'Но это не похоже на WSDL-файл (отсутствует корневой тег &lt;wsdl:definitions&gt;).') : 'Но это не похоже на WSDL-файл (отсутствует корневой тег &lt;wsdl:definitions&gt;).';
                resultsPanel.addClass('warning-panel')
                    .html(`<h3 style="margin-top:0;">${titleXmlOk}</h3><p>${msgNotWsdl}</p>`)
                    .slideDown();
                return;
            }

            const hasTypes = xmlDoc.querySelector("types") || xmlText.includes(':types');
            const hasMessage = xmlDoc.querySelector("message") || xmlText.includes(':message');
            const hasPortType = xmlDoc.querySelector("portType") || xmlText.includes(':portType');
            const hasBinding = xmlDoc.querySelector("binding") || xmlText.includes(':binding');
            const hasService = xmlDoc.querySelector("service") || xmlText.includes(':service');

            const allValid = hasTypes && hasMessage && hasPortType && hasBinding && hasService;

            const lblAnalysis = typeof window.t === 'function' ? window.t('wv_msg_analysis', 'Анализ структуры WSDL-документа:') : 'Анализ структуры WSDL-документа:';
            const lblTypes = typeof window.t === 'function' ? window.t('wv_chk_types', 'Блок &lt;wsdl:types&gt; (Структуры данных)') : 'Блок &lt;wsdl:types&gt; (Структуры данных)';
            const lblMsgs = typeof window.t === 'function' ? window.t('wv_chk_msgs', 'Блок &lt;wsdl:message&gt; (Сообщения)') : 'Блок &lt;wsdl:message&gt; (Сообщения)';
            const lblPorts = typeof window.t === 'function' ? window.t('wv_chk_ports', 'Блок &lt;wsdl:portType&gt; (Операции)') : 'Блок &lt;wsdl:portType&gt; (Операции)';
            const lblBinds = typeof window.t === 'function' ? window.t('wv_chk_binds', 'Блок &lt;wsdl:binding&gt; (Привязки SOAP)') : 'Блок &lt;wsdl:binding&gt; (Привязки SOAP)';
            const lblServs = typeof window.t === 'function' ? window.t('wv_chk_servs', 'Блок &lt;wsdl:service&gt; (Эндпоинты)') : 'Блок &lt;wsdl:service&gt; (Эндпоинты)';

            let html = `<h3 style="margin-top:0;">${titleXmlOk}</h3>`;
            html += `<p style="color: var(--text-muted);">${lblAnalysis}</p><ul class="check-list">`;

            html += `<li class="${hasTypes ? 'check-ok' : 'check-fail'}">${hasTypes ? '✔' : '✖'} ${lblTypes}</li>`;
            html += `<li class="${hasMessage ? 'check-ok' : 'check-fail'}">${hasMessage ? '✔' : '✖'} ${lblMsgs}</li>`;
            html += `<li class="${hasPortType ? 'check-ok' : 'check-fail'}">${hasPortType ? '✔' : '✖'} ${lblPorts}</li>`;
            html += `<li class="${hasBinding ? 'check-ok' : 'check-fail'}">${hasBinding ? '✔' : '✖'} ${lblBinds}</li>`;
            html += `<li class="${hasService ? 'check-ok' : 'check-fail'}">${hasService ? '✔' : '✖'} ${lblServs}</li>`;
            html += `</ul>`;

            if (allValid) {
                const msgValid = typeof window.t === 'function' ? window.t('wv_res_valid', '🎉 Это полностью валидный WSDL документ!') : '🎉 Это полностью валидный WSDL документ!';
                html += `<div style="margin-top:15px; font-weight:bold; color:var(--success-text);">${msgValid}</div>`;
                resultsPanel.addClass('success-panel');
            } else {
                const msgInvalid = typeof window.t === 'function' ? window.t('wv_res_invalid', '⚠️ Документ содержит не все необходимые для WSDL блоки.') : '⚠️ Документ содержит не все необходимые для WSDL блоки.';
                html += `<div style="margin-top:15px; font-weight:bold; color:var(--error-text);">${msgInvalid}</div>`;
                resultsPanel.addClass('warning-panel');
            }

            resultsPanel.html(html).slideDown();
        });
    });

    function escapeHtml(text) {
        if (!text) return "";
        return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
