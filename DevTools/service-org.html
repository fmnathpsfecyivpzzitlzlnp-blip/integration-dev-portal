<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Организация сервиса</title>
    <!-- Библиотеки -->
    <script src="libs/jquery-3.6.0.min.js"></script>
    <!-- Подключаем общий файл стилей, если он лежит в корне, или используем встроенные -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* === ЛОКАЛЬНЫЕ СТИЛИ СТРАНИЦЫ === */

        /* Переключение режимов (View / Edit) */
        .mode-view { display: block; }
        .mode-edit { display: none; width: 100%; gap: 10px; align-items: center; }

        /* Класс редактирования на body */
        body.editing .mode-view { display: none; }
        body.editing .mode-edit { display: flex; }

        /* Drag & Drop ручка (скрыта в режиме просмотра) */
        .drag-handle {
            display: none;
            cursor: grab;
            font-size: 18px;
            color: #ccc;
            margin-right: 8px;
            user-select: none;
        }
        body.editing .drag-handle { display: inline-block; }

        /* Стиль перетаскиваемой строки */
        .draggable-row.dragging {
            opacity: 0.5;
            background: #eef2ff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Выпадающие списки внутри таблицы */
        .sys-select {
            width: 45%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: #fff;
            font-size: 13px;
            font-weight: 500;
        }

        /* Бейджи для режима просмотра */
        .sys-view-badge {
            padding: 6px 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            font-weight: 600;
            color: #334155;
        }
        .arrow { font-weight:bold; color:#cbd5e1; font-size:1.2em; padding: 0 10px; }

        /* Фикс обрезания выпадающих списков в таблице */
        .task-table, .task-table tbody, .task-table tr, .task-table td {
            overflow: visible !important;
        }
        .table-wrapper { min-height: 300px; padding-bottom: 100px; }

        /* Кнопки в хедере */
        .header-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .header-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<!-- HEADER -->
<div style="height:60px; background:#2c3e50; color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 20px; flex-shrink:0;">
    <div style="display:flex; align-items:center; gap:15px;">
        <button onclick="window.location.href='task_tracker.html'" class="header-btn">← К задачам</button>
        <h3 style="margin:0; color: #fff; border: none;">Организация сервиса</h3>
        <span style="font-size:12px; color:#aaa;">ID задачи: <span id="task-id-display" style="color:#fff; font-weight: bold;">Loading...</span></span>
    </div>
    <div id="success-msg" style="color:#4ade80; font-weight:bold; display:none;">Изменения сохранены!</div>
</div>

<div class="main-content scroll-y">
    <div class="form-section">

        <!-- Toolbar -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #eee; padding-bottom:15px;">
            <h2 style="margin:0; border:none;">🧩 Интеграционные потоки</h2>
            <div style="display:flex; gap:10px;">
                <button id="btn-toggle" class="secondary" onclick="toggleEdit()">Редактировать структуру</button>
                <button id="btn-save" onclick="saveAll()" style="background:#27ae60; color:white; display:none; font-weight:bold; padding:8px 20px;">💾 Сохранить изменения</button>
            </div>
        </div>

        <!-- Edit Controls (Visible only in Edit) -->
        <div id="edit-controls" style="margin-bottom:15px; display:none; background: #f0f9ff; padding: 10px; border-radius: 4px; border: 1px solid #bae6fd;">
            <button onclick="addNewRow()" style="background:#3b82f6; color:white;">+ Добавить поток</button>
            <span style="font-size:12px; color:#0f172a; margin-left:10px;">Перетаскивайте строки за иконку <b>☰</b> для смены порядка. Нажмите "Сохранить изменения" для записи в базу.</span>
        </div>

        <!-- TABLE -->
        <div class="table-wrapper">
            <table class="task-table" id="flows_table">
                <thead>
                <tr>
                    <th width="60">#</th>
                    <th>Отправитель &rarr; Получатель</th>
                    <th width="180" style="text-align:right;">Действия</th>
                </tr>
                </thead>
                <tbody id="flows_body">
                <!-- Сгенерируется скриптом -->
                </tbody>
            </table>

            <!-- Пустое состояние -->
            <div id="empty_state" style="padding:50px; text-align:center; color:#94a3b8; display:none;">
                <div style="font-size:40px; margin-bottom:10px;">📭</div>
                <p>Потоков нет. Нажмите «Редактировать структуру», чтобы добавить.</p>
            </div>
        </div>

    </div>
</div>

<script>
    // === ИНИЦИАЛИЗАЦИЯ ПАРАМЕТРОВ ===
    const URL_PARAMS = new URLSearchParams(window.location.search);
    const TASK_ID = URL_PARAMS.get('id');

    // Проверка ID
    if (!TASK_ID) {
        document.body.innerHTML = '<div style="padding:40px; text-align:center; color: #333;"><h2>Ошибка: ID задачи не передан.</h2><br><button onclick="window.location.href=\'task_tracker.html\'">Вернуться в список задач</button></div>';
        throw new Error("No Task ID provided");
    }

    $('#task-id-display').text(TASK_ID);

    // Глобальное состояние
    let flows = [];       // Массив объектов потоков [{sender, receiver, id, order_num}, ...]
    let systemsRef = [];  // Справочник систем (массив строк SIDs) загруженный с сервера
    let isEditing = false;

    // === STARTUP ===
    $(function() {
        loadReferenceData();
    });

    // === 1. ЗАГРУЗКА ДАННЫХ ИЗ БД (Server.groovy) ===

    function loadReferenceData() {
        // Сначала грузим системы для Select-ов
        $.ajax({
            url: '/api/systems',
            type: 'GET',
            success: function(data) {
                // data = [{id: 1, sid: 'BS_CRM', description: '...'}, ...]
                // Нам нужны только SID для выпадающих списков
                systemsRef = data.map(s => s.sid).sort();

                // После загрузки справочников - грузим потоки
                loadFlows();
            },
            error: function(xhr) {
                console.error("Ошибка загрузки систем", xhr);
                alert("Не удалось загрузить справочник систем. Проверьте соединение с сервером.");
            }
        });
    }

    function loadFlows() {
        $.ajax({
            url: '/api/flows?task_id=' + TASK_ID,
            type: 'GET',
            success: function(data) {
                // data = [{id, sender, receiver, order_num}, ...]
                flows = data;
                render();
            },
            error: function(xhr) {
                console.error("Ошибка загрузки потоков", xhr);
                $('#flows_body').html('<tr><td colspan="3" style="color:red; text-align:center;">Ошибка загрузки данных</td></tr>');
            }
        });
    }

    // === 2. ОТРИСОВКА (RENDER) ===

    function render() {
        const tbody = $('#flows_body').empty();

        if (!flows || flows.length === 0) {
            $('#empty_state').show();
            $('#flows_table').hide();
        } else {
            $('#empty_state').hide();
            $('#flows_table').show();
        }

        flows.forEach((f, i) => {
            const num = i + 1;

            // Генерация опций для Select
            // Важный момент: если в потоке сохранена система, которую уже удалили из справочника,
            // мы должны добавить ее в select, иначе будет выбрано пустое поле.
            const sOpts = getOptionsHtml(f.sender);
            const rOpts = getOptionsHtml(f.receiver);

            const tr = $(`
                <tr class="draggable-row" data-idx="${i}" draggable="${isEditing}">
                    <td style="vertical-align: middle;">
                        <span class="drag-handle" title="Потяните для перемещения">☰</span>
                        <b style="font-size:14px; color:#555;">${num}</b>
                    </td>

                    <td>
                        <!-- Режим просмотра (READ ONLY) -->
                        <div class="mode-view">
                            <span class="sys-view-badge">${escapeHtml(f.sender) || '<span style="color:red;font-size:0.9em;">(не указано)</span>'}</span>
                            <span class="arrow">&rarr;</span>
                            <span class="sys-view-badge">${escapeHtml(f.receiver) || '<span style="color:red;font-size:0.9em;">(не указано)</span>'}</span>
                        </div>

                        <!-- Режим редактирования (INPUTS) -->
                        <div class="mode-edit">
                            <select class="sys-select inp-sender">
                                ${sOpts}
                            </select>
                            <span class="arrow">&rarr;</span>
                            <select class="sys-select inp-receiver">
                                ${rOpts}
                            </select>
                        </div>
                    </td>

                    <td style="text-align:right;">
                         <!-- Кнопка Детали доступна всегда, но отключается визуально при редактировании -->
                         <button class="secondary btn-details" onclick="goDetails(${num})" ${isEditing ? 'disabled style="opacity:0.5;"' : ''} title="Настройка протоколов и маппинга">⚙ Параметры</button>

                         <!-- Кнопка Удалить видна только в режиме редактирования -->
                         <span class="mode-edit" style="display:none; margin-left: 10px;">
                             <button class="danger" onclick="removeRow(${i})" title="Удалить строку">🗑</button>
                         </span>
                    </td>
                </tr>
            `);

            // Явное переключение видимости элементов строки в зависимости от состояния
            if (isEditing) {
                tr.find('.mode-view').hide();
                tr.find('.mode-edit').css('display', 'flex'); // Flex для выравнивания select-arrow-select
            } else {
                tr.find('.mode-view').show();
                tr.find('.mode-edit').hide();
            }

            tbody.append(tr);
        });

        updateUIState();
        // Инициализируем D&D заново, т.к. элементы пересозданы
        initDragAndDrop();
    }

    // Генератор HTML опций для <select>
    function getOptionsHtml(currentValue) {
        // Клонируем массив, чтобы не мутировать глобальный
        let list = [...systemsRef];

        // Если текущее значение есть, но его нет в справочнике - добавляем его временно
        if (currentValue && !list.includes(currentValue)) {
            list.unshift(currentValue);
        }

        let html = '<option value="">-- Выберите --</option>';
        list.forEach(sid => {
            const selected = (sid === currentValue) ? 'selected' : '';
            html += `<option value="${escapeHtml(sid)}" ${selected}>${escapeHtml(sid)}</option>`;
        });
        return html;
    }

    function escapeHtml(text) {
        if (!text) return '';
        return $('<div>').text(text).html();
    }

    // === 3. УПРАВЛЕНИЕ UI (КНОПКИ) ===

    window.toggleEdit = function() {
        if (isEditing) {
            // Попытка отмены
            if (confirm("Выйти без сохранения? Все несохраненные изменения будут потеряны.")) {
                isEditing = false;
                loadFlows(); // Откат к данным сервера
            }
        } else {
            // Вход в режим редактирования
            isEditing = true;
            render(); // Перерисовать с input-ами
        }
    }

    function updateUIState() {
        if (isEditing) {
            $('body').addClass('editing');
            $('#btn-toggle').text('Отмена').addClass('secondary'); // Стиль серой кнопки
            $('#btn-save').show();
            $('#edit-controls').slideDown(200);
        } else {
            $('body').removeClass('editing');
            $('#btn-toggle').text('✏️ Редактировать структуру').removeClass('secondary');
            $('#btn-save').hide();
            $('#edit-controls').slideUp(200);
        }
    }

    // === 4. ЛОГИКА СОХРАНЕНИЯ (POST) ===

    window.saveAll = function() {
        // Считываем данные из DOM-элементов (input/select), так как пользователь мог их менять
        let flowsToSave = [];

        $('#flows_body tr').each(function() {
            const row = $(this);
            const senderVal = row.find('.inp-sender').val();
            const receiverVal = row.find('.inp-receiver').val();

            // Пустые строки пропускать не обязательно, сервер сохранит как пустые строки или можно фильтровать
            flowsToSave.push({
                sender: senderVal || "",
                receiver: receiverVal || ""
            });
        });

        // Валидация (опционально)
        // if (flowsToSave.length === 0) { return alert("Нет данных для сохранения"); }

        const payload = {
            task_id: parseInt(TASK_ID),
            flows: flowsToSave
        };

        // Анимация сохранения
        const btn = $('#btn-save');
        const originalText = btn.text();
        btn.text('Сохранение...').prop('disabled', true);

        $.ajax({
            url: '/api/flows',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            success: function(response) {
                $('#success-msg').text(`Успешно сохранено (${response.saved} записей)`).fadeIn().delay(2000).fadeOut();

                // Успех
                isEditing = false;
                loadFlows(); // Перезагрузить (получить свежие данные и order)
            },
            error: function(xhr) {
                alert('Ошибка при сохранении: ' + xhr.responseText);
            },
            complete: function() {
                btn.text(originalText).prop('disabled', false);
            }
        });
    };

    window.addNewRow = function() {
        // Синхронизируем текущие инпуты в массив state перед ререндером
        syncInputsToState();

        // Добавляем пустую запись
        flows.push({ sender: '', receiver: '' });

        render();

        // Скроллим вниз
        $('html, body').animate({ scrollTop: $(document).height() }, 'fast');
    };

    window.removeRow = function(index) {
        if(!confirm("Удалить этот поток?")) return;

        syncInputsToState();

        // Удаляем элемент массива
        flows.splice(index, 1);

        render();
    };

    // Helper: считывает состояние полей в переменную flows, чтобы не потерять ввод при ре-рендере
    function syncInputsToState() {
        let syncedFlows = [];
        $('#flows_body tr').each(function() {
            syncedFlows.push({
                sender: $(this).find('.inp-sender').val(),
                receiver: $(this).find('.inp-receiver').val(),
                // ID сохраняем если есть (но при сохранении все равно старые удаляются и новые создаются по логике Server.groovy)
                id: null
            });
        });
        flows = syncedFlows;
    }

    // === 5. НАВИГАЦИЯ ===

    window.goDetails = function(flowOrder) {
        // Переходим на страницу деталей. flow_order соответствует order_num в БД.
        window.location.href = `flow-details.html?task_id=${TASK_ID}&flow_order=${flowOrder}`;
    };

    // === 6. DRAG & DROP (NATIVE) ===
    // Логика перемещения строк таблицы
    function initDragAndDrop() {
        const container = document.getElementById('flows_body');
        let draggedItem = null;

        // Ищем строки с классом draggable-row
        const rows = container.querySelectorAll('.draggable-row');

        rows.forEach(row => {
            row.addEventListener('dragstart', function(e) {
                if (!isEditing) {
                    e.preventDefault();
                    return;
                }
                draggedItem = row;
                e.dataTransfer.effectAllowed = 'move';
                // Небольшая задержка для визуала
                setTimeout(() => row.classList.add('dragging'), 0);
            });

            row.addEventListener('dragend', function() {
                row.classList.remove('dragging');
                draggedItem = null;

                // После окончания перетаскивания, нужно обновить массив flows в соответствии с новым DOM
                // Так как мы сохраняем saveAll() считыванием из DOM, главное сейчас -
                // пересчитать номера порядковые (визуально).
                updateOrderNumbersVisual();
            });

            // Добавляем поддержку touch для мобилок (опционально, если jqueryui не используется)
            // Для простоты здесь только нативный drag API
        });

        container.addEventListener('dragover', function(e) {
            if (!isEditing) return;
            e.preventDefault();
            const afterElement = getDragAfterElement(container, e.clientY);
            if (afterElement == null) {
                container.appendChild(draggedItem);
            } else {
                container.insertBefore(draggedItem, afterElement);
            }
        });
    }

    // Хелпер для определения позиции вставки
    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.draggable-row:not(.dragging)')];

        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // Пересчет визуальных номеров (1, 2, 3) после DnD
    function updateOrderNumbersVisual() {
        let index = 1;
        $('#flows_body tr').each(function() {
            $(this).find('td:first b').text(index++);
        });
    }

</script>

</body>
</html>
