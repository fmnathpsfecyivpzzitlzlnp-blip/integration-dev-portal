<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор XSD -> WSDL</title>

    <!-- Библиотеки -->
    <script src="libs/jquery-3.6.0.min.js"></script>

    <!-- CodeMirror (Редактор) -->
    <link rel="stylesheet" href="libs/codemirror.min.css">
    <link rel="stylesheet" href="libs/dracula.min.css">
    <script src="libs/codemirror.min.js"></script>
    <script src="libs/xml.min.js"></script>

    <!-- Общие стили -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* === СТИЛИ ЛАЯУТА === */
        body {
            background-color: #f4f7f9;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Убираем скролл у всей страницы */
        }

        /* Верхняя панель */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-shrink: 0; /* Не сжимать заголовок */
        }

        /* Основная рабочая область (Grid) */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Две равные колонки */
            gap: 20px;
            height: 100%;
            min-height: 0; /* Хаки для Flex/Grid скроллинга */
            overflow: hidden;
        }

        .panel {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            height: 100%;
            overflow: hidden;
        }

        .panel-head {
            padding: 12px 15px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 600;
            color: #334155;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1; /* Растягиваем на всю высоту панели */
            background-color: #fff;
            gap: 15px;
            overflow: hidden; /* Чтобы скроллил только CodeMirror */
            height: 100%;
        }

        /* Блок настроек (Input fields) не должен растягиваться */
        .settings-block {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Контейнер для редактора кода - занимает все остальное место */
        .code-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            overflow: hidden;
            min-height: 100px; /* Минимальная высота */
        }

        /* Сам редактор */
        .CodeMirror {
            height: 100% !important; /* Заставляет редактор заполнить контейнер */
            font-family: 'Consolas', monospace;
            font-size: 13px;
            flex: 1;
        }

        /* Контролы */
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 12px;
            color: #475569;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus, select:focus {
            border-color: #3b82f6;
            outline: none;
        }

        /* Кнопка */
        .convert-btn {
            width: 100%;
            padding: 10px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0; /* Чтобы не сплющивалась */
        }
        .convert-btn:hover { background: #2563eb; }
        .convert-btn:active { transform: translateY(1px); }

    </style>
</head>
<body>

<!-- Заголовок -->
<div class="top-bar">
    <button onclick="window.location.href='index.html'" class="secondary">🏠 Домой</button>
    <h2 style="margin:0; font-size:22px; color:#1e293b;">Генератор XSD → WSDL</h2>
</div>

<!-- Рабочая область -->
<div class="workspace">

    <!-- ЛЕВАЯ КОЛОНКА -->
    <div class="panel">
        <div class="panel-head">
            <span>1. Настройки и исходный XSD</span>
        </div>
        <div class="panel-body">

            <div class="settings-block">
                <div>
                    <label for="xsd-filename">Имя XSD файла (без расширения = Namespace):</label>
                    <input type="text" id="xsd-filename" placeholder="Например: MyMessage" value="MyMessage.xsd">
                </div>
                <div>
                    <label for="service-type">Шаблон WSDL:</label>
                    <select id="service-type">
                        <option value="synchronous">Синхронный (Request-Response)</option>
                        <option value="asynchronous">Асинхронный (One-Way)</option>
                    </select>
                </div>
                <label>Содержимое XSD:</label>
            </div>

            <div class="code-wrapper">
                <textarea id="input-xsd"></textarea>
            </div>

            <button id="convert-btn" class="convert-btn">⚡ Сгенерировать WSDL</button>
        </div>
    </div>

    <!-- ПРАВАЯ КОЛОНКА -->
    <div class="panel">
        <div class="panel-head">
            <span>2. Результат (WSDL)</span>
        </div>
        <div class="panel-body">
            <div class="code-wrapper">
                <textarea id="output-wsdl"></textarea>
            </div>
        </div>
    </div>

</div>

<script>
    let editorIn, editorOut;

    $(function() {
        // 1. Инициализация редакторов
        // Левый редактор (Светлый или Стандартный)
        editorIn = CodeMirror.fromTextArea(document.getElementById('input-xsd'), {
            mode: "xml",
            lineNumbers: true,
            theme: "default",
            lineWrapping: true,
            matchBrackets: true
        });

        // Правый редактор (Темный - Дракула, для контраста результата)
        editorOut = CodeMirror.fromTextArea(document.getElementById('output-wsdl'), {
            mode: "xml",
            lineNumbers: true,
            theme: "dracula",
            lineWrapping: true,
            readOnly: true // Результат нельзя править руками, только копировать
        });

        // 2. Дефолтное значение
        const exampleXsd = `<?xml version="1.0" encoding="UTF-8"?>
<xsd:schema xmlns:xsd="http://www.w3.org/2001/XMLSchema">
    <xsd:element name="SimpleRequest">
        <xsd:complexType>
            <xsd:sequence>
                <xsd:element name="requestId" type="xsd:string"/>
                <xsd:element name="payload" type="xsd:string"/>
            </xsd:sequence>
        </xsd:complexType>
    </xsd:element>
</xsd:schema>`;

        editorIn.setValue(exampleXsd);

        // 3. Обработчик кнопки
        $('#convert-btn').on('click', function() {
            const xsdVal = editorIn.getValue();
            const fname = $('#xsd-filename').val();
            const stype = $('#service-type').val();

            if(!xsdVal.trim() || !fname.trim()) {
                alert('Пожалуйста, заполните XSD контент и имя файла.');
                return;
            }

            const btn = $(this);
            const originalText = btn.text();
            btn.prop('disabled', true).text('⏳ Генерация...');
            editorOut.setValue("Обработка...");

            const payload = {
                xsdContent: xsdVal,
                xsdFileName: fname,
                serviceType: stype
            };

            $.ajax({
                url: '/api/xsd-to-wsdl',
                type: 'POST',
                contentType: 'application/json',
                dataType: 'text', // Важно: получаем строку, не XML DOM
                data: JSON.stringify(payload),
                success: function(wsdlText) {
                    editorOut.setValue(wsdlText);
                },
                error: function(xhr) {
                    let msg = "Ошибка соединения с сервером";
                    try {
                        // Пытаемся достать JSON ошибку, если сервер её прислал
                        msg = JSON.parse(xhr.responseText).message;
                    } catch(e) {
                        // Иначе берем сырой текст (например, стектрейс Groovy)
                        if(xhr.responseText) msg = xhr.responseText;
                    }
                    editorOut.setValue("ОШИБКА:\n" + msg);
                },
                complete: function() {
                    btn.prop('disabled', false).text(originalText);
                }
            });
        });
    });
</script>

</body>
</html>
