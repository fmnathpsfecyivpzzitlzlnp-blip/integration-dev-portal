<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор XSD -> WSDL</title>

    <script src="libs/jquery-3.6.0.min.js"></script>

    <link rel="stylesheet" href="libs/codemirror.min.css">
    <link rel="stylesheet" href="libs/dracula.min.css">
    <script src="libs/codemirror.min.js"></script>
    <script src="libs/xml.min.js"></script>
    <script src="utils.js"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        body { background-color: #f4f7f9; margin: 0; padding: 20px; height: 100vh; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; flex-shrink: 0; }
        .workspace { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 100%; min-height: 0; overflow: hidden; }
        .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02); height: 100%; overflow: hidden; }
        .panel-head { padding: 12px 15px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-weight: 600; color: #334155; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
        .panel-body { padding: 15px; display: flex; flex-direction: column; flex: 1; background-color: #fff; gap: 15px; overflow: hidden; height: 100%; }
        .settings-block { flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
        .code-wrapper { flex: 1; display: flex; flex-direction: column; border: 1px solid #cbd5e1; border-radius: 4px; overflow: hidden; min-height: 100px; }
        .CodeMirror { height: 100% !important; font-family: 'Consolas', monospace; font-size: 13px; flex: 1; }
        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 12px; color: #475569; }
        input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; box-sizing: border-box; font-family: inherit; }
        input:focus, select:focus { border-color: #3b82f6; outline: none; }
        .convert-btn { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
        .convert-btn:hover { background: #2563eb; }
        .convert-btn:active { transform: translateY(1px); }
    </style>
</head>
<body>

<div class="top-bar">
    <button onclick="window.location.href='index.html'" class="secondary">🏠 Домой</button>
    <h2 style="margin:0; font-size:22px; color:#1e293b;">Генератор XSD → WSDL</h2>
</div>

<div class="workspace">
    <div class="panel">
        <div class="panel-head"><span>1. Настройки и исходный XSD</span></div>
        <div class="panel-body">
            <div class="settings-block">
                <div>
                    <label for="service-type">Шаблон WSDL:</label>
                    <select id="service-type">
                        <option value="synchronous">Синхронный (Request-Response)</option>
                        <option value="asynchronous">Асинхронный (One-Way)</option>
                    </select>
                </div>
                <label>Содержимое XSD:</label>
            </div>
            <div class="code-wrapper"><textarea id="input-xsd"></textarea></div>
            <button id="convert-btn" class="convert-btn">⚡ Сгенерировать WSDL</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-head"><span>2. Результат (WSDL)</span></div>
        <div class="panel-body">
            <div class="code-wrapper"><textarea id="output-wsdl"></textarea></div>
        </div>
    </div>
</div>

<script>
    let editorIn, editorOut;

    $(function() {
        editorIn = CodeMirror.fromTextArea(document.getElementById('input-xsd'), {
            mode: "xml", lineNumbers: true, theme: "default", lineWrapping: true, matchBrackets: true
        });

        editorOut = CodeMirror.fromTextArea(document.getElementById('output-wsdl'), {
            mode: "xml", lineNumbers: true, theme: "dracula", lineWrapping: true, readOnly: true
        });

        const exampleXsd = `<?xml version="1.0" encoding="UTF-8"?>
<xsd:schema xmlns:xsd="http://www.w3.org/2001/XMLSchema">
    <xsd:element name="SimpleRequest">
        <xsd:complexType>
            <xsd:sequence>
                <xsd:element name="requestId" type="xsd:string"/>
                <xsd:element name="payload" type="xsd:string"/>
            </xsd:sequence>
        </xsd:complexType>
    </xsd:element>
</xsd:schema>`;

        editorIn.setValue(exampleXsd);

        $('#convert-btn').on('click', function() {
            const xsdVal = editorIn.getValue();
            const stype = $('#service-type').val();

            if(!xsdVal.trim()) {
                alert('Пожалуйста, заполните XSD контент.');
                return;
            }

            const btn = $(this);
            const originalText = btn.text();
            btn.prop('disabled', true).text('⏳ Генерация...');
            editorOut.setValue("Обработка...");

            const payload = {
                xsdContent: xsdVal,
                xsdFileName: "DefaultNamespace", // Хардкодим имя
                serviceType: stype
            };

            $.ajax({
                url: '/api/xsd-to-wsdl',
                type: 'POST',
                contentType: 'application/json',
                dataType: 'text',
                data: JSON.stringify(payload),
                success: function(wsdlText) { editorOut.setValue(wsdlText); },
                error: function(xhr) {
                    let msg = "Ошибка соединения с сервером";
                    try { msg = JSON.parse(xhr.responseText).message; }
                    catch(e) { if(xhr.responseText) msg = xhr.responseText; }
                    editorOut.setValue("ОШИБКА:\n" + msg);
                },
                complete: function() { btn.prop('disabled', false).text(originalText); }
            });
        });
    });
    function escapeHtml(text) {
        if (!text) return "";
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
