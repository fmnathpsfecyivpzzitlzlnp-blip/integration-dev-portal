<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-i18n="x2w_page_title">Генератор XSD -> WSDL</title>

    <script src="libs/jquery-3.6.0.min.js"></script>

    <link rel="stylesheet" href="libs/codemirror.min.css">
    <link rel="stylesheet" href="libs/dracula.min.css">
    <script src="libs/codemirror.min.js"></script>
    <script src="libs/xml.min.js"></script>
    <script src="utils.js"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        /* === ПЕРЕМЕННЫЕ ДЛЯ ТЕМНОЙ ТЕМЫ === */
        :root {
            --bg-main: #f4f7f9;
            --bg-card: #ffffff;
            --bg-header: #f8fafc;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --btn-sec-bg: #e2e8f0;
            --btn-sec-hover: #cbd5e1;
        }

        body.dark-theme {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-header: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --btn-sec-bg: #334155;
            --btn-sec-hover: #475569;
        }

        /* === БРОНЕБОЙНАЯ ИЗОЛЯЦИЯ ОТ style.css === */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            height: 100vh !important;
            overflow: hidden !important;
        }

        body {
            background-color: var(--bg-main) !important;
            padding: 20px !important;
            box-sizing: border-box !important;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
            display: flex !important;
            flex-direction: column !important;
            color: var(--text-main) !important;
            transition: background 0.3s, color 0.3s;
        }

        .top-bar { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; flex-shrink: 0; }
        .top-bar h2 { margin: 0; font-size: 22px; color: var(--text-main); transition: 0.3s; }

        .btn { padding: 8px 15px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn.secondary { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn.secondary:hover { filter: brightness(0.95); }
        .btn.primary { background: #3b82f6; color: white; }
        .btn.primary:hover { background: #2563eb; }

        .workspace { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 100%; min-height: 0; overflow: hidden; }

        .panel { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02); height: 100%; overflow: hidden; transition: 0.3s; }
        .panel-head { padding: 12px 15px; background: var(--bg-header); border-bottom: 1px solid var(--border-color); font-weight: 600; color: var(--text-main); flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .panel-body { padding: 15px; display: flex; flex-direction: column; flex: 1; background-color: var(--bg-card); gap: 15px; overflow: hidden; height: 100%; transition: 0.3s; }

        .settings-block { flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }

        .code-wrapper { flex: 1; display: flex; flex-direction: column; border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; min-height: 100px; transition: 0.3s; }
        .CodeMirror { height: 100% !important; font-family: 'Consolas', monospace; font-size: 13px; flex: 1; background: var(--input-bg); color: var(--text-main); }

        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 12px; color: var(--text-muted); transition: 0.3s; }

        select { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 13px; box-sizing: border-box; font-family: inherit; background: var(--input-bg); color: var(--text-main); outline: none; transition: 0.3s; }
        select:focus { border-color: #3b82f6; }

        .convert-btn { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
        .convert-btn:hover { background: #2563eb; }
        .convert-btn:active { transform: translateY(1px); }
        .convert-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

<div class="top-bar">
    <button onclick="window.location.href='index.html'" class="btn secondary" data-i18n="btn_home">🏠 Домой</button>
    <h2 data-i18n="x2w_title">Генератор XSD → WSDL</h2>
</div>

<div class="workspace">
    <div class="panel">
        <div class="panel-head"><span data-i18n="x2w_panel_1">1. Настройки и исходный XSD</span></div>
        <div class="panel-body">
            <div class="settings-block">
                <div>
                    <label for="service-type" data-i18n="x2w_lbl_tpl">Шаблон WSDL:</label>
                    <select id="service-type">
                        <option value="synchronous" data-i18n="x2w_opt_sync">Синхронный (Request-Response)</option>
                        <option value="asynchronous" data-i18n="x2w_opt_async">Асинхронный (One-Way)</option>
                    </select>
                </div>
                <label data-i18n="x2w_lbl_xsd">Содержимое XSD:</label>
            </div>
            <div class="code-wrapper"><textarea id="input-xsd"></textarea></div>
            <button id="convert-btn" class="convert-btn" data-i18n="x2w_btn_gen">⚡ Сгенерировать WSDL</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-head"><span data-i18n="x2w_panel_2">2. Результат (WSDL)</span></div>
        <div class="panel-body">
            <div class="code-wrapper"><textarea id="output-wsdl"></textarea></div>
        </div>
    </div>
</div>

<script>
    let editorIn, editorOut;

    $(function() {
        if(typeof initLocalization === 'function') initLocalization();
        const isDark = localStorage.getItem('global_dark_theme') === 'true';
        if(typeof applyTheme === 'function') applyTheme(isDark);

        const cmTheme = isDark ? "dracula" : "default";

        editorIn = CodeMirror.fromTextArea(document.getElementById('input-xsd'), {
            mode: "xml", lineNumbers: true, theme: cmTheme, lineWrapping: true, matchBrackets: true
        });

        editorOut = CodeMirror.fromTextArea(document.getElementById('output-wsdl'), {
            mode: "xml", lineNumbers: true, theme: cmTheme, lineWrapping: true, readOnly: true
        });

        window.addEventListener('themeChanged', function(e) {
            const newCmTheme = e.detail.isDark ? 'dracula' : 'default';
            editorIn.setOption('theme', newCmTheme);
            editorOut.setOption('theme', newCmTheme);
        });

        const exampleXsd = `<?xml version="1.0" encoding="UTF-8"?>
<xsd:schema xmlns:xsd="http://www.w3.org/2001/XMLSchema">
    <xsd:element name="SimpleRequest">
        <xsd:complexType>
            <xsd:sequence>
                <xsd:element name="requestId" type="xsd:string"/>
                <xsd:element name="payload" type="xsd:string"/>
            </xsd:sequence>
        </xsd:complexType>
    </xsd:element>
</xsd:schema>`;

        editorIn.setValue(exampleXsd);

        $('#convert-btn').on('click', function() {
            const xsdVal = editorIn.getValue();
            const stype = $('#service-type').val();

            if(!xsdVal.trim()) {
                const msgEmpty = typeof window.t === 'function' ? window.t('x2w_err_empty_xsd', 'Пожалуйста, заполните XSD контент.') : 'Пожалуйста, заполните XSD контент.';
                alert(msgEmpty);
                return;
            }

            const btn = $(this);
            const originalText = btn.text();

            const txtLoading = typeof window.t === 'function' ? window.t('x2w_msg_gen', '⏳ Генерация...') : '⏳ Генерация...';
            const txtProc = typeof window.t === 'function' ? window.t('x2w_msg_processing', 'Обработка...') : 'Обработка...';

            btn.prop('disabled', true).text(txtLoading);
            editorOut.setValue(txtProc);

            const payload = {
                xsdContent: xsdVal,
                xsdFileName: "DefaultNamespace", // Хардкодим имя
                serviceType: stype
            };

            $.ajax({
                url: '/api/xsd-to-wsdl',
                type: 'POST',
                contentType: 'application/json',
                dataType: 'text',
                data: JSON.stringify(payload),
                success: function(wsdlText) { editorOut.setValue(wsdlText); },
                error: function(xhr) {
                    let msg = typeof window.t === 'function' ? window.t('err_server_conn', "Ошибка соединения с сервером") : "Ошибка соединения с сервером";
                    try { msg = JSON.parse(xhr.responseText).message; }
                    catch(e) { if(xhr.responseText) msg = xhr.responseText; }

                    const prefixErr = typeof window.t === 'function' ? window.t('x2w_err_prefix', "ОШИБКА:\n") : "ОШИБКА:\n";
                    editorOut.setValue(prefixErr + msg);
                },
                complete: function() { btn.prop('disabled', false).text(originalText); }
            });
        });
    });

    function escapeHtml(text) {
        if (!text) return "";
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
