<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="sym_page_title">Продвинутый анализатор текста</title>

    <script src="libs/jquery-3.6.0.min.js"></script>
    <script src="utils.js"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        /* === ПЕРЕМЕННЫЕ ДЛЯ ТЕМНОЙ ТЕМЫ === */
        :root {
            --bg-main: #f9f9f9;
            --bg-card: #ffffff;
            --text-main: #333333;
            --text-muted: #555555;
            --border-color: #dddddd;
            --input-bg: #ffffff;
            --space-dot: #b0bec5;
        }

        body.dark-theme {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --space-dot: #64748b;
        }

        /* === БРОНЕБОЙНАЯ ИЗОЛЯЦИЯ ОТ style.css === */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            height: 100vh !important;
            overflow: hidden !important;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
            background-color: var(--bg-main) !important;
            color: var(--text-main) !important;
            display: flex !important;
            flex-direction: column !important;
            box-sizing: border-box !important;
            transition: background 0.3s, color 0.3s;
            padding: 20px !important;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .header h2 { margin: 0; font-size: 22px; color: var(--text-main); }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: var(--text-muted); }

        .btn-secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 15px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-secondary:hover { filter: brightness(0.95); }

        .settings {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            padding: 15px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            flex-wrap: wrap;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .color-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }
        input[type="color"] {
            border: none;
            width: 30px;
            height: 30px;
            padding: 0;
            cursor: pointer;
            border-radius: 4px;
            background: transparent;
        }
        textarea {
            width: 100%;
            flex: 0.6;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            resize: none;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            margin-bottom: 15px;
            background: var(--input-bg);
            color: var(--text-main);
            transition: 0.3s;
            outline: none;
        }
        textarea:focus { border-color: #3b82f6; }

        button.primary {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s;
            align-self: flex-start;
        }
        button.primary:hover {
            background-color: #059669;
        }

        .result-container {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        .result-container h3 { margin-top: 0; margin-bottom: 10px; font-size: 16px; }
        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 13px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-color-box {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 1px solid var(--border-color);
        }
        #result {
            flex: 1;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            min-height: 60px;
            background: var(--input-bg);
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.5;
            overflow-y: auto;
            color: var(--text-main);
            transition: 0.3s;
        }
        .invisible-char {
            color: #fff;
            font-size: 11px;
            padding: 1px 4px;
            border-radius: 3px;
            cursor: help;
            font-weight: bold;
        }
        .space-dot {
            color: var(--space-dot);
            font-weight: bold;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

<div class="header">
    <div style="display: flex; align-items: center; gap: 15px;">
        <button onclick="window.location.href='index.html'" class="btn-secondary" data-i18n="btn_home">🏠 Домой</button>
        <div>
            <h2 data-i18n="sym_title">Анализатор текста на раскладку и скрытые символы</h2>
            <p data-i18n="sym_subtitle">Вставьте текст. Инструмент подсветит кириллицу, латиницу, визуализирует обычные пробелы и найдет скрытые нечитаемые символы.</p>
        </div>
    </div>
</div>

<div class="settings">
    <div class="color-control">
        <input type="color" id="cyrillicColor" value="#a8f0c6">
        <label for="cyrillicColor" data-i18n="sym_lbl_cyr">Кириллица</label>
    </div>
    <div class="color-control">
        <input type="color" id="latinColor" value="#ffcdd2">
        <label for="latinColor" data-i18n="sym_lbl_lat">Латиница</label>
    </div>
    <div class="color-control">
        <input type="color" id="invisibleColor" value="#9e9e9e">
        <label for="invisibleColor" data-i18n="sym_lbl_inv">Скрытые символы</label>
    </div>
</div>

<textarea id="inputText"></textarea>

<button class="primary" onclick="analyzeText()" data-i18n="sym_btn_check">Проверить</button>

<div class="result-container">
    <h3 data-i18n="sym_lbl_result">Результат:</h3>
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color-box" id="legendCyrillic" style="background-color: #a8f0c6;"></div> - <span data-i18n="sym_leg_cyr">кириллические символы</span>
        </div>
        <div class="legend-item">
            <div class="legend-color-box" id="legendLatin" style="background-color: #ffcdd2;"></div> - <span data-i18n="sym_leg_lat">латинские символы</span>
        </div>
        <div class="legend-item">
            <div class="legend-color-box" id="legendInvisible" style="background-color: #9e9e9e;"></div> - <span data-i18n="sym_leg_inv">скрытые/спец. символы</span>
        </div>
    </div>

    <div id="result" data-i18n="sym_res_empty">Здесь появится результат проверки...</div>
</div>

<script>
    $(function() {
        if(typeof initLocalization === 'function') initLocalization();
        const isDark = localStorage.getItem('global_dark_theme') === 'true';
        if(typeof applyTheme === 'function') applyTheme(isDark);

        if (typeof window.t === 'function') {
            $('#inputText').attr('placeholder', window.t('sym_ph_input', 'Введите ваш текст сюда... (например: аadsfsd fsdfsdf)'));
        }
    });

    function analyzeText() {
        const text = document.getElementById('inputText').value;
        const resultBox = document.getElementById('result');

        // Получаем цвета из настроек
        const cyrillicColor = document.getElementById('cyrillicColor').value;
        const latinColor = document.getElementById('latinColor').value;
        const invisibleColor = document.getElementById('invisibleColor').value;

        // Обновляем цвета в легенде
        document.getElementById('legendCyrillic').style.backgroundColor = cyrillicColor;
        document.getElementById('legendLatin').style.backgroundColor = latinColor;
        document.getElementById('legendInvisible').style.backgroundColor = invisibleColor;

        if (!text) {
            const msgEmpty = typeof window.t === 'function' ? window.t('sym_err_empty', 'Текст не введен.') : 'Текст не введен.';
            resultBox.innerHTML = `<span style="color: var(--text-muted); font-style: italic;">${msgEmpty}</span>`;
            return;
        }

        let analyzedHTML = '';

        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            let code = char.charCodeAt(0);

            // 1. Кириллица (основная + Ёё)
            if (/[А-Яа-яЁё]/.test(char)) {
                // Принудительно делаем текст черным, так как маркеры по умолчанию светлые
                analyzedHTML += `<span style="background-color: ${cyrillicColor}; color: #000; border-radius: 2px;">${char}</span>`;
            }
            // 2. Латиница
            else if (/[A-Za-z]/.test(char)) {
                analyzedHTML += `<span style="background-color: ${latinColor}; color: #000; border-radius: 2px;">${char}</span>`;
            }
            // 3. Обычный пробел (заменяем на визуальную точку)
            else if (char === ' ') {
                analyzedHTML += `<span class="space-dot">·</span>`;
            }
            // 4. Обычный перенос строки (оставляем как есть, чтобы текст не слипся)
            else if (char === '\n' || char === '\r') {
                analyzedHTML += char;
            }
            // 5. Скрытые, управляющие символы и неразрывные пробелы
            else if (/[\u00A0\u2000-\u200F\u2028-\u202F\u205F\u3000\uFEFF\t]/.test(char) || (code >= 0 && code <= 31 && code !== 10 && code !== 13)) {
                let hexCode = code.toString(16).toUpperCase().padStart(4, '0');
                let charLabel = 'INV'; // Индикатор по умолчанию

                if (code === 160) charLabel = 'NBSP'; // Non-breaking space
                if (code === 9) charLabel = 'TAB'; // Tab
                if (code === 8203) charLabel = 'ZWSP'; // Zero-width space

                const titleText = typeof window.t === 'function' ? window.t('sym_hint_code', 'Код символа: U+') : 'Код символа: U+';

                analyzedHTML += `<span class="invisible-char" style="background-color: ${invisibleColor};" title="${titleText}${hexCode}">[${charLabel}]</span>`;
            }
            // 6. Цифры, пунктуация и прочие видимые символы (оставляем как есть)
            else {
                analyzedHTML += char;
            }
        }

        resultBox.innerHTML = analyzedHTML;
    }
</script>
</body>
</html>
