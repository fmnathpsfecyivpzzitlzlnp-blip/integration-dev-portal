<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Редактор XML/JSON</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="libs/themes/default/style.min.css"/>
    <link rel="stylesheet" href="style.css">
    <style>
        .editor-container { display: flex; height: calc(100vh - 230px); gap: 10px; margin-top: 10px; }
        #json-editor { width: 40%; height: 100%; font-family: monospace; font-size: 14px; box-sizing: border-box; }
        #tree-viewer { width: 60%; height: 100%; overflow: auto; border: 1px solid #ccc; background-color: #fff; box-sizing: border-box; }
        .controls-top { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .controls-top button, .controls-top select { padding: 8px 12px; }
        .controls-top input { flex-grow: 1; padding: 8px; border-radius: 4px; border: 1px solid #ccc;}
        .editor-header-bar { background-color: #f7f7f7; padding: 8px; border-bottom: 1px solid #ddd; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
        .vakata-context { z-index: 10000; }
    </style>
</head>
<body>

<div class="main-content">
    <div class="editor-header-bar">
        <span><b>Формат:</b>
            <select id="format-select">
                <option value="json">JSON</option>
                <option value="xml">XML</option>
            </select>
        </span>
        <div>
            <button id="btn-beautify">1. Разобрать</button>
            <button id="btn-to-text">3. Собрать</button>
        </div>
    </div>

    <div class="controls-top">
        <label for="url-input">Загрузить по URL:</label>
        <input type="text" id="url-input" placeholder="http://.../data.json">
        <button id="btn-fetch-url">Загрузить</button>
    </div>

    <div class="controls-top">
        <label for="doc-select">Сохраненные документы:</label>
        <select id="doc-select"></select>
        <button id="btn-load-doc">Загрузить</button>
        <button id="btn-delete-doc">Удалить</button>
    </div>

    <div class="controls-top">
        <label for="save-name-input">Имя для сохранения:</label>
        <input type="text" id="save-name-input" placeholder="my_document1">
        <button id="btn-save-doc">Сохранить на сервере</button>
    </div>

    <div class="editor-container">
        <textarea id="json-editor"></textarea>
        <div id="tree-viewer"></div>
    </div>
</div>

<div id="notification" class="notification"></div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js"></script>
<script>
    $(function() {
        $('#tree-viewer').jstree({
            'core': { 'check_callback': true, 'data': [], 'themes': { 'stripes': true }, 'force_text': true },
            'plugins': ['contextmenu', 'dnd', 'types'],
            'types' : { 'object':{'icon':'jstree-folder'}, 'array':{'icon':'jstree-folder'}, 'value':{'icon':'jstree-file'} },
            'contextmenu': { 'items': customMenu }
        }).on('rename_node.jstree', onNodeChange).on('copy_node.jstree', onNodeCopy)
            .on('create_node.jstree', (e, data) => data.instance.edit(data.node));

        function customMenu(node) {
            const tree = $('#tree-viewer').jstree(true);
            let items = {
                create: { label: 'Создать...', submenu: {
                        create_value: { 'label': 'Значение', 'action': () => createChildNode(node, 'value') },
                        create_object: { 'label': 'Объект', 'action': () => createChildNode(node, 'object') },
                        create_array: { 'label': 'Массив', 'action': () => createChildNode(node, 'array') }
                    }},
                rename: { 'label': 'Переименовать / Изменить', 'action': () => tree.edit(node) },
                delete: { 'label': 'Удалить', 'action': () => tree.delete_node(node) },
                sep1: { 'separator': true },
                cut: { 'label': 'Вырезать', 'action': (data) => $.jstree.reference(data.reference).cut($.jstree.reference(data.reference).get_node(data.reference)) },
                copy: { 'label': 'Копировать', 'action': (data) => $.jstree.reference(data.reference).copy($.jstree.reference(data.reference).get_node(data.reference)) },
                paste: { 'label': 'Вставить', 'action': (data) => $.jstree.reference(data.reference).paste($.jstree.reference(data.reference).get_node(data.reference)) }
            };

            if (!tree.can_paste()) { delete items.paste; }
            if (node.type !== 'object' && node.type !== 'array' && node.id !== 'root') { delete items.create; }
            if (node.id === 'root') { delete items.rename; delete items.delete; delete items.sep1; delete items.cut; delete items.copy; }
            const parentNode = tree.get_node(node.parent);
            if (parentNode && parentNode.type === 'array') { delete items.rename; }

            return items;
        }

        let notificationTimeout;
        function showNotification(message, isError = false) {
            const notification = $('#notification');
            notification.text(message).removeClass('error').show();
            if(isError) notification.addClass('error');
            clearTimeout(notificationTimeout);
            notificationTimeout = setTimeout(() => notification.fadeOut(), 4000);
        }
        const textValue = (val) => JSON.stringify(val);
        let nodeIdCounter = 0;

        function jsonToTreeData(obj, key = 'root') {
            const node = { id: key === 'root' ? 'root' : `node_${nodeIdCounter++}`, text: String(key), data: { key: key } };
            if (Array.isArray(obj)) {
                node.type = 'array';
                node.children = obj.map((item, index) => jsonToTreeData(item, index));
            } else if (typeof obj === 'object' && obj !== null) {
                node.type = 'object';
                node.children = Object.keys(obj).map(k => jsonToTreeData(obj[k], k));
            } else {
                node.type = 'value';
                node.data.value = obj;
                node.text = `${key}: ${textValue(obj)}`;
            }
            return node;
        }

        function treeDataToJson(startNodeId = '#') {
            const tree = $('#tree-viewer').jstree(true);
            const rootContainerNode = tree.get_node(startNodeId);

            if (!rootContainerNode || !rootContainerNode.children || rootContainerNode.children.length === 0) {
                throw new Error("Дерево пустое или не было разобрано. Нечего собирать.");
            }

            const rootNodeId = rootContainerNode.children[0];

            function build(currentId) {
                const node = tree.get_node(currentId);
                if (!node) {
                    throw new Error(`Структура дерева нарушена: узел '${currentId}' не найден.`);
                }

                if (!node.data) {
                    throw new Error(`Узел с текстом "${node.text}" не имеет метаданных. Возможно, он был создан, но не переименован.`);
                }

                if (node.type === 'array') {
                    return node.children.map(childId => build(childId));
                }
                if (node.type === 'object') {
                    const obj = {};
                    const keys = new Set();
                    for (const childId of node.children) {
                        const childNode = tree.get_node(childId);
                        if (!childNode || !childNode.data) { continue; }
                        const key = childNode.data.key;
                        if (key === undefined || key === null) {
                            throw new Error(`Узел с текстом "${childNode.text}" имеет неопределенный ключ.`);
                        }
                        if (keys.has(key)) {
                            throw new Error(`Обнаружен дубликат ключа "${key}" в объекте "${node.data.key || 'root'}"`);
                        }
                        keys.add(key);
                        obj[key] = build(childId);
                    }
                    return obj;
                }
                return node.data.value;
            }
            return build(rootNodeId);
        }

        function createChildNode(parentNode, type) {
            const tree = $('#tree-viewer').jstree(true);
            let newNode;
            if (type === 'value') { newNode = { type: 'value', text: 'newKey: "новое значение"', data: { key: 'newKey', value: "новое значение" } }; }
            else if (type === 'object') { newNode = { type: 'object', text: 'newObject', data: { key: 'newObject' }, children: [{ type: 'value', text: 'новоеСвойство: "значение"', data: { key: 'новоеСвойство', value: "значение" } }]}; }
            else if (type === 'array') { newNode = { type: 'array', text: 'newArray', data: { key: 'newArray' }, children: [{ type: 'value', text: '0: "элемент1"', data: { key: 0, value: "элемент1" } }, { type: 'value', text: '1: "элемент2"', data: { key: 1, value: "элемент2" } }]}; }
            tree.create_node(parentNode, newNode, 'last');
        }

        function onNodeChange(e, data) {
            const node = data.node;
            const text = data.text;
            if(!node.data) node.data = {};
            if (node.type === 'value') {
                const parts = text.split(/:(.*)/s);
                const newKey = parts[0].trim();
                const newValueStr = (parts.length > 1 ? parts[1] : '').trim();
                try {
                    node.data.key = newKey;
                    node.data.value = JSON.parse(newValueStr);
                } catch (err) {
                    node.data.key = newKey;
                    node.data.value = newValueStr;
                }
                data.instance.set_text(node, `${node.data.key}: ${textValue(node.data.value)}`);
            } else {
                node.data.key = text;
            }
            updateArrayIndices(data.instance, node.parent);
        }

        function onNodeCopy(e, data) {}

        function updateArrayIndices(tree, parentId){
            const parentNode = tree.get_node(parentId);
            if (parentNode && parentNode.type === 'array') {
                parentNode.children.forEach((childId, index) => {
                    const childNode = tree.get_node(childId);
                    if(childNode && childNode.data) {
                        childNode.data.key = index;
                        const newText = (childNode.type === 'value') ? `${index}: ${textValue(childNode.data.value)}` : `${index}`;
                        tree.set_text(childId, newText);
                    }
                });
            }
        }

        $('#btn-beautify').on('click', function() {
            const text = $('#json-editor').val(); const format = $('#format-select').val();
            if (!text.trim()) { return; }
            $.ajax({
                url: "/api/parse",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({ text: text, format: format }),
                success: (jsonData) => {
                    nodeIdCounter = 0;
                    let treeData;
                    if (typeof jsonData === 'object' && jsonData !== null) {
                        treeData = jsonToTreeData(jsonData, 'root');
                    } else {
                        // Обработка случая, если пришел не объект (например, просто число или строка)
                        treeData = { id: 'root', text: 'root', type: 'object', children: [ jsonToTreeData(jsonData, 'value') ]};
                    }
                    $('#tree-viewer').jstree(true).settings.core.data = [treeData];
                    $('#tree-viewer').jstree(true).refresh(true);
                    showNotification("Данные разобраны в дерево.");
                },
                error: (xhr) => showNotification(`Ошибка разбора: ${JSON.parse(xhr.responseText).message}`, true)
            });
        });

        const combinedButtonHandler = function(e){
            const btnId = e.currentTarget.id;
            try {
                const jsonData = treeDataToJson();
                $.ajax({
                    url: `/api/serialize?format=json&pretty=true`,
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(jsonData),
                    success: (content) => {
                        if (btnId === 'btn-to-text') {
                            $('#json-editor').val(content);
                            showNotification("Дерево собрано в текст.");
                        } else if (btnId === 'btn-save-doc') {
                            const name = $('#save-name-input').val().trim();
                            if (!name) { showNotification("Введите имя для сохранения.", true); return; }
                            $.ajax({
                                url: "/api/documents", type: 'POST',
                                contentType: 'application/json', data: JSON.stringify({ name: name, content: content }),
                                success: () => { showNotification("Документ сохранен."); loadDocList(); },
                                error: () => showNotification("Ошибка сохранения на сервере.", true)
                            });
                        }
                    },
                    error: (xhr) => showNotification(`Ошибка сериализации: ${xhr.responseText}`, true)
                });
            } catch(err) {
                console.error("Детальная ошибка сборки:", err);
                showNotification(err.message, true);
            }
        }

        $('#btn-to-text, #btn-save-doc').on('click', combinedButtonHandler);

        $('#btn-fetch-url').on('click', function() {
            const url = $('#url-input').val(); if (!url) return;
            $.ajax({
                url: "/api/fetch-url",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({ url: url }),
                success: (data) => {
                    $('#json-editor').val(data);
                    $('#format-select').val(data.trim().startsWith('<') ? 'xml' : 'json');
                    $('#btn-beautify').trigger('click');
                },
                error: (xhr) => showNotification(`Ошибка загрузки: ${JSON.parse(xhr.responseText).message}`, true)
            });
        });

        function loadDocList() {
            $.get("/api/documents", (docs) => {
                const select = $("#doc-select").empty();
                select.append($('<option>', { value: '', text: 'Выберите документ...' }));
                docs.forEach(doc => select.append($('<option>', { value: doc.id, text: doc.name })));
            });
        }

        $('#btn-load-doc').on('click', function() {
            const docId = $("#doc-select").val(); if (!docId) return;
            const docName = $("#doc-select option:selected").text();
            $.get(`/api/documents/${docId}`, (content) => {
                $('#json-editor').val(content);
                $('#save-name-input').val(docName);
                $('#format-select').val(content.trim().startsWith('<') ? 'xml' : 'json');
                $('#btn-beautify').trigger('click');
            });
        });

        $('#btn-delete-doc').on('click', function() {
            const docId = $("#doc-select").val(); if (!docId) return;
            if (confirm("Вы уверены, что хотите удалить этот документ?")) {
                $.ajax({ url: `/api/documents/${docId}`, type: 'DELETE', success: () => { showNotification("Документ удален."); loadDocList(); } });
            }
        });

        $('#json-editor').val(`{
    "userId": { "type": "increment", "start": 1001, "step": 1 },
    "userName": { "type": "random", "values": [ "Alice", "Bob", "Charlie", "Елена" ] },
    "описание": "Пример с кириллицей"
}`);
        $('#url-input').val('https://api.coindesk.com/v1/bpi/currentprice.json');

        loadDocList();
    });
</script>

</body>
</html>
