<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Справочники таблиц</title>
    <!-- Библиотеки -->
    <script src="libs/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: #f4f7f9;
            margin: 0; padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px; flex-shrink: 0;
        }

        /* Две колонки во всю высоту */
        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Поровну */
            gap: 20px;
            height: 100%;
            overflow: hidden;
        }

        .panel {
            background: #fff; border: 1px solid #e2e8f0;
            border-radius: 6px; display: flex; flex-direction: column;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03); overflow: hidden;
            height: 100%;
        }

        .panel-head {
            padding: 12px 15px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;
            font-weight: 600; color: #334155; display: flex; justify-content: space-between; align-items: center;
        }

        .panel-body {
            padding: 15px; overflow-y: auto; flex: 1; background-color: #fff;
        }

        /* Элементы списка */
        .list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 10px; border-bottom: 1px solid #f1f5f9; font-size: 13px;
        }
        .list-item:hover { background: #f8fafc; }

        .badge {
            padding: 2px 6px; border-radius: 4px; font-size: 10px;
            color: white; font-weight: bold; margin-left: 8px;
        }

        .input-row {
            display: flex; gap: 8px; margin-bottom: 15px;
            padding-bottom: 15px; border-bottom: 1px dashed #e2e8f0;
        }
        .input-row input, .input-row select {
            padding: 7px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px;
        }

        .btn-rem {
            color: #ef4444; border: none; background: none; font-size: 18px; cursor: pointer;
        }
        .btn-rem:hover { color: #dc2626; }
    </style>
</head>
<body>

<div class="top-bar">
    <button onclick="window.location.href='index.html'" class="secondary">🏠 Домой</button>
    <h2 style="margin:0;">Справочники Данных (Окружения и Системы)</h2>
</div>

<div class="workspace-grid">

    <!-- 1. ОКРУЖЕНИЯ -->
    <div class="panel">
        <div class="panel-head">
            <span>🌍 Справочник Окружений (Hosts)</span>
            <button onclick="saveSettings()" class="success" style="font-size:12px;">💾 Сохранить список</button>
        </div>
        <div class="panel-body">
            <div style="margin-bottom:10px; color:#666; font-size:11px;">
                Используется для подсветки PROD/TEST в истории вызовов.
            </div>
            <div class="input-row">
                <input id="in_host" placeholder="Хост (напр. brmq-dev1)" style="flex: 2;">
                <select id="in_env" style="width: 100px;">
                    <option value="DEV">DEV</option>
                    <option value="TEST">TEST</option>
                    <option value="PROD">PROD</option>
                    <option value="UAT">UAT</option>
                </select>
                <button onclick="addEnv()" class="primary" style="padding: 0 20px;">+</button>
            </div>
            <div id="env_list">Загрузка...</div>
        </div>
    </div>

    <!-- 2. СИСТЕМЫ -->
    <div class="panel">
        <div class="panel-head">
            <span>🖥️ Справочник Систем (BS)</span>
        </div>
        <div class="panel-body">
            <div style="margin-bottom:10px; color:#666; font-size:11px;">
                Используется в выпадающих списках конструктора потоков.
            </div>
            <div class="input-row">
                <input id="in_sid" placeholder="ID (напр. BS_CRM)" style="flex: 1; font-weight: bold;">
                <input id="in_desc" placeholder="Полное описание системы" style="flex: 2;">
                <button onclick="addSys()" class="primary">Добавить</button>
            </div>
            <div id="sys_list">Загрузка...</div>
        </div>
    </div>

</div>

<script>
    // DATA
    let DATA_ENV = [];
    let DATA_SYS = [];

    $(function(){
        loadData();
    });

    function loadData() {
        // Загрузка настроек (Среды)
        $.get('/api/tasks/settings', function(d) {
            try { DATA_ENV = JSON.parse(d.env_dictionary || '[]'); } catch(e){ DATA_ENV=[]; }
            renderEnv();
        });

        // Загрузка Систем
        $.get('/api/systems', function(d) {
            DATA_SYS = d || [];
            renderSys();
        });
    }

    // --- ENVS ---
    function renderEnv() {
        const c = $('#env_list').empty();
        DATA_ENV.forEach((item, i) => {
            let bg = item.type === 'PROD' ? '#16a34a' : (item.type === 'TEST' ? '#f59e0b' : '#64748b');
            c.append(`
                <div class="list-item">
                    <span>${escapeHtml(item.host)} <span class="badge" style="background:${bg}">${item.type}</span></span>
                    <button class="btn-rem" onclick="deleteEnv(${i})">&times;</button>
                </div>
            `);
        });
    }

    window.addEnv = function() {
        const h = $('#in_host').val().trim();
        if(h) {
            DATA_ENV.push({host:h, type:$('#in_env').val()});
            renderEnv();
            $('#in_host').val('');
        }
    }
    window.deleteEnv = (i) => { DATA_ENV.splice(i,1); renderEnv(); };

    window.saveSettings = function() {
        $.ajax({
            url:'/api/tasks/settings', type:'POST', contentType:'application/json',
            data:JSON.stringify({ env_dictionary: JSON.stringify(DATA_ENV) }),
            success: ()=>alert('Окружения сохранены!'),
            error: (x)=>alert('Ошибка: '+x.responseText)
        });
    }

    // --- SYSTEMS ---
    function renderSys() {
        const c = $('#sys_list').empty();
        DATA_SYS.forEach(s => {
            c.append(`
                <div class="list-item">
                    <div><b>${escapeHtml(s.sid)}</b> <span style="color:#999; margin-left:10px;">${escapeHtml(s.description||'')}</span></div>
                    <button class="btn-rem" onclick="deleteSys(${s.id})">&times;</button>
                </div>
            `);
        });
    }

    window.addSys = function() {
        const sid = $('#in_sid').val().trim();
        const desc = $('#in_desc').val().trim();
        if(!sid) return;
        $.ajax({
            url: '/api/systems', type:'POST', contentType:'application/json',
            data:JSON.stringify({ sid:sid, description:desc }),
            success: ()=>{
                $.get('/api/systems', d=>{ DATA_SYS=d||[]; renderSys(); $('#in_sid').val(''); $('#in_desc').val('');});
            }
        });
    }

    window.deleteSys = function(id) {
        if(confirm('Удалить систему?')) $.ajax({ url:'/api/systems', type:'DELETE', contentType:'application/json', data:JSON.stringify({id}), success:() => {
                DATA_SYS = DATA_SYS.filter(x => x.id !== id); renderSys();
            }});
    }

    function escapeHtml(text) { return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
</script>
</body>
</html>
