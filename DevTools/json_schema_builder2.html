<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-i18n="jsb2_page_title">JSON Schema Builder IDE (Deep Merge, Tabs, D&D)</title>

    <!-- Подключаем jQuery и нашу утилиту локализации перед React -->
    <script src="libs/jquery-3.6.0.min.js"></script>
    <script src="utils.js"></script>
    <link rel="stylesheet" href="style.css">

    <!-- Только локальные библиотеки! -->
    <script src="libs/tailwindcss.com_3.4.17"></script>
    <script crossorigin src="libs/react.development.js"></script>
    <script crossorigin src="libs/react-dom.development.js"></script>
    <script src="libs/babel.min.js"></script>
    <script src="libs/loader.min.js"></script>

    <style>
        /* === БРОНЕБОЙНАЯ ИЗОЛЯЦИЯ ОТ style.css === */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            background-color: #0f172a !important;
            color: #f8fafc !important;
            overflow: hidden !important;
            font-family: 'Inter', sans-serif !important;
            height: 100vh !important;
            display: block !important;
        }

        #root {
            height: 100vh !important;
            display: flex !important;
            flex-direction: column !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Вкладки */
        .tabs-container { display: flex; background: #0b1120; border-bottom: 1px solid #1e293b; overflow-x: auto; }
        .tab { padding: 8px 16px; font-size: 13px; color: #94a3b8; border-right: 1px solid #1e293b; display: flex; align-items: center; gap: 8px; cursor: pointer; border-bottom: 2px solid transparent; user-select: none; }
        .tab:hover { background: #1e293b; color: #f8fafc; }
        .tab.active { background: #0f172a; color: #60a5fa; border-bottom-color: #3b82f6; }
        .tab-close { opacity: 0.5; padding: 2px; border-radius: 4px; transition: 0.2s; }
        .tab-close:hover { opacity: 1; background: #ef4444; color: white; }

        .split-pane { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 500px; background-color: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .tree-container { flex: 1; overflow-y: auto; padding: 10px; scroll-behavior: smooth; }
        .properties-panel { height: 440px; background-color: #0f172a; border-top: 1px solid #334155; padding: 15px; overflow-y: auto; flex-shrink: 0; }
        .editor-container { flex: 1; position: relative; }

        /* Стили кастомного дерева и D&D */
        .tree-node { display: flex; align-items: center; padding: 4px 8px; cursor: pointer; border-radius: 4px; user-select: none; border: 1px solid transparent; transition: background 0.2s, border-color 0.2s; }
        .tree-node:hover { background-color: #334155; }
        .tree-node.selected { background-color: #1e40af; border-color: #3b82f6; color: white; }

        /* Цвета D&D */
        .tree-node.drag-over { background-color: #047857 !important; border-color: #10b981 !important; }
        .tree-node.drag-over-sibling { border-top: 3px solid #f59e0b !important; border-radius: 0 !important; background-color: #334155; }

        .tree-children { margin-left: 20px; border-left: 1px dashed #475569; padding-top: 2px; padding-bottom: 2px; }
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 999px; font-family: monospace; margin-left: 8px; }
        .highlight { background-color: #fde047; color: #854d0e; border-radius: 2px; padding: 0 2px; }

        /* Скроллбары */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module">
    const { useState, useEffect, useRef, useMemo, createContext, useContext, useCallback } = React;

    // Глобальная функция перевода из utils.js
    const t = window.t;

    // Добавлена пустая строка для выбора "Без типа"
    const JSON_TYPES = ['', 'object', 'array', 'string', 'number', 'integer', 'boolean'];
    const KNOWN_KEYS = ['type', 'properties', 'items', 'required', 'description', 'title', 'additionalProperties'];

    const uid = () => Math.random().toString(36).substr(2, 9);

    // --- 1. REACT CONTEXT (TABS & HISTORY) ---
    const SchemaContext = createContext();

    const createEmptyTab = (title) => {
        const rId = 'root_' + uid();
        return {
            id: 'tab_' + uid(),
            title: title,
            nodes: {
                [rId]: { id: rId, parentId: null, name: 'Root', type: 'object', primitiveType: 'string', isRequired: true, description: '', title: 'Root', additionalProperties: false, extraProps: {}, isExpanded: true, order: 0 }
            },
            selectedNodeId: rId,
            past: [],
            future: []
        };
    };

    const SchemaProvider = ({ children }) => {
        const [tabs, setTabs] = useState([createEmptyTab(t('jsb2_schema', 'Схема') + ' 1')]);
        const [activeTabId, setActiveTabId] = useState(tabs[0].id);
        const [treeSearchTerm, setTreeSearchTerm] = useState('');
        const [showInlineStats, setShowInlineStats] = useState(false);

        const activeTab = tabs.find(t => t.id === activeTabId) || tabs[0];

        const commitChange = useCallback((tabId, newNodes, newSelectedId = null) => {
            setTabs(prev => prev.map(tab => {
                if (tab.id !== tabId) return tab;
                const pastState = { nodes: tab.nodes, selectedId: tab.selectedNodeId };
                const past = [...tab.past, pastState].slice(-50);
                return {
                    ...tab,
                    nodes: newNodes,
                    selectedNodeId: newSelectedId || tab.selectedNodeId,
                    past: past,
                    future: []
                };
            }));
        }, []);

        useEffect(() => {
            const handleKeyDown = (e) => {
                if (e.key === 'Control' || e.key === 'Meta') setShowInlineStats(true);
                if (e.ctrlKey || e.metaKey) {
                    if (e.key === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
                    if (e.key === 'y') { e.preventDefault(); redo(); }
                }
            };
            const handleKeyUp = (e) => {
                if (e.key === 'Control' || e.key === 'Meta') setShowInlineStats(false);
            };
            const handleBlur = () => setShowInlineStats(false);

            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            window.addEventListener('blur', handleBlur);
            return () => {
                window.removeEventListener('keydown', handleKeyDown);
                window.removeEventListener('keyup', handleKeyUp);
                window.removeEventListener('blur', handleBlur);
            };
        }, [activeTabId, tabs]);

        const undo = () => {
            setTabs(prev => prev.map(tab => {
                if (tab.id !== activeTabId || tab.past.length === 0) return tab;
                const prevHistory = tab.past[tab.past.length - 1];
                const newPast = tab.past.slice(0, -1);
                const newFuture = [{ nodes: tab.nodes, selectedId: tab.selectedNodeId }, ...tab.future];
                return { ...tab, nodes: prevHistory.nodes, selectedNodeId: prevHistory.selectedId, past: newPast, future: newFuture };
            }));
        };

        const redo = () => {
            setTabs(prev => prev.map(tab => {
                if (tab.id !== activeTabId || tab.future.length === 0) return tab;
                const nextHistory = tab.future[0];
                const newFuture = tab.future.slice(1);
                const newPast = [...tab.past, { nodes: tab.nodes, selectedId: tab.selectedNodeId }];
                return { ...tab, nodes: nextHistory.nodes, selectedNodeId: nextHistory.selectedId, past: newPast, future: newFuture };
            }));
        };

        const actions = useMemo(() => ({
            addTab: () => {
                const newTab = createEmptyTab(t('jsb2_schema', 'Схема') + ` ${tabs.length + 1}`);
                setTabs(prev => [...prev, newTab]);
                setActiveTabId(newTab.id);
            },
            closeTab: (e, tabId) => {
                e.stopPropagation();
                if (tabs.length === 1) return;
                const newTabs = tabs.filter(t => t.id !== tabId);
                setTabs(newTabs);
                if (activeTabId === tabId) setActiveTabId(newTabs[0].id);
            },
            setActiveTabId,
            setSearchTerm: setTreeSearchTerm,
            selectNode: (id) => setTabs(prev => prev.map(t => t.id === activeTabId ? { ...t, selectedNodeId: id } : t)),

            toggleExpand: (id, forceState = null) => {
                setTabs(prev => prev.map(t => {
                    if (t.id !== activeTabId) return t;
                    return { ...t, nodes: { ...t.nodes, [id]: { ...t.nodes[id], isExpanded: forceState !== null ? forceState : !t.nodes[id].isExpanded } } };
                }));
            },

            expandParents: (nodeId) => {
                setTabs(prev => prev.map(t => {
                    if (t.id !== activeTabId) return t;
                    let newNodes = { ...t.nodes };
                    let current = newNodes[nodeId];
                    let changed = false;
                    while (current && current.parentId) {
                        let parent = newNodes[current.parentId];
                        if (!parent.isExpanded) {
                            newNodes[current.parentId] = { ...parent, isExpanded: true };
                            changed = true;
                        }
                        current = newNodes[current.parentId];
                    }
                    return changed ? { ...t, nodes: newNodes } : t;
                }));
            },

            updateNode: (id, updates, saveHistory = false) => {
                const newNodes = { ...activeTab.nodes, [id]: { ...activeTab.nodes[id], ...updates } };
                if (saveHistory) commitChange(activeTab.id, newNodes);
                else setTabs(prev => prev.map(t => t.id === activeTabId ? { ...t, nodes: newNodes } : t));
            },

            addNode: (parentId, name, type = 'string') => {
                const id = 'node_' + uid();
                const children = Object.values(activeTab.nodes).filter(n => n.parentId === parentId);
                const maxOrder = children.length > 0 ? Math.max(...children.map(n => n.order || 0)) : 0;

                const newNodes = {
                    ...activeTab.nodes,
                    [parentId]: { ...activeTab.nodes[parentId], isExpanded: true },
                    [id]: { id, parentId, name, type, primitiveType: 'string', isRequired: false, description: '', title: '', additionalProperties: false, extraProps: {}, isExpanded: true, order: maxOrder + 1 }
                };
                commitChange(activeTab.id, newNodes, id);
                return id;
            },

            removeNode: (id) => {
                const newNodes = { ...activeTab.nodes };
                const deleteRecursive = (nodeId) => {
                    Object.values(newNodes).filter(n => n.parentId === nodeId).forEach(n => deleteRecursive(n.id));
                    delete newNodes[nodeId];
                };
                deleteRecursive(id);
                commitChange(activeTab.id, newNodes, activeTab.nodes[id].parentId);
            },

            removeNodeKeepChildren: (id) => {
                const newNodes = { ...activeTab.nodes };
                const nodeToDelete = newNodes[id];

                // Нельзя удалить корень
                if (!nodeToDelete || nodeToDelete.parentId === null) return;

                const parentId = nodeToDelete.parentId;
                const children = Object.values(newNodes).filter(n => n.parentId === id);

                // Находим максимальный порядок у текущих детей родителя
                const parentChildren = Object.values(newNodes).filter(n => n.parentId === parentId && n.id !== id);
                let maxOrder = parentChildren.length > 0 ? Math.max(...parentChildren.map(n => n.order || 0)) : 0;

                // Перепривязываем детей к родителю
                children.forEach(child => {
                    newNodes[child.id] = { ...child, parentId: parentId, order: ++maxOrder };
                });

                // Удаляем сам узел
                delete newNodes[id];

                // Если у родителя не было типа object или array, но появились дети, делаем его object
                if (children.length > 0 && newNodes[parentId].type !== 'object' && newNodes[parentId].type !== 'array') {
                    newNodes[parentId] = { ...newNodes[parentId], type: 'object' };
                }
                newNodes[parentId] = { ...newNodes[parentId], isExpanded: true };

                commitChange(activeTab.id, newNodes, parentId);
            },

            moveNode: (dragId, targetId, asSibling = false) => {
                if (dragId === targetId) return;

                let current = activeTab.nodes[targetId];
                while (current) {
                    if (current.id === dragId) return;
                    current = activeTab.nodes[current.parentId];
                }

                const newNodes = { ...activeTab.nodes };

                if (asSibling) {
                    const targetNode = newNodes[targetId];
                    const newParentId = targetNode.parentId;
                    if (newParentId === null) return;

                    newNodes[dragId] = { ...newNodes[dragId], parentId: newParentId };

                    let siblings = Object.values(newNodes)
                        .filter(n => n.parentId === newParentId)
                        .sort((a, b) => (a.order || 0) - (b.order || 0));

                    siblings = siblings.filter(n => n.id !== dragId);

                    const targetIndex = siblings.findIndex(n => n.id === targetId);
                    if (targetIndex !== -1) {
                        siblings.splice(targetIndex, 0, newNodes[dragId]);
                    } else {
                        siblings.push(newNodes[dragId]);
                    }

                    siblings.forEach((node, index) => {
                        newNodes[node.id] = { ...newNodes[node.id], order: index };
                    });

                } else {
                    newNodes[dragId] = { ...newNodes[dragId], parentId: targetId };
                    if (newNodes[targetId].type !== 'object' && newNodes[targetId].type !== 'array') {
                        newNodes[targetId] = { ...newNodes[targetId], type: 'object' };
                    }
                    newNodes[targetId].isExpanded = true;

                    const targetChildren = Object.values(newNodes).filter(n => n.parentId === targetId);
                    const maxOrder = targetChildren.length > 0 ? Math.max(...targetChildren.map(n => n.order || 0)) : 0;
                    newNodes[dragId].order = maxOrder + 1;
                }

                commitChange(activeTab.id, newNodes);
            },

            importSchema: (newNodesMap) => {
                commitChange(activeTab.id, newNodesMap, Object.keys(newNodesMap)[0]);
            },

            mergeNodesToBranch: (newNodesMap, targetParentId) => {
                const newNodes = { ...activeTab.nodes };
                const newRoots = Object.values(newNodesMap).filter(n => n.parentId === null);
                newRoots.forEach(root => { newNodesMap[root.id].parentId = targetParentId; });
                Object.assign(newNodes, newNodesMap);
                newNodes[targetParentId].isExpanded = true;
                if (newNodes[targetParentId].type !== 'object' && newNodes[targetParentId].type !== 'array') {
                    newNodes[targetParentId].type = 'object';
                }
                commitChange(activeTab.id, newNodes);
            }
        }), [activeTab, tabs, activeTabId, commitChange]);

        const store = {
            tabs, activeTab, treeSearchTerm, showInlineStats, undo, redo, ...actions,
            getChildren: (parentId) => Object.values(activeTab.nodes)
                .filter(n => n.parentId === parentId)
                .sort((a, b) => (a.order || 0) - (b.order || 0))
        };

        return <SchemaContext.Provider value={store}>{children}</SchemaContext.Provider>;
    };

    const useSchemaStore = () => useContext(SchemaContext);

    // --- 2. ADVANCED DEEP MERGE ALGORITHM (JSON INFERENCE) ---
    class JsonInferer {
        constructor() { this.nodes = {}; this.orderCounter = 0; }

        inferType(value) {
            if (typeof value === 'boolean') return 'boolean';
            if (typeof value === 'number') return Number.isInteger(value) ? 'integer' : 'number';
            if (typeof value === 'string') return 'string';
            if (Array.isArray(value)) return 'array';
            if (typeof value === 'object' && value !== null) return 'object';
            return 'string';
        }

        _addNode(parentId, name, type, isRequired = false, primitiveType = 'string') {
            const id = 'n_' + uid();
            this.nodes[id] = { id, parentId, name, type, primitiveType, isRequired, description: '', title: '', additionalProperties: false, extraProps: {}, isExpanded: true, order: this.orderCounter++ };
            return id;
        }

        build(jsonObj, rootName = "Root", mergeMultipleRoot = false) {
            this.nodes = {};
            this.orderCounter = 0;
            if (mergeMultipleRoot && Array.isArray(jsonObj)) {
                const rootId = this._addNode(null, rootName, 'object', true);
                this._traverseMultiple(jsonObj, rootId);
            } else {
                const rootType = this.inferType(jsonObj);
                const rootId = this._addNode(null, rootName, rootType, true);

                if (rootType === 'object') {
                    this._traverseMultiple([jsonObj], rootId);
                } else if (rootType === 'array') {
                    this._traverseArrayMultiple(jsonObj, rootId);
                }
            }
            return this.nodes;
        }

        _traverseMultiple(objList, parentId) {
            const keyToValues = {};
            let objectCount = 0;

            objList.forEach(obj => {
                if (typeof obj === 'object' && obj !== null && !Array.isArray(obj)) {
                    objectCount++;
                    Object.keys(obj).forEach(key => {
                        if (!keyToValues[key]) keyToValues[key] = [];
                        keyToValues[key].push(obj[key]);
                    });
                }
            });

            for (const [key, values] of Object.entries(keyToValues)) {
                const isRequired = values.length === objectCount;
                const firstNonNull = values.find(v => v !== null && v !== undefined);
                const type = firstNonNull !== undefined ? this.inferType(firstNonNull) : 'string';

                const nodeId = this._addNode(parentId, key, type, isRequired);

                if (type === 'object') {
                    this._traverseMultiple(values, nodeId);
                } else if (type === 'array') {
                    let allItems = [];
                    values.forEach(v => { if (Array.isArray(v)) allItems.push(...v); });
                    this._traverseArrayMultiple(allItems, nodeId);
                }
            }
        }

        _traverseArrayMultiple(arr, parentNodeId) {
            if (arr.length === 0) {
                this.nodes[parentNodeId].primitiveType = 'string';
            } else {
                const objectItems = arr.filter(item => typeof item === 'object' && item !== null && !Array.isArray(item));
                if (objectItems.length > 0) {
                    this._traverseMultiple(objectItems, parentNodeId);
                } else {
                    const firstNonNull = arr.find(item => item !== null && item !== undefined);
                    this.nodes[parentNodeId].primitiveType = firstNonNull !== undefined ? this.inferType(firstNonNull) : 'string';
                }
            }
        }
    }

    // --- НОВЫЙ ИМПОРТЕР ДЛЯ ГОТОВОЙ JSON SCHEMA (С ЗАЩИТОЙ EXTRA PROPS) ---
    class JsonSchemaImporter {
        constructor() { this.nodes = {}; this.orderCounter = 0; }

        _addNode(parentId, name, type, isRequired = false, primitiveType = 'string', description = '', title = '', additionalProperties = false, extraProps = {}) {
            const id = 'n_' + uid();
            this.nodes[id] = { id, parentId, name, type, primitiveType, isRequired, description, title, additionalProperties, extraProps, isExpanded: true, order: this.orderCounter++ };
            return id;
        }

        build(schemaObj, rootName = "Root") {
            this.nodes = {};
            this.orderCounter = 0;
            this._traverseSchema(schemaObj, null, rootName, true);
            return this.nodes;
        }

        _traverseSchema(schemaNode, parentId, name, isRequired) {
            let extraProps = {};
            for (let k in schemaNode) {
                if (!KNOWN_KEYS.includes(k) && k !== '$schema') {
                    extraProps[k] = schemaNode[k];
                }
            }

            let type = schemaNode.type || '';
            if (!type) {
                if (schemaNode.properties) type = 'object';
                else if (schemaNode.items) type = 'array';
            }

            let primitiveType = 'string';
            if (type === 'array' && schemaNode.items && schemaNode.items.type !== 'object') {
                primitiveType = schemaNode.items.type || 'string';
            }

            const title = schemaNode.title || '';
            const addProps = schemaNode.additionalProperties !== undefined ? schemaNode.additionalProperties : false;

            const nodeId = this._addNode(parentId, name, type, isRequired, primitiveType, schemaNode.description || '', title, addProps, extraProps);

            if (type === 'object' && schemaNode.properties) {
                const reqList = schemaNode.required || [];
                Object.keys(schemaNode.properties).forEach(key => {
                    this._traverseSchema(schemaNode.properties[key], nodeId, key, reqList.includes(key));
                });
            } else if (type === 'array' && schemaNode.items && schemaNode.items.type === 'object' && schemaNode.items.properties) {
                const reqList = schemaNode.items.required || [];
                Object.keys(schemaNode.items.properties).forEach(key => {
                    this._traverseSchema(schemaNode.items.properties[key], nodeId, key, reqList.includes(key));
                });
            }
        }
    }

    // --- 3. JSON SCHEMA GENERATOR ---
    class JsonSchemaGenerator {
        static generate(nodes, rootId = null) {
            if (!rootId) {
                const rootNode = Object.values(nodes).find(n => n.parentId === null);
                if (!rootNode) return '{}';
                rootId = rootNode.id;
            }
            const buildNode = (nodeId) => {
                const node = nodes[nodeId];
                if (!node) return {};

                let schema = { ...node.extraProps };

                if (node.type) schema.type = node.type;
                if (node.title) schema.title = node.title;
                if (node.description) schema.description = node.description;

                const children = Object.values(nodes)
                    .filter(n => n.parentId === nodeId)
                    .sort((a, b) => (a.order || 0) - (b.order || 0));

                if (node.type === 'object') {
                    schema.properties = {}; const required = [];
                    children.forEach(c => { schema.properties[c.name] = buildNode(c.id); if (c.isRequired) required.push(c.name); });
                    if (required.length > 0) schema.required = required;

                    if (node.additionalProperties !== undefined) schema.additionalProperties = node.additionalProperties;
                } else if (node.type === 'array') {
                    if (children.length > 0) {
                        schema.items = { type: 'object', properties: {} }; const req = [];
                        children.forEach(c => { schema.items.properties[c.name] = buildNode(c.id); if (c.isRequired) req.push(c.name); });
                        if (req.length > 0) schema.items.required = req;
                        schema.items.additionalProperties = false;
                    } else schema.items = { type: node.primitiveType || 'string' };
                }
                return schema;
            };

            const fullSchema = { $schema: "http://json-schema.org/draft-07/schema#", ...buildNode(rootId) };
            if(!fullSchema.title) fullSchema.title = "GeneratedSchema";
            return JSON.stringify(fullSchema, null, 2);
        }
    }

    // --- 4. REACT COMPONENTS ---
    const Icons = {
        object: (title) => <span title={title} className="text-amber-400 mr-2 font-mono font-bold cursor-help">{`{}`}</span>,
        array: (title) => <span title={title} className="text-emerald-400 mr-2 font-mono font-bold cursor-help">{`[]`}</span>,
        string: (title) => <span title={title} className="text-blue-400 mr-2 font-mono font-bold cursor-help">"_"</span>,
        number: (title) => <span title={title} className="text-purple-400 mr-2 font-mono font-bold cursor-help">12</span>,
        integer: (title) => <span title={title} className="text-purple-400 mr-2 font-mono font-bold cursor-help">12</span>,
        boolean: (title) => <span title={title} className="text-rose-400 mr-2 font-mono font-bold cursor-help">t/f</span>
    };

    const Highlighter = ({ text, highlight }) => {
        if (!highlight) return <span>{text}</span>;
        const parts = text.split(new RegExp(`(${highlight})`, 'gi'));
        return <span>{parts.map((part, i) => part.toLowerCase() === highlight.toLowerCase() ? <span key={i} className="highlight">{part}</span> : part)}</span>;
    };

    const TreeNode = ({ id, level = 0 }) => {
        const { activeTab, treeSearchTerm, getChildren, selectNode, toggleExpand, moveNode, showInlineStats } = useSchemaStore();
        const [isDragOver, setIsDragOver] = useState(false);
        const [isDragOverSibling, setIsDragOverSibling] = useState(false);

        const node = activeTab.nodes[id];
        const children = getChildren(id);
        const isSelected = activeTab.selectedNodeId === id;

        if (!node) return null;

        const isMatch = treeSearchTerm && node.name.toLowerCase().includes(treeSearchTerm.toLowerCase());
        const shouldExpand = node.isExpanded || (treeSearchTerm && children.length > 0);

        let statsString = `Тип: ${node.type || 'mixed'}\nОбязательно: ${node.isRequired ? 'Да' : 'Нет'}`;
        let inlineStatNode = null;

        if (node.type === 'object') {
            const reqCount = children.filter(c => c.isRequired).length;
            statsString = `[Объект]\nВсего полей: ${children.length}\nОбязательных: ${reqCount}\nОпциональных: ${children.length - reqCount}`;
            if (showInlineStats) inlineStatNode = <span className="ml-3 text-[10px] font-mono text-amber-300/90 bg-amber-900/40 px-1.5 py-0.5 rounded border border-amber-700/60 pointer-events-none transition-opacity">Полей: {children.length} (Обяз: {reqCount})</span>;
        } else if (node.type === 'array') {
            if (children.length > 0) {
                const typeCounts = children.reduce((acc, c) => { acc[c.type || 'mixed'] = (acc[c.type || 'mixed'] || 0) + 1; return acc; }, {});
                const typesDetail = Object.entries(typeCounts).map(([typeN, cnt]) => `${typeN}: ${cnt}`).join('\n- ');
                const typesInline = Object.entries(typeCounts).map(([typeN, cnt]) => `${typeN}: ${cnt}`).join(', ');
                statsString = `[Массив]\nВложенных полей: ${children.length}\nСтруктура:\n- ${typesDetail}`;
                if (showInlineStats) inlineStatNode = <span className="ml-3 text-[10px] font-mono text-emerald-300/90 bg-emerald-900/40 px-1.5 py-0.5 rounded border border-emerald-700/60 pointer-events-none transition-opacity">Типы: {typesInline}</span>;
            } else {
                statsString = `[Массив примитивов]\nТип элементов: ${node.primitiveType}`;
                if (showInlineStats) inlineStatNode = <span className="ml-3 text-[10px] font-mono text-emerald-300/90 bg-emerald-900/40 px-1.5 py-0.5 rounded border border-emerald-700/60 pointer-events-none transition-opacity">Элементы: {node.primitiveType}</span>;
            }
        }

        const handleDragStart = (e) => { e.dataTransfer.setData('text/plain', id); e.stopPropagation(); };

        const handleDragOver = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (e.ctrlKey || e.metaKey || e.shiftKey) {
                if (isDragOver) setIsDragOver(false);
                if (!isDragOverSibling) setIsDragOverSibling(true);
            } else {
                if (isDragOverSibling) setIsDragOverSibling(false);
                if (!isDragOver) setIsDragOver(true);
            }
        };

        const handleDragLeave = (e) => {
            e.preventDefault();
            e.stopPropagation();
            setIsDragOver(false);
            setIsDragOverSibling(false);
        };

        const handleDrop = (e) => {
            e.preventDefault();
            e.stopPropagation();
            const asSibling = e.ctrlKey || e.metaKey || e.shiftKey;
            setIsDragOver(false);
            setIsDragOverSibling(false);
            moveNode(e.dataTransfer.getData('text/plain'), id, asSibling);
        };

        let typeDisplay = node.type ? (node.type === 'array' && children.length === 0 ? `array<${node.primitiveType}>` : node.type) : 'mixed';

        return (
            <div>
                <div
                    id={`tree-node-${id}`}
                    className={`tree-node ${isSelected ? 'selected' : ''} ${isDragOver ? 'drag-over' : ''} ${isDragOverSibling ? 'drag-over-sibling' : ''}`}
                    style={{ paddingLeft: `${level * 15 + 10}px` }}
                    onClick={() => selectNode(id)}
                    onDoubleClick={() => toggleExpand(id)}
                    draggable={node.parentId !== null}
                    onDragStart={handleDragStart}
                    onDragOver={handleDragOver}
                    onDragLeave={handleDragLeave}
                    onDrop={handleDrop}
                >
                    {children.length > 0 ? (
                        <span className="mr-1 w-4 text-center cursor-pointer opacity-70" onClick={(e) => { e.stopPropagation(); toggleExpand(id); }}>
                                {shouldExpand ? '▼' : '▶'}
                            </span>
                    ) : <span className="mr-1 w-4"></span>}

                    {Icons[node.type] ? Icons[node.type](statsString) : Icons.string(statsString)}

                    <span className={`font-semibold ${node.isRequired ? '' : 'opacity-75 italic'}`}>
                            <Highlighter text={node.name} highlight={treeSearchTerm} />
                        {!node.isRequired && <span className="text-[10px] text-slate-400 ml-1 font-normal">(opt)</span>}
                        </span>

                    {inlineStatNode}

                    {Object.keys(node.extraProps || {}).length > 0 && (
                        <span className="ml-2 text-[9px] bg-yellow-900/50 text-yellow-300 border border-yellow-700/50 px-1 rounded" title={t('jsb2_hint_props', "Есть дополнительные свойства (JSON)")}>+props</span>
                    )}

                    <span title={statsString} className="badge bg-slate-700 text-blue-300 border border-slate-600 ml-auto cursor-help">
                            {typeDisplay}
                        </span>
                </div>

                {shouldExpand && children.length > 0 && (
                    <div className="tree-children">
                        {children.map(child => <TreeNode key={child.id} id={child.id} level={level + 1} />)}
                    </div>
                )}
            </div>
        );
    };

    const PropertiesPanel = ({ onOpenImportModal, onPasteNodes }) => {
        const { activeTab, updateNode, removeNode, removeNodeKeepChildren, addNode, getChildren } = useSchemaStore();
        const node = activeTab.selectedNodeId ? activeTab.nodes[activeTab.selectedNodeId] : null;

        if (!node) return <div className="text-slate-500 text-center mt-10">{t('jsb2_sel_node', 'Выберите узел для редактирования')}</div>;

        const hasChildren = getChildren(node.id).length > 0;

        const handleAddChild = () => {
            if (node.type !== 'object' && node.type !== 'array') updateNode(node.id, { type: 'object' }, true);
            addNode(node.id, 'newField', 'string');
        };

        const handleAddObject = () => {
            if (node.type !== 'object' && node.type !== 'array') updateNode(node.id, { type: 'object' }, true);
            addNode(node.id, 'newObject', 'object');
        };

        const handlePasteFromClipboard = async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (!text.trim()) { alert(t('jsb2_err_empty_clip', "Буфер обмена пуст!")); return; }

                let jsonObj;
                try {
                    jsonObj = JSON.parse(text);
                } catch (e) {
                    try {
                        jsonObj = JSON.parse(`[${text.trim().replace(/}\s*{/g, '},{')}]`);
                    } catch (e2) {
                        alert(t('jsb2_err_parse_clip', "Ошибка: Не удалось распознать скопированные данные как JSON."));
                        return;
                    }
                }

                const isSchema = jsonObj.$schema !== undefined || (jsonObj.type === 'object' && jsonObj.properties !== undefined);
                let newNodesMap;

                if (isSchema) {
                    const importer = new JsonSchemaImporter();
                    newNodesMap = importer.build(jsonObj, "PastedSchema");
                } else {
                    const isArray = Array.isArray(jsonObj);
                    const doMerge = isArray ? confirm(t('jsb2_conf_merge_arr', "Вставлен массив примеров.\n\nНажмите ОК, чтобы склеить их в ОДИН объект (опциональные поля).\nНажмите Отмена, чтобы вставить как массив элементов.")) : false;
                    const inferer = new JsonInferer();
                    newNodesMap = inferer.build(jsonObj, "PastedData", doMerge);
                }

                onPasteNodes(node.id, newNodesMap);

            } catch (e) {
                alert(t('jsb2_err_read_clip', "Ошибка чтения буфера обмена: ") + e.message);
            }
        };

        return (
            <div className="space-y-4 pb-10">
                <div className="flex justify-between items-center border-b border-slate-700 pb-2">
                    <h3 className="text-lg font-bold text-slate-200 flex items-center">
                        {Icons[node.type] ? Icons[node.type]() : ''}
                        {t('jsb2_node_props', 'Свойства узла')}
                    </h3>
                    {node.parentId && (
                        <div className="flex gap-2">
                            {hasChildren && (
                                <button onClick={() => removeNodeKeepChildren(node.id)} className="bg-orange-500/20 text-orange-400 hover:bg-orange-500/30 px-3 py-1 rounded text-xs transition font-medium" title={t('jsb2_hint_del_keep', 'Удалить только этот узел, а вложенные элементы перенести на уровень выше')}>
                                    {t('jsb2_btn_del_keep', 'Удалить (оставить детей)')}
                                </button>
                            )}
                            <button onClick={() => removeNode(node.id)} className="bg-red-500/20 text-red-400 hover:bg-red-500/30 px-3 py-1 rounded text-xs transition font-medium" title={t('jsb2_hint_del_all', 'Удалить узел вместе со всеми вложенными элементами')}>
                                {t('jsb2_btn_del_all', 'Удалить всё')}
                            </button>
                        </div>
                    )}
                </div>

                <div className="grid grid-cols-2 gap-4">
                    <div>
                        <label className="block text-xs text-slate-400 mb-1">{t('jsb2_lbl_key', 'Имя ключа (Key)')}</label>
                        <input
                            type="text" value={node.name} disabled={!node.parentId}
                            onChange={(e) => updateNode(node.id, { name: e.target.value }, false)}
                            onBlur={(e) => updateNode(node.id, { name: e.target.value }, true)}
                            className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition disabled:opacity-50 text-white"
                        />
                    </div>

                    <div>
                        <label className="block text-xs text-slate-400 mb-1">{t('jsb2_lbl_type', 'Тип данных')}</label>
                        <select
                            value={node.type || ''}
                            onChange={(e) => updateNode(node.id, { type: e.target.value }, true)}
                            className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition text-white"
                        >
                            {JSON_TYPES.map(typeN => <option key={typeN} value={typeN}>{typeN || t('jsb2_no_type', '- Без типа (anyOf / $ref) -')}</option>)}
                        </select>
                    </div>

                    <div>
                        <label className="block text-xs text-slate-400 mb-1">{t('jsb2_lbl_title', 'Заголовок (Title)')}</label>
                        <input
                            type="text" value={node.title || ''} placeholder={t('jsb2_ph_title', "Название объекта...")}
                            onChange={(e) => updateNode(node.id, { title: e.target.value }, false)}
                            onBlur={(e) => updateNode(node.id, { title: e.target.value }, true)}
                            className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition text-white"
                        />
                    </div>

                    <div>
                        <label className="block text-xs text-slate-400 mb-1">{t('jsb2_lbl_desc', 'Описание (Description)')}</label>
                        <input
                            type="text" value={node.description || ''} placeholder={t('jsb2_ph_desc', "Пояснение к полю...")}
                            onChange={(e) => updateNode(node.id, { description: e.target.value }, false)}
                            onBlur={(e) => updateNode(node.id, { description: e.target.value }, true)}
                            className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition text-white"
                        />
                    </div>

                    {node.type === 'array' && getChildren(node.id).length === 0 && (
                        <div className="col-span-2">
                            <label className="block text-xs text-slate-400 mb-1">{t('jsb2_lbl_arr_type', 'Тип элементов массива')}</label>
                            <select
                                value={node.primitiveType || 'string'}
                                onChange={(e) => updateNode(node.id, { primitiveType: e.target.value }, true)}
                                className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition text-white"
                            >
                                {['string', 'number', 'integer', 'boolean'].map(typeN => <option key={typeN} value={typeN}>{typeN}</option>)}
                            </select>
                        </div>
                    )}

                    <div className="col-span-2 flex gap-6 mt-2">
                        <label className="flex items-center cursor-pointer">
                            <input
                                type="checkbox" checked={node.isRequired} disabled={!node.parentId}
                                onChange={(e) => updateNode(node.id, { isRequired: e.target.checked }, true)}
                                className="w-4 h-4 rounded bg-slate-800 border-slate-600 text-blue-600 focus:ring-blue-500 disabled:opacity-50"
                            />
                            <span className="ml-2 text-sm text-slate-300">{t('jsb2_lbl_req', 'Обязательное (Required)')}</span>
                        </label>

                        {node.type === 'object' && (
                            <label className="flex items-center cursor-pointer">
                                <input
                                    type="checkbox" checked={node.additionalProperties}
                                    onChange={(e) => updateNode(node.id, { additionalProperties: e.target.checked }, true)}
                                    className="w-4 h-4 rounded bg-slate-800 border-slate-600 text-blue-600 focus:ring-blue-500"
                                />
                                <span className="ml-2 text-sm text-slate-300">{t('jsb2_lbl_add_props', 'Доп. свойства (AdditionalProperties)')}</span>
                            </label>
                        )}
                    </div>

                    <div className="col-span-2 mt-2">
                        <label className="block text-xs text-slate-400 mb-1 font-bold">{t('jsb2_lbl_extra_props', '⚙️ Доп. свойства JSON (anyOf, enum, pattern, $ref...)')}</label>
                        <textarea
                            defaultValue={JSON.stringify(node.extraProps || {}, null, 2)}
                            onBlur={(e) => {
                                try {
                                    const parsed = JSON.parse(e.target.value);
                                    updateNode(node.id, { extraProps: parsed }, true);
                                } catch(err) {
                                    alert(t('jsb2_err_extra_json', "Ошибка в JSON дополнительных свойств!"));
                                    e.target.value = JSON.stringify(node.extraProps || {}, null, 2);
                                }
                            }}
                            className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-xs font-mono focus:outline-none focus:border-blue-500 transition text-emerald-400 h-24"
                        />
                    </div>
                </div>

                <div className="flex flex-col gap-2 pt-4 border-t border-slate-700">
                    {(node.type === 'object' || node.type === 'array') && (
                        <>
                            <div className="flex gap-2">
                                <button onClick={handleAddChild} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded text-sm transition font-medium">{t('jsb2_btn_add_field', '+ Поле')}</button>
                                <button onClick={handleAddObject} className="flex-1 bg-amber-600 hover:bg-amber-500 text-white py-2 rounded text-sm transition font-medium">{t('jsb2_btn_add_obj', '+ Структура (Object)')}</button>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => onOpenImportModal(node.id)} className="flex-1 bg-purple-600 hover:bg-purple-500 text-white py-2 rounded text-sm transition font-medium flex justify-center items-center gap-1">
                                    <span>📥</span> {t('jsb2_btn_import_win', 'Из окна')}
                                </button>
                                <button onClick={handlePasteFromClipboard} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded text-sm transition font-medium flex justify-center items-center gap-1" title={t('jsb2_hint_import_buf', "Мгновенная вставка скопированного JSON из буфера")}>
                                    📋 {t('jsb2_btn_import_buf', 'Из буфера')}
                                </button>
                            </div>
                        </>
                    )}
                </div>
            </div>
        );
    };

    const MonacoEditor = () => {
        const editorRef = useRef(null);
        const monacoInst = useRef(null);
        const { activeTab } = useSchemaStore();

        useEffect(() => {
            require.config({ paths: { 'vs': 'libs/monaco-editor/min/vs' }});
            require(['vs/editor/editor.main'], function() {
                monacoInst.current = monaco.editor.create(editorRef.current, {
                    value: '{}',
                    language: 'json',
                    theme: 'vs-dark',
                    readOnly: true,
                    minimap: { enabled: false },
                    automaticLayout: true,
                    fontSize: 13,
                    fontFamily: 'Consolas, monospace',
                    scrollBeyondLastLine: false,
                    formatOnType: true
                });
            });
            return () => { if (monacoInst.current) monacoInst.current.dispose(); };
        }, []);

        useEffect(() => {
            if (monacoInst.current) {
                const jsonSchema = JsonSchemaGenerator.generate(activeTab.nodes);
                const model = monacoInst.current.getModel();
                if (model.getValue() !== jsonSchema) monacoInst.current.setValue(jsonSchema);
            }
        }, [activeTab.nodes]);

        const selectedNodeName = activeTab.nodes[activeTab.selectedNodeId]?.name;
        useEffect(() => {
            if (monacoInst.current && selectedNodeName && selectedNodeName !== 'Root') {
                const model = monacoInst.current.getModel();
                const searchStr = `"${selectedNodeName}"`;
                const matches = model.findMatches(searchStr, false, false, false, null, true);
                if (matches.length > 0) {
                    monacoInst.current.revealLineInCenter(matches[0].range.startLineNumber);
                    monacoInst.current.setSelection(matches[0].range);
                }
            }
        }, [selectedNodeName]);

        const copyToClipboard = () => {
            if (monacoInst.current) {
                navigator.clipboard.writeText(monacoInst.current.getValue());
                alert(t('jsb2_msg_copied', "JSON Schema скопирована!"));
            }
        };

        return (
            <div className="flex flex-col h-full bg-[#1e1e1e]">
                <div className="bg-[#252526] p-2 flex justify-between items-center border-b border-[#333]">
                    <span className="text-slate-300 text-sm font-semibold ml-2">{t('jsb2_gen_schema', 'Сгенерированная JSON Schema')}</span>
                    <div className="flex gap-2">
                        <button onClick={() => monacoInst.current.getAction('actions.find').run()} className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded text-xs transition">🔍 {t('jsb2_btn_search', 'Поиск')}</button>
                        <button onClick={() => monacoInst.current.getAction('editor.action.formatDocument').run()} className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded text-xs transition">🪄 {t('jsb2_btn_format', 'Формат')}</button>
                        <button onClick={copyToClipboard} className="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-xs transition">📋 {t('jsb2_btn_copy', 'Копировать')}</button>
                    </div>
                </div>
                <div ref={editorRef} className="flex-1" />
            </div>
        );
    };

    const JsonImportModal = ({ isOpen, onClose, targetNodeId }) => {
        const [jsonText, setJsonText] = useState('{\n  "id": 123,\n  "isActive": true,\n  "name": "Иван",\n  "roles": ["admin", "user"]\n}');
        const [mergeMode, setMergeMode] = useState(true);
        const { importSchema, mergeNodesToBranch } = useSchemaStore();

        const handleImport = () => {
            try {
                let jsonObj;
                try {
                    jsonObj = JSON.parse(jsonText);
                } catch (e) {
                    jsonObj = JSON.parse(`[${jsonText.trim().replace(/}\s*{/g, '},{')}]`);
                }

                const isSchema = jsonObj.$schema !== undefined || (jsonObj.type === 'object' && jsonObj.properties !== undefined);
                let newNodesMap;

                if (isSchema) {
                    const importer = new JsonSchemaImporter();
                    newNodesMap = importer.build(jsonObj, targetNodeId ? "ImportedSchema" : "Root");
                } else {
                    const isArray = Array.isArray(jsonObj);
                    const doMerge = isArray ? confirm(t('jsb2_conf_merge_arr', "Вставлен массив примеров.\n\nНажмите ОК, чтобы склеить их в ОДИН объект (опциональные поля).\nНажмите Отмена, чтобы вставить как массив элементов.")) : false;
                    const inferer = new JsonInferer();
                    newNodesMap = inferer.build(jsonObj, targetNodeId ? "ImportedData" : "Root", mergeMode);
                }

                if (targetNodeId) {
                    mergeNodesToBranch(newNodesMap, targetNodeId);
                } else {
                    importSchema(newNodesMap);
                }

                onClose();
            } catch (e) { alert(t('jsb2_err_json_parse', "Ошибка парсинга JSON: ") + e.message); }
        };

        if (!isOpen) return null;
        return (
            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex justify-center items-center">
                <div className="bg-slate-800 p-6 rounded-lg w-[800px] border border-slate-700 shadow-2xl">
                    <h2 className="text-xl font-bold mb-2 text-white">{targetNodeId ? t('jsb2_import_branch', '📥 Импорт в ветку') : t('jsb2_import_global', '📥 Глобальный импорт')}</h2>

                    <p className="text-xs text-slate-400 mb-4">{t('jsb2_import_hint', 'Вставьте JSON объект, массив ИЛИ готовую JSON Schema. Система автоматически распознает формат.')}</p>

                    <textarea value={jsonText} onChange={e => setJsonText(e.target.value)} className="w-full h-[350px] bg-slate-900 text-green-400 font-mono text-sm p-4 rounded border border-slate-700 focus:border-blue-500 outline-none" />

                    <div className="mt-3 flex items-center">
                        <label className="flex items-center cursor-pointer text-sm text-slate-300">
                            <input type="checkbox" checked={mergeMode} onChange={e => setMergeMode(e.target.checked)} className="w-4 h-4 mr-2 bg-slate-800 border-slate-600 rounded text-purple-600 focus:ring-purple-500" />
                            {t('jsb2_import_merge', '✅ Склеить массив примеров в единую схему (редкие поля станут опциональными)')}
                        </label>
                    </div>

                    <div className="flex justify-end gap-3 mt-4">
                        <button onClick={onClose} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-white transition">{t('jsb2_btn_cancel', 'Отмена')}</button>
                        <button onClick={handleImport} className="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded text-white font-semibold transition">{t('jsb2_btn_import', 'Импортировать')}</button>
                    </div>
                </div>
            </div>
        );
    };

    const App = () => {
        const [modalConfig, setModalConfig] = useState({ isOpen: false, targetNodeId: null });
        const [searchIndex, setSearchIndex] = useState(-1);
        const { tabs, activeTab, addTab, closeTab, setActiveTabId, treeSearchTerm, setSearchTerm, undo, redo, mergeNodesToBranch, selectNode, expandParents } = useSchemaStore();

        useEffect(() => {
            if(typeof window.initLocalization === 'function') window.initLocalization();
        }, []);

        const rootNodes = Object.values(activeTab.nodes).filter(n => n.parentId === null);

        const handlePasteNodes = (nodeId, newNodesMap) => {
            mergeNodesToBranch(newNodesMap, nodeId);
        };

        const handleSearchKeyDown = (e) => {
            if (e.key === 'Enter' && treeSearchTerm) {
                const nodesList = Object.values(activeTab.nodes);
                const matches = nodesList.filter(n => n.name.toLowerCase().includes(treeSearchTerm.toLowerCase()));

                if (matches.length > 0) {
                    const nextIdx = (searchIndex + 1) % matches.length;
                    setSearchIndex(nextIdx);
                    const targetNode = matches[nextIdx];

                    expandParents(targetNode.id);
                    selectNode(targetNode.id);

                    setTimeout(() => {
                        const el = document.getElementById('tree-node-' + targetNode.id);
                        if (el) {
                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 50);
                }
            }
        };

        const handleSearchChange = (e) => {
            setSearchTerm(e.target.value);
            setSearchIndex(-1);
        };

        return (
            <>
                <header className="bg-slate-900 p-3 flex justify-between items-center shadow-md z-10 border-b border-slate-800">
                    <div className="flex items-center gap-3">
                        <div className="w-8 h-8 bg-amber-500 rounded flex items-center justify-center font-bold text-xl text-slate-900">{`{}`}</div>
                        <div>
                            <h1 className="text-lg font-bold leading-tight">{t('jsb2_title', 'JSON Schema Builder IDE')}</h1>
                            <p className="text-xs text-slate-400">{t('jsb2_subtitle', 'Tabs • D&D • Deep Merge • Local')}</p>
                        </div>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={undo} disabled={activeTab.past.length === 0} className="bg-slate-700 disabled:opacity-30 hover:bg-slate-600 text-white px-3 py-1.5 rounded transition font-medium" title={t('jsb2_btn_undo_hint', 'Отменить (Ctrl+Z)')}>↩ Undo</button>
                        <button onClick={redo} disabled={activeTab.future.length === 0} className="bg-slate-700 disabled:opacity-30 hover:bg-slate-600 text-white px-3 py-1.5 rounded transition font-medium mr-4" title={t('jsb2_btn_redo_hint', 'Вернуть (Ctrl+Y)')}>↪ Redo</button>

                        <button onClick={() => setModalConfig({ isOpen: true, targetNodeId: null })} className="bg-purple-600 hover:bg-purple-500 text-white px-4 py-1.5 rounded shadow-lg transition font-medium flex items-center gap-2">
                            <span>📥</span> {t('jsb2_btn_import_all', 'Заменить всё (Import JSON / Schema)')}
                        </button>
                    </div>
                </header>

                <div className="tabs-container">
                    {tabs.map(tab => (
                        <div key={tab.id} className={`tab ${tab.id === activeTab.id ? 'active' : ''}`} onClick={() => setActiveTabId(tab.id)}>
                            📄 {tab.title}
                            <span className="tab-close" onClick={(e) => closeTab(e, tab.id)}>✖</span>
                        </div>
                    ))}
                    <div className="tab hover:bg-slate-800" onClick={addTab} title={t('jsb2_hint_new_schema', 'Создать новую схему')}>
                        <span style={{ fontSize: '18px', fontWeight: 'bold' }}>+</span>
                    </div>
                </div>

                <div className="split-pane">
                    <aside className="sidebar">
                        <div className="bg-slate-800 p-2 border-b border-slate-700 flex flex-col gap-2">
                            <input
                                type="text"
                                placeholder={t('jsb2_ph_search', '🔍 Поиск по дереву (Enter для перехода)...')}
                                value={treeSearchTerm}
                                onChange={handleSearchChange}
                                onKeyDown={handleSearchKeyDown}
                                className="w-full bg-slate-900 border border-slate-600 rounded-md py-1.5 px-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500"
                            />
                            <div className="text-[10px] text-slate-400 px-1 leading-tight">
                                💡 <b>D&D:</b> {t('jsb2_dd_hint', 'Бросок вовнутрь вкладывает поле. Удерживайте Ctrl при броске, чтобы переместить выше.')}<br/>
                                💡 <b>{t('jsb2_lbl_xray', 'Рентген')}:</b> {t('jsb2_xray_hint', 'Удерживайте Ctrl, чтобы увидеть статистику полей в дереве.')}
                            </div>
                        </div>
                        <div className="tree-container">
                            {rootNodes.map(n => <TreeNode key={n.id} id={n.id} />)}
                        </div>
                        <div className="properties-panel">
                            <PropertiesPanel
                                onOpenImportModal={(id) => setModalConfig({ isOpen: true, targetNodeId: id })}
                                onPasteNodes={handlePasteNodes}
                            />
                        </div>
                    </aside>
                    <main className="editor-container">
                        <MonacoEditor />
                    </main>
                </div>

                <JsonImportModal
                    isOpen={modalConfig.isOpen}
                    targetNodeId={modalConfig.targetNodeId}
                    onClose={() => setModalConfig({ isOpen: false, targetNodeId: null })}
                />
            </>
        );
    };

    const Main = () => (
        <SchemaProvider>
            <App />
        </SchemaProvider>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Main />);
</script>
</body>
</html>
