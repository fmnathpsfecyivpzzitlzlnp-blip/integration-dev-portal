<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-i18n="mg_page_title">Умный Конвертер и WireMock</title>

    <script src="libs/jquery-3.6.0.min.js"></script>
    <script src="utils.js"></script>

    <link rel="stylesheet" href="libs/codemirror.min.css">
    <link rel="stylesheet" href="libs/dracula.min.css">
    <script src="libs/codemirror.min.js"></script>
    <script src="libs/javascript.min.js"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        /* === ПЕРЕМЕННЫЕ ДЛЯ ТЕМНОЙ ТЕМЫ === */
        :root {
            --bg-main: #f4f7f9;
            --bg-card: #ffffff;
            --bg-header: #f8fafc;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --action-bar-bg: #f1f5f9;
            --error-bg: #fee2e2;
            --error-text: #dc2626;
        }

        body.dark-theme {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-header: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --action-bar-bg: #1e293b;
            --error-bg: rgba(220, 38, 38, 0.1);
            --error-text: #f87171;
        }

        /* === БРОНЕБОЙНАЯ ИЗОЛЯЦИЯ ОТ style.css === */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            height: 100vh !important;
            overflow: hidden !important;
        }

        body {
            background: var(--bg-main) !important;
            padding: 20px !important;
            font-family: 'Inter', 'Segoe UI', sans-serif !important;
            display: flex !important;
            flex-direction: column !important;
            box-sizing: border-box !important;
            color: var(--text-main) !important;
            transition: background 0.3s, color 0.3s;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .header h2 { margin: 0; font-size: 22px; color: var(--text-main); }
        .header p { margin: 2px 0 0 0; color: var(--text-muted); font-size: 12px; }

        .btn { padding: 8px 15px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn.secondary { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn.secondary:hover { filter: brightness(0.95); }

        .workspace { flex: 1; display: flex; gap: 20px; overflow: hidden; min-height: 0; }
        .col { display: flex; flex-direction: column; flex: 1; min-width: 0; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); overflow: hidden; transition: 0.3s; }

        .panel-head { background: var(--bg-header); padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-weight: 600; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; transition: 0.3s; }
        .panel-body { display: flex; flex-direction: column; flex: 1; padding: 15px; gap: 15px; overflow-y: auto; background: var(--bg-card); transition: 0.3s; }

        .CodeMirror { flex: 1; border: 1px solid var(--border-color); border-radius: 4px; font-family: 'Consolas', monospace; font-size: 13px; height: 100% !important; background: var(--input-bg); color: var(--text-main); }

        .action-bar { display: flex; gap: 10px; background: var(--action-bar-bg); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); align-items: center; flex-wrap: wrap; transition: 0.3s;}
        .action-bar select, .action-bar input { padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 13px; outline: none; background: var(--input-bg); color: var(--text-main); transition: 0.3s; }
        .action-bar input:focus, .action-bar select:focus { border-color: #3b82f6; }

        .btn-action { background: #3b82f6; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { background: #2563eb; }
        .btn-wiremock { background: #f59e0b; color: white; }
        .btn-wiremock:hover { background: #d97706; }
        .btn-swagger { background: #10b981; color: white; }
        .btn-swagger:hover { background: #059669; }

        .btn-icon { background: transparent; border: none; font-size: 16px; cursor: pointer; color: var(--text-muted); transition: 0.2s; padding: 0; }
        .btn-icon:hover { color: #ef4444; }

        .error-msg { background: var(--error-bg); color: var(--error-text); padding: 10px; border-radius: 4px; font-size: 12px; font-weight: bold; display: none; margin-bottom: 10px; border: 1px solid var(--error-text); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

<div class="header">
    <div style="display: flex; align-items: center; gap: 15px;">
        <button onclick="window.location.href='index.html'" class="btn secondary" data-i18n="btn_home">🏠 Домой</button>
        <div>
            <h2 data-i18n="mg_title">Конвертер Данных и Генератор WireMock</h2>
            <p data-i18n="mg_subtitle">cURL ➔ JSON | SQL ➔ JSON | JSON ➔ WireMock Stub</p>
        </div>
    </div>
</div>

<div class="workspace">
    <!-- ЛЕВАЯ КОЛОНКА: Входные данные (cURL, SQL, текст) -->
    <div class="col">
        <div class="panel-head">
            <span data-i18n="mg_col_in">1. Входные данные (Source)</span>
            <button class="btn-icon" onclick="editorIn.setValue('')" title="Очистить" data-i18n="btn_clear">🗑</button>
        </div>
        <div class="panel-body" style="padding-bottom: 0;">
            <div class="action-bar">
                <span style="font-size: 12px; font-weight: bold; color: var(--text-muted);" data-i18n="mg_lbl_convert">Конвертировать:</span>
                <button class="btn-action" onclick="parseCurlToJson()" data-i18n="mg_btn_curl">cURL ➔ JSON</button>
                <button class="btn-action" onclick="parseSqlToJson()" data-i18n="mg_btn_sql">SQL Результат ➔ JSON</button>
            </div>
            <div class="error-msg" id="in-error"></div>
            <textarea id="editor-in" placeholder="Вставьте сюда команду cURL, результат SQL запроса (таблицу) или сырой текст..."></textarea>
        </div>
    </div>

    <!-- ЦЕНТРАЛЬНАЯ КОЛОНКА: JSON (Request/Response) -->
    <div class="col">
        <div class="panel-head">
            <span data-i18n="mg_col_json">2. Структура JSON</span>
            <button class="btn-icon" onclick="editorJson.setValue('')" title="Очистить" data-i18n="btn_clear">🗑</button>
        </div>
        <div class="panel-body" style="padding-bottom: 0;">
            <div class="action-bar">
                <span style="font-size: 12px; font-weight: bold; color: var(--text-muted);" data-i18n="mg_lbl_generate">Генерировать:</span>
                <button class="btn-action btn-wiremock" onclick="generateWiremockStub()" data-i18n="mg_btn_wm">⚡ WireMock Stub</button>
                <button class="btn-action btn-swagger" onclick="sendToSwagger()" data-i18n="mg_btn_swagger">➡️ В Swagger</button>
            </div>
            <div class="error-msg" id="json-error"></div>
            <textarea id="editor-json" placeholder="Здесь появится готовый JSON..."></textarea>
        </div>
    </div>

    <!-- ПРАВАЯ КОЛОНКА: Результат (WireMock Stub) -->
    <div class="col">
        <div class="panel-head">
            <span data-i18n="mg_col_out">3. Результат (WireMock Mapping)</span>
            <button class="btn secondary" style="padding: 4px 10px; font-size: 12px;" onclick="copyResult()" data-i18n="btn_copy">📋 Копировать</button>
        </div>
        <div class="panel-body" style="padding-bottom: 0;">
            <div class="action-bar" style="background: transparent; border: none; padding: 0 0 10px 0;">
                <input type="text" id="wm-url" value="/api/v1/test" placeholder="URL Endpoint" style="flex: 1;">
                <select id="wm-method">
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                    <option value="PATCH">PATCH</option>
                </select>
                <input type="number" id="wm-status" value="200" style="width: 70px;" title="HTTP Status Code">
            </div>
            <textarea id="editor-out"></textarea>
        </div>
    </div>
</div>

<script>
    let editorIn, editorJson, editorOut;

    $(function() {
        if(typeof initLocalization === 'function') initLocalization();
        const isDark = localStorage.getItem('global_dark_theme') === 'true';
        if(typeof applyTheme === 'function') applyTheme(isDark);

        const cmThemeIn = isDark ? "dracula" : "default";

        editorIn = CodeMirror.fromTextArea(document.getElementById('editor-in'), {
            mode: "text/plain", lineNumbers: true, lineWrapping: true, theme: cmThemeIn
        });
        editorJson = CodeMirror.fromTextArea(document.getElementById('editor-json'), {
            mode: "application/json", lineNumbers: true, matchBrackets: true, theme: cmThemeIn
        });
        editorOut = CodeMirror.fromTextArea(document.getElementById('editor-out'), {
            mode: "application/json", lineNumbers: true, theme: "dracula", readOnly: true
        });

        window.addEventListener('themeChanged', function(e) {
            const newTheme = e.detail.isDark ? 'dracula' : 'default';
            editorIn.setOption('theme', newTheme);
            editorJson.setOption('theme', newTheme);
            // editorOut оставляем темным (или можно сделать newTheme)
            editorOut.setOption('theme', e.detail.isDark ? 'dracula' : 'dracula');
        });

        const startCurl = "curl -X POST https://api.test.com/users \\\n -H 'Content-Type: application/json' \\\n -d '{\"name\": \"Ivan\", \"role\": \"admin\"}'";
        editorIn.setValue(startCurl);

        // Перехват параметров из URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('url')) {
            $('#wm-url').val(urlParams.get('url'));
        }

        // Локализация плейсхолдеров
        if (typeof window.t === 'function') {
            $('#editor-in').attr('placeholder', window.t('mg_ph_in', 'Вставьте сюда команду cURL, результат SQL запроса (таблицу) или сырой текст...'));
            $('#editor-json').attr('placeholder', window.t('mg_ph_json', 'Здесь появится готовый JSON...'));
            $('#wm-url').attr('placeholder', window.t('mg_ph_url', "URL Endpoint'а"));
        }
    });

    // === ПАРСЕР cURL -> JSON ===
    function parseCurlToJson() {
        $('#in-error').hide();
        const curlStr = editorIn.getValue().trim();
        if (!curlStr) return;

        const cleanStr = curlStr.replace(/\\\n/g, ' ').replace(/\\\r\n/g, ' ');

        // Ищем тело (Body)
        const dataMatch = cleanStr.match(/(?:-d|--data|--data-raw)\s+(['"])([\s\S]*?)\1/i);
        if (dataMatch) {
            try {
                const jsonObj = JSON.parse(dataMatch[2]);
                editorJson.setValue(JSON.stringify(jsonObj, null, 4));
            } catch(e) {
                editorJson.setValue(dataMatch[2]);
            }
        } else {
            const msg = typeof window.t === 'function' ? window.t('mg_err_curl_body', "Не найдено тело запроса (-d / --data) в команде cURL.") : "Не найдено тело запроса (-d / --data) в команде cURL.";
            $('#in-error').text(msg).show();
        }

        // Пытаемся выцепить URL и Метод для WireMock
        const urlMatch = cleanStr.match(/['"]?(https?:\/\/[^\s'"]+)['"]?/);
        if (urlMatch) {
            try {
                const url = new URL(urlMatch[1]);
                $('#wm-url').val(url.pathname);
            } catch(e) {}
        }

        const methodMatch = cleanStr.match(/-X\s+([A-Z]+)/i);
        if (methodMatch) $('#wm-method').val(methodMatch[1].toUpperCase());
        else if (dataMatch) $('#wm-method').val('POST');
    }

    // === ПАРСЕР SQL RESULT -> JSON ===
    function parseSqlToJson() {
        $('#in-error').hide();
        const text = editorIn.getValue().trim();
        if (!text) return;

        // Примитивный парсер табличных данных (Tab-Separated)
        const lines = text.split('\n');
        if (lines.length < 2) {
            const msg = typeof window.t === 'function' ? window.t('mg_err_sql', "Ожидаются табличные данные (минимум 2 строки: заголовки и значения)") : "Ожидаются табличные данные (минимум 2 строки: заголовки и значения)";
            return $('#in-error').text(msg).show();
        }

        const headers = lines[0].split('\t').map(h => h.trim());
        const result = [];

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const values = lines[i].split('\t');
            let obj = {};

            headers.forEach((header, index) => {
                let val = values[index] ? values[index].trim() : null;

                if (val === 'null' || val === 'NULL') val = null;
                else if (val === 'true') val = true;
                else if (val === 'false') val = false;
                else if (!isNaN(val) && val !== '') val = Number(val);

                obj[header] = val;
            });
            result.push(obj);
        }

        const finalJson = result.length === 1 ? result[0] : result;
        editorJson.setValue(JSON.stringify(finalJson, null, 4));
    }

    // === ГЕНЕРАТОР WIREMOCK STUB ===
    function generateWiremockStub() {
        $('#json-error').hide();
        const jsonText = editorJson.getValue().trim();

        let responseBody = {};
        if (jsonText) {
            try {
                responseBody = JSON.parse(jsonText);
            } catch(e) {
                const msg = typeof window.t === 'function' ? window.t('mg_err_json_syntax', "Ошибка синтаксиса JSON в центральном окне: ") : "Ошибка синтаксиса JSON в центральном окне: ";
                return $('#json-error').text(msg + e.message).show();
            }
        }

        const url = $('#wm-url').val().trim() || '/api/test';
        const method = $('#wm-method').val();
        const status = parseInt($('#wm-status').val()) || 200;

        const stub = {
            "request": {
                "method": method,
                "urlPath": url
            },
            "response": {
                "status": status,
                "headers": {
                    "Content-Type": "application/json"
                },
                "jsonBody": responseBody
            }
        };

        editorOut.setValue(JSON.stringify(stub, null, 4));

        if(typeof window.showNotification === 'function') {
            const msg = typeof window.t === 'function' ? window.t('mg_msg_wm_ok', "WireMock заглушка сгенерирована!") : "WireMock заглушка сгенерирована!";
            window.showNotification(msg);
        }
    }

    // === ИНТЕГРАЦИЯ: ПЕРЕДАЧА В SWAGGER ===
    function sendToSwagger() {
        const jsonText = editorJson.getValue().trim();
        if (!jsonText) {
            const msg = typeof window.t === 'function' ? window.t('mg_err_no_json', "Сначала получите JSON!") : "Сначала получите JSON!";
            return alert(msg);
        }

        // Сохраняем во временное хранилище и переходим на страницу Swagger
        localStorage.setItem('swagger_temp_req', jsonText);
        window.location.href = 'swagger_generator.html?load_temp=true';
    }

    function copyResult() {
        navigator.clipboard.writeText(editorOut.getValue());
        if(typeof window.showNotification === 'function') {
            const msg = typeof window.t === 'function' ? window.t('msg_copied', "Скопировано!") : "Скопировано!";
            window.showNotification(msg);
        }
    }
</script>
</body>
</html>
