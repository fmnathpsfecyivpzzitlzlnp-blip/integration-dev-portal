<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Умный Конвертер и WireMock</title>
    <script src="libs/jquery-3.6.0.min.js"></script>
    <script src="utils.js"></script>

    <link rel="stylesheet" href="libs/codemirror.min.css">
    <link rel="stylesheet" href="libs/dracula.min.css">
    <script src="libs/codemirror.min.js"></script>
    <script src="libs/javascript.min.js"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        body { background: #f4f7f9; margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }

        .workspace { flex: 1; display: flex; gap: 20px; overflow: hidden; }
        .col { display: flex; flex-direction: column; flex: 1; min-width: 0; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); overflow: hidden; }

        .panel-head { background: #f8fafc; padding: 12px 15px; border-bottom: 1px solid #e2e8f0; font-weight: 600; color: #334155; display: flex; justify-content: space-between; align-items: center; }
        .panel-body { display: flex; flex-direction: column; flex: 1; padding: 15px; gap: 15px; overflow-y: auto; }

        .CodeMirror { flex: 1; border: 1px solid #cbd5e1; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 13px; height: 100% !important; }

        .action-bar { display: flex; gap: 10px; background: #f1f5f9; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; align-items: center; flex-wrap: wrap;}
        .action-bar select, .action-bar input { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; outline: none; }

        .btn-action { background: #3b82f6; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { background: #2563eb; }
        .btn-wiremock { background: #f59e0b; color: white; }
        .btn-wiremock:hover { background: #d97706; }

        .error-msg { background: #fee2e2; color: #dc2626; padding: 10px; border-radius: 4px; font-size: 12px; font-weight: bold; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="header">
    <div style="display: flex; align-items: center; gap: 15px;">
        <button onclick="window.location.href='index.html'" class="secondary">🏠 Домой</button>
        <div>
            <h2 style="margin: 0; font-size: 22px; color: #1e293b;">Конвертер Данных и Генератор WireMock</h2>
            <p style="margin: 2px 0 0 0; color: #64748b; font-size: 12px;">cURL ➔ JSON | SQL ➔ JSON | JSON ➔ WireMock Stub</p>
        </div>
    </div>
</div>

<div class="workspace">
    <!-- ЛЕВАЯ КОЛОНКА: Входные данные (cURL, SQL, текст) -->
    <div class="col">
        <div class="panel-head">
            <span>1. Входные данные (Source)</span>
            <button class="btn-icon" onclick="editorIn.setValue('')" title="Очистить">🗑</button>
        </div>
        <div class="panel-body" style="padding-bottom: 0;">
            <div class="action-bar">
                <span style="font-size: 12px; font-weight: bold; color: #475569;">Конвертировать:</span>
                <button class="btn-action" onclick="parseCurlToJson()">cURL ➔ JSON</button>
                <button class="btn-action" onclick="parseSqlToJson()">SQL Результат ➔ JSON</button>
            </div>
            <div class="error-msg" id="in-error"></div>
            <textarea id="editor-in" placeholder="Вставьте сюда команду cURL, результат SQL запроса (таблицу) или сырой текст..."></textarea>
        </div>
    </div>

    <!-- ЦЕНТРАЛЬНАЯ КОЛОНКА: JSON (Request/Response) -->
    <div class="col">
        <div class="panel-head">
            <span>2. Структура JSON</span>
            <button class="btn-icon" onclick="editorJson.setValue('')" title="Очистить">🗑</button>
        </div>
        <div class="panel-body" style="padding-bottom: 0;">
            <div class="action-bar">
                <span style="font-size: 12px; font-weight: bold; color: #475569;">Генерировать:</span>
                <button class="btn-action btn-wiremock" onclick="generateWiremockStub()">⚡ WireMock Stub</button>
                <button class="btn-action" style="background:#10b981;" onclick="sendToSwagger()">➡️ В Swagger</button>
            </div>
            <div class="error-msg" id="json-error"></div>
            <textarea id="editor-json" placeholder="Здесь появится готовый JSON..."></textarea>
        </div>
    </div>

    <!-- ПРАВАЯ КОЛОНКА: Результат (WireMock Stub) -->
    <div class="col">
        <div class="panel-head">
            <span>3. Результат (WireMock Mapping)</span>
            <button class="secondary btn-small" onclick="copyResult()">📋 Копировать</button>
        </div>
        <div class="panel-body" style="padding-bottom: 0; background: #282a36;">
            <div class="action-bar" style="background: transparent; border: none; padding: 0 0 10px 0;">
                <input type="text" id="wm-url" value="/api/v1/test" placeholder="URL Endpoint'а" style="flex: 1;">
                <select id="wm-method">
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                </select>
                <input type="number" id="wm-status" value="200" style="width: 70px;" title="HTTP Status Code">
            </div>
            <textarea id="editor-out"></textarea>
        </div>
    </div>
</div>

<script>
    let editorIn, editorJson, editorOut;

    $(function() {
        editorIn = CodeMirror.fromTextArea(document.getElementById('editor-in'), {
            mode: "text/plain", lineNumbers: true, lineWrapping: true
        });
        editorJson = CodeMirror.fromTextArea(document.getElementById('editor-json'), {
            mode: "application/json", lineNumbers: true, matchBrackets: true
        });
        editorOut = CodeMirror.fromTextArea(document.getElementById('editor-out'), {
            mode: "application/json", lineNumbers: true, theme: "dracula", readOnly: true
        });

        // Пример для старта
        editorIn.setValue("curl -X POST https://api.test.com/users \\\n -H 'Content-Type: application/json' \\\n -d '{\"name\": \"Ivan\", \"role\": \"admin\"}'");

        // НОВЫЙ КОД: Перехват параметров из Task Tracker
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('url')) {
            $('#wm-url').val(urlParams.get('url'));
        }
    });

    // === ПАРСЕР cURL -> JSON ===
    function parseCurlToJson() {
        $('#in-error').hide();
        const curlStr = editorIn.getValue().trim();
        if (!curlStr) return;

        const cleanStr = curlStr.replace(/\\\n/g, ' ').replace(/\\\r\n/g, ' ');

        // Ищем тело (Body)
        const dataMatch = cleanStr.match(/(?:-d|--data|--data-raw)\s+(['"])([\s\S]*?)\1/i);
        if (dataMatch) {
            try {
                const jsonObj = JSON.parse(dataMatch[2]);
                editorJson.setValue(JSON.stringify(jsonObj, null, 4));
            } catch(e) {
                editorJson.setValue(dataMatch[2]);
            }
        } else {
            $('#in-error').text("Не найдено тело запроса (-d / --data) в команде cURL.").show();
        }

        // Пытаемся выцепить URL и Метод для WireMock
        const urlMatch = cleanStr.match(/['"]?(https?:\/\/[^\s'"]+)['"]?/);
        if (urlMatch) {
            try {
                const url = new URL(urlMatch[1]);
                $('#wm-url').val(url.pathname);
            } catch(e) {}
        }

        const methodMatch = cleanStr.match(/-X\s+([A-Z]+)/i);
        if (methodMatch) $('#wm-method').val(methodMatch[1].toUpperCase());
        else if (dataMatch) $('#wm-method').val('POST');
    }

    // === ПАРСЕР SQL RESULT -> JSON ===
    function parseSqlToJson() {
        $('#in-error').hide();
        const text = editorIn.getValue().trim();
        if (!text) return;

        // Примитивный парсер табличных данных (Tab-Separated)
        const lines = text.split('\n');
        if (lines.length < 2) {
            return $('#in-error').text("Ожидаются табличные данные (минимум 2 строки: заголовки и значения)").show();
        }

        const headers = lines[0].split('\t').map(h => h.trim());
        const result = [];

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const values = lines[i].split('\t');
            let obj = {};

            headers.forEach((header, index) => {
                let val = values[index] ? values[index].trim() : null;

                if (val === 'null' || val === 'NULL') val = null;
                else if (val === 'true') val = true;
                else if (val === 'false') val = false;
                else if (!isNaN(val) && val !== '') val = Number(val);

                obj[header] = val;
            });
            result.push(obj);
        }

        const finalJson = result.length === 1 ? result[0] : result;
        editorJson.setValue(JSON.stringify(finalJson, null, 4));
    }

    // === ГЕНЕРАТОР WIREMOCK STUB ===
    function generateWiremockStub() {
        $('#json-error').hide();
        const jsonText = editorJson.getValue().trim();

        let responseBody = {};
        if (jsonText) {
            try {
                responseBody = JSON.parse(jsonText);
            } catch(e) {
                return $('#json-error').text("Ошибка синтаксиса JSON в центральном окне: " + e.message).show();
            }
        }

        const url = $('#wm-url').val().trim() || '/api/test';
        const method = $('#wm-method').val();
        const status = parseInt($('#wm-status').val()) || 200;

        const stub = {
            "request": {
                "method": method,
                "urlPath": url
            },
            "response": {
                "status": status,
                "headers": {
                    "Content-Type": "application/json"
                },
                "jsonBody": responseBody
            }
        };

        editorOut.setValue(JSON.stringify(stub, null, 4));
        if(typeof showNotification === 'function') showNotification("WireMock заглушка сгенерирована!");
        else alert("WireMock заглушка сгенерирована!");
    }

    // === ИНТЕГРАЦИЯ: ПЕРЕДАЧА В SWAGGER ===
    function sendToSwagger() {
        const jsonText = editorJson.getValue().trim();
        if (!jsonText) return alert("Сначала получите JSON!");

        // Сохраняем во временное хранилище и переходим на страницу Swagger
        localStorage.setItem('swagger_temp_req', jsonText);
        window.location.href = 'swagger_generator.html?load_temp=true';
    }

    function copyResult() {
        navigator.clipboard.writeText(editorOut.getValue());
        if(typeof showNotification === 'function') showNotification("Скопировано!");
        else alert("Скопировано!");
    }
</script>
</body>
</html>
