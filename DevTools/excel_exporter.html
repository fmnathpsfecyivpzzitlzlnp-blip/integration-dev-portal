<!DOCTYPE html>
<html>
<head>
    <title>JSON to Excel Structure</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
        textarea { width: 100%; height: 70vh; font-family: monospace; font-size: 14px; box-sizing: border-box; margin-top: 10px; }
    </style>
</head>
<body>
<div class="main-content">
    <h2>Экспорт структуры JSON в Excel</h2>
    <p>Вставьте ваш JSON в поле ниже и нажмите кнопку, чтобы скачать `.xlsx` файл со структурой данных.</p>

    <button id="exportBtn" style="padding: 10px 15px; cursor: pointer; margin-bottom: 10px;">Скачать структуру в Excel</button>
    <div id="error-panel" style="display: none; padding: 10px; background: #ffebee; color: #c62828; border: 1px solid #c62828; margin-top: 10px;"></div>

    <textarea id="json-input" placeholder="Вставьте сюда ваш JSON..."></textarea>
</div>
<script src="libs/jquery-3.6.0.min.js"></script>
<script>
    $(function () {
        const errorPanel = $('#error-panel');

        $('#exportBtn').on('click', function() {
            errorPanel.hide();
            const jsonText = $('#json-input').val();
            if (!jsonText.trim()) {
                alert("Пожалуйста, вставьте JSON-данные.");
                return;
            }
            try {
                // Проверяем, что это валидный JSON, перед отправкой
                JSON.parse(jsonText);
            } catch (e) {
                alert("Ошибка: введенный текст не является валидным JSON.\n" + e.message);
                return;
            }

            var form = $('<form></form>').attr('action', '/api/export-to-excel').attr('method', 'post');
            form.append($('<input></input>').attr('type', 'hidden').attr('name', 'json').attr('value', jsonText));
            form.appendTo('body').submit().remove();
        });

        const exampleJson = `{
  "user_id": 123,
  "user_name": "exampleUser",
  "is_active": true,
  "courses": [
    { "course_id": "PROG101", "title": "Introduction to Programming" },
    { "course_id": "DATA202", "title": "Data Structures" }
  ]
}`;
        $('#json-input').val(exampleJson);
    });
</script>

</body>
</html>
