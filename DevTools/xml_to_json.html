<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-i18n="x2j_page_title">Конвертер XML в JSON</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="libs/codemirror.min.css">
    <link rel="stylesheet" href="libs/dracula.min.css">
    <script src="libs/jquery-3.6.0.min.js"></script>
    <script src="libs/codemirror.min.js"></script>
    <script src="libs/xml.min.js"></script>
    <script src="libs/javascript.min.js"></script>
    <script src="utils.js"></script>

    <style>
        /* === ПЕРЕМЕННЫЕ ДЛЯ ТЕМНОЙ ТЕМЫ === */
        :root {
            --bg-main: #f4f7f9;
            --bg-card: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --btn-sec-bg: #e2e8f0;
            --btn-sec-hover: #cbd5e1;
        }

        body.dark-theme {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --btn-sec-bg: #334155;
            --btn-sec-hover: #475569;
        }

        /* === БРОНЕБОЙНАЯ ИЗОЛЯЦИЯ ОТ style.css === */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            height: 100vh !important;
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
        }

        body {
            background: var(--bg-main) !important;
            font-family: 'Inter', 'Segoe UI', sans-serif !important;
            color: var(--text-main) !important;
            transition: background 0.3s, color 0.3s;
            padding: 20px !important;
            box-sizing: border-box !important;
        }

        .generator-page-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .btn {
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn.secondary { background: var(--btn-sec-bg); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn.secondary:hover { background: var(--btn-sec-hover); }
        .btn.primary { background: #3b82f6; color: white; }
        .btn.primary:hover { background: #2563eb; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .generator-columns-container {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        .generator-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .generator-panel label {
            font-weight: 600;
            margin-bottom: 8px;
            display: inline-block;
            color: var(--text-main);
            transition: color 0.3s;
        }

        /* Обертка для редактора */
        .editor-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            background: var(--bg-card);
            transition: 0.3s;
        }

        /* Сам редактор */
        .CodeMirror {
            height: 100% !important;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            background: var(--input-bg);
            color: var(--text-main);
            transition: 0.3s;
        }

        /* Класс для красной подсветки строки с ошибкой */
        .error-line-bg {
            background-color: rgba(220, 38, 38, 0.2) !important;
        }

        #error-panel {
            display: none;
            padding: 12px 15px;
            background: rgba(220, 38, 38, 0.1);
            color: #ef4444;
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Consolas', monospace;
            white-space: pre-wrap;
            flex-shrink: 0;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>
<div class="generator-page-container">
    <div class="header-controls">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button onclick="window.location.href='index.html'" class="btn secondary" data-i18n="btn_home">🏠 Домой</button>
            <h2 style="margin: 0; border: none; color: var(--text-main);" data-i18n="x2j_title">Конвертер XML в JSON</h2>
        </div>
        <div class="generator-controls" style="display: flex; gap: 10px;">
            <button id="clearBtn" class="btn secondary" data-i18n="btn_clear">🧹 Очистить</button>
            <button id="btn-convert" class="btn primary" style="background: #10b981; border-color: #10b981;" data-i18n="x2j_btn_convert">🚀 Конвертировать</button>
        </div>
    </div>

    <div id="error-panel"></div>

    <div class="generator-columns-container">
        <div class="generator-panel">
            <label for="input-area" data-i18n="x2j_lbl_in">Входной XML:</label>
            <div class="editor-wrapper">
                <textarea id="input-area"></textarea>
            </div>
        </div>
        <div class="generator-panel">
            <label for="output-area" data-i18n="x2j_lbl_out">Результат в JSON:</label>
            <div class="editor-wrapper">
                <textarea id="output-area"></textarea>
            </div>
        </div>
    </div>
</div>

<script>
    $(function () {
        if(typeof initLocalization === 'function') initLocalization();
        const isDark = localStorage.getItem('global_dark_theme') === 'true';
        if(typeof applyTheme === 'function') applyTheme(isDark);

        const errorPanel = $('#error-panel');
        let errorLineHandle = null;
        const cmTheme = isDark ? "dracula" : "default";

        // 1. Инициализация CodeMirror для левого поля (входной XML)
        const editorIn = CodeMirror.fromTextArea(document.getElementById('input-area'), {
            mode: "xml",
            lineNumbers: true,      // Нумерация строк
            matchBrackets: true,    // Подсветка парных тегов/скобок
            theme: cmTheme,
            lineWrapping: true
        });

        // 2. Инициализация CodeMirror для правого поля (выходной JSON)
        const editorOut = CodeMirror.fromTextArea(document.getElementById('output-area'), {
            mode: "application/json",
            lineNumbers: true,
            matchBrackets: true,
            theme: cmTheme,
            lineWrapping: true,
            readOnly: true          // Запрет редактирования
        });

        window.addEventListener('themeChanged', function(e) {
            const newCmTheme = e.detail.isDark ? 'dracula' : 'default';
            editorIn.setOption('theme', newCmTheme);
            editorOut.setOption('theme', newCmTheme);
        });

        // 3. Восстановление из памяти браузера
        const savedXml = localStorage.getItem('xml_to_json_input');
        if (savedXml) {
            editorIn.setValue(savedXml);
        } else {
            const exampleXml = '<?xml version="1.0" encoding="UTF-8"?>\n<Request>\n  <ClientInfo>\n    <INN>1234567890</INN>\n  </ClientInfo>\n</Request>';
            editorIn.setValue(exampleXml);
        }

        // 4. Автосохранение и сброс ошибок при редактировании
        editorIn.on('change', function() {
            localStorage.setItem('xml_to_json_input', editorIn.getValue());

            // Убираем красную подсветку, если пользователь начал вносить изменения
            if (errorLineHandle) {
                editorIn.removeLineClass(errorLineHandle, 'background', 'error-line-bg');
                errorLineHandle = null;
            }
            errorPanel.hide();
        });

        // 5. Очистка полей
        $('#clearBtn').on('click', function() {
            const msgConfirm = typeof window.t === 'function' ? window.t('x2j_conf_clear', 'Очистить поле ввода?') : 'Очистить поле ввода?';
            if (confirm(msgConfirm)) {
                editorIn.setValue('');
                editorOut.setValue('');
                localStorage.removeItem('xml_to_json_input');
            }
        });

        // 6. Конвертация с перехватом ошибок синтаксиса
        $('#btn-convert').on('click', function() {
            errorPanel.hide();
            if (errorLineHandle) {
                editorIn.removeLineClass(errorLineHandle, 'background', 'error-line-bg');
                errorLineHandle = null;
            }

            const inputText = editorIn.getValue();
            if (!inputText.trim()) {
                const msgEmpty = typeof window.t === 'function' ? window.t('x2j_err_empty', 'Пожалуйста, вставьте XML.') : 'Пожалуйста, вставьте XML.';
                alert(msgEmpty);
                return;
            }

            // ШАГ А: Строгая валидация XML перед отправкой через браузерный DOMParser
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(inputText, "text/xml");
            const errorNode = xmlDoc.querySelector("parsererror");

            if (errorNode) {
                const errorText = errorNode.textContent;
                // Пытаемся поймать номер строки с ошибкой
                const match = errorText.match(/line\s+(\d+)/i) || errorText.match(/строка\s+(\d+)/i) || errorText.match(/line number (\d+)/i);

                if (match) {
                    const lineNum = parseInt(match[1], 10);
                    // Подсвечиваем сломанную строку
                    errorLineHandle = editorIn.addLineClass(lineNum - 1, 'background', 'error-line-bg');
                    // Скроллим к ней
                    editorIn.scrollIntoView({line: lineNum - 1, ch: 0}, 60);
                }

                const msgParseErr = typeof window.t === 'function' ? window.t('x2j_err_parse', '❌ Ошибка синтаксиса XML:\n') : '❌ Ошибка синтаксиса XML:\n';
                errorPanel.text(msgParseErr + errorText).show();
                return; // Прерываем отправку!
            }

            // ШАГ Б: Отправка правильного XML на сервер
            const btn = $(this);
            const originalText = btn.text();

            const msgConverting = typeof window.t === 'function' ? window.t('x2j_msg_converting', '⏳ Конвертация...') : '⏳ Конвертация...';
            const msgProcessing = typeof window.t === 'function' ? window.t('x2j_msg_processing', 'Обработка...') : 'Обработка...';

            btn.text(msgConverting).prop('disabled', true);
            editorOut.setValue(msgProcessing);

            $.ajax({
                url: '/api/convert',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ text: inputText, from: 'xml', to: 'json' }),
                success: (convertedText) => {
                    // Пытаемся красиво отформатировать JSON, если сервер вернул "сжатый" текст
                    try {
                        const jsonObj = JSON.parse(convertedText);
                        editorOut.setValue(JSON.stringify(jsonObj, null, 4));
                    } catch(e) {
                        editorOut.setValue(convertedText);
                    }
                },
                error: (xhr) => {
                    const msg = xhr.responseJSON ? xhr.responseJSON.message : xhr.responseText;
                    const msgSrvErr = typeof window.t === 'function' ? window.t('x2j_err_server', '⚠️ Ошибка конвертации на сервере:\n') : '⚠️ Ошибка конвертации на сервере:\n';
                    errorPanel.text(msgSrvErr + msg).show();
                    editorOut.setValue('');
                },
                complete: () => {
                    btn.text(originalText).prop('disabled', false);
                }
            });
        });
    });

    function escapeHtml(text) {
        if (!text) return "";
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
