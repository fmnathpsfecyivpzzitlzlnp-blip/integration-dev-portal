<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-i18n="loc_page_title">Глобальная локализация</title>

    <script src="libs/jquery-3.6.0.min.js"></script>
    <script src="utils.js"></script>

    <!-- CodeMirror для редактора локалей -->
    <link rel="stylesheet" href="libs/codemirror.min.css">
    <link rel="stylesheet" href="libs/dracula.min.css">
    <script src="libs/codemirror.min.js"></script>
    <script src="libs/javascript.min.js"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --bg-main: #f4f7f9;
            --bg-card: #ffffff;
            --bg-header: #f8fafc;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
        }

        body.dark-theme {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-header: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        html, body { margin: 0 !important; padding: 0 !important; height: 100vh !important; display: flex !important; flex-direction: column !important; overflow: hidden !important; }

        body {
            background: var(--bg-main) !important;
            padding: 20px !important;
            font-family: 'Inter', 'Segoe UI', sans-serif !important;
            color: var(--text-main) !important;
            transition: background 0.3s, color 0.3s;
            box-sizing: border-box !important;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .header h2 { color: var(--text-main); margin: 0; }
        .header p { color: var(--text-muted); margin: 2px 0 0 0; font-size: 12px; }

        .workspace { flex: 1; display: flex; flex-direction: column; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); overflow: hidden; transition: 0.3s; }

        .panel-head { background: var(--bg-header); padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-weight: 600; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; transition: 0.3s; flex-wrap: wrap; gap: 10px; }

        .CodeMirror { flex: 1; font-family: 'Consolas', monospace; font-size: 13px; height: 100% !important; background: var(--input-bg); color: var(--text-main); }

        .btn { padding: 8px 15px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; outline: none; }
        .btn.primary { background: #3b82f6; color: white; }
        .btn.primary:hover { background: #2563eb; }
        .btn.success { background: #10b981; color: white; }
        .btn.success:hover { background: #059669; }
        .btn.warning { background: #f59e0b; color: white; }
        .btn.warning:hover { background: #d97706; }
        .btn.danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .btn.danger:hover { background: #ef4444; color: white; }
        .btn.secondary { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn.secondary:hover { filter: brightness(0.95); }

        select.btn { appearance: none; padding-right: 30px; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 10px auto; }

        /* Модальные окна */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:10000; justify-content:center; align-items:center; backdrop-filter: blur(2px); }
        .modal-content { background: var(--bg-card); color: var(--text-main); padding: 25px; border-radius: 8px; width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; border: 1px solid var(--border-color); }
        .modal-title { margin-top: 0; font-size: 18px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px; }
        .close-modal { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 24px; color: var(--text-muted); line-height: 1; }
        .close-modal:hover { color: #ef4444; }

        .radio-label { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 15px; cursor: pointer; font-size: 13px; color: var(--text-main); }
        .radio-label input { margin-top: 2px; }

        #toast { position:fixed; bottom:20px; right:20px; padding:12px 24px; background:#10b981; color:#fff; border-radius:6px; font-weight:bold; display:none; z-index:9999; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="header">
    <div style="display: flex; align-items: center; gap: 15px;">
        <button onclick="window.location.href='index.html'" class="btn secondary" data-i18n="btn_home">🏠 Домой</button>
        <div>
            <h2 data-i18n="loc_title_isolated">🌐 Глобальная локализация</h2>
            <p data-i18n="loc_subtitle_isolated">Управление переводами интерфейса. Каждый язык сохраняется в БД независимо.</p>
        </div>
    </div>
</div>

<div class="workspace">
    <div class="panel-head">
        <div style="display: flex; gap: 10px; align-items: center;">
            <span style="font-size: 13px; color: var(--text-muted);" data-i18n="loc_lbl_lang">Язык:</span>
            <select id="lang-selector" class="btn secondary" onchange="switchLanguage(this.value)"></select>
            <button class="btn secondary" onclick="addNewLanguage()" data-i18n="loc_btn_add">+ Добавить язык</button>
            <button class="btn danger" onclick="deleteLanguage()" data-i18n="loc_btn_del">🗑 Удалить язык</button>

            <div style="border-left: 1px solid var(--border-color); height: 20px; margin: 0 5px;"></div>

            <button class="btn secondary" onclick="document.getElementById('file-upload').click()" data-i18n="loc_btn_upload">📥 Загрузить (Дополнить)</button>
            <input type="file" id="file-upload" style="display:none;" accept=".json" onchange="handleFileUpload(event)">
        </div>
        <div style="display: flex; gap: 10px;">
            <button id="btn-reset-default" class="btn warning" onclick="resetToDefault()">🔄 Заводской сброс</button>
            <button class="btn success" onclick="saveDictionaryToDB()" data-i18n="btn_save_dict">💾 Сохранить язык в БД</button>
        </div>
    </div>
    <div style="padding: 10px 20px; background: rgba(59, 130, 246, 0.05); border-bottom: 1px solid var(--border-color); font-size: 12px; color: var(--text-muted);">
        <span data-i18n="loc_hint_p1">В редакторе отображаются ключи только для</span>
        <b id="current-lang-lbl" style="color: var(--primary);">выбранного языка</b>.
        <span data-i18n="loc_hint_p2">Сохранение применяется</span>
        <b data-i18n="loc_hint_p3">только к текущей вкладке</b>.
    </div>
    <textarea id="dict-editor"></textarea>
</div>

<!-- Модальное окно режимов объединения -->
<div id="merge-modal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="$('#merge-modal').fadeOut(150)">&times;</span>
        <h2 class="modal-title">Режим загрузки словаря</h2>

        <label class="radio-label">
            <input type="radio" name="merge_mode" value="merge_all" checked>
            <div>
                <b>Обновить и добавить</b><br>
                <span style="color: var(--text-muted); font-size: 11px;">Добавит новые ключи и обновит тексты существующих ключей. Старые ключи удалены не будут.</span>
            </div>
        </label>

        <label class="radio-label">
            <input type="radio" name="merge_mode" value="merge_new_only">
            <div>
                <b>Только добавить новые</b><br>
                <span style="color: var(--text-muted); font-size: 11px;">Безопасное расширение: текущие переводы не изменятся, добавятся только недостающие ключи.</span>
            </div>
        </label>

        <label class="radio-label">
            <input type="radio" name="merge_mode" value="overwrite">
            <div>
                <b style="color: #ef4444;">Перезаписать полностью</b><br>
                <span style="color: var(--text-muted); font-size: 11px;">Словарь будет полностью заменен файлом. Все старые ключи, которых нет в файле, будут удалены!</span>
            </div>
        </label>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:25px;">
            <button class="btn secondary" onclick="$('#merge-modal').fadeOut(150)">Отмена</button>
            <button class="btn primary" onclick="executeMerge()">Выполнить</button>
        </div>
    </div>
</div>

<div id="toast"></div>

    let currentLang = 'ru';
    let availableLangs = [];
    let dictEditor;
    let pendingMergeJson = null;

    $(function() {
        if(typeof initLocalization === 'function') initLocalization();
        const isDark = localStorage.getItem('global_dark_theme') === 'true';
        if(typeof applyTheme === 'function') applyTheme(isDark);

        dictEditor = CodeMirror.fromTextArea(document.getElementById('dict-editor'), {
            mode: "application/json",
            lineNumbers: true,
            matchBrackets: true,
            theme: isDark ? "dracula" : "default"
        });

        window.addEventListener('themeChanged', function(e) {
            dictEditor.setOption('theme', e.detail.isDark ? 'dracula' : 'default');
        });

        // Запускаем процесс: сначала список языков, потом данные текущего
        loadLanguagesList();
    });

    function showToast(msg) {
        const toast = $('#toast');
        toast.text(msg).fadeIn(200);
        setTimeout(() => toast.fadeOut(300), 2000);
    }

    // 1. Получаем список доступных языков из БД
    function loadLanguagesList() {
        $.get('/api/locale?list=true', function(langs) {
            availableLangs = langs;
            if(!availableLangs || availableLangs.length === 0) {
                availableLangs = ['ru', 'en']; // Fallback
            }
            renderLangSelector();

            if (!availableLangs.includes(currentLang)) {
                currentLang = availableLangs[0];
            }
            loadLanguageData(currentLang);
        }).fail(function() {
            availableLangs = ['ru'];
            renderLangSelector();
            loadLanguageData(currentLang);
        });
    }

    // 2. Получаем данные конкретного языка
    function loadLanguageData(lang) {
        $.get('/api/locale?lang=' + lang, function(data) {
            let dict = typeof data === 'string' ? JSON.parse(data) : data;

            // Если пришел пустой объект, пробуем подставить дефолтный (для первого запуска)
            if (Object.keys(dict).length === 0 && DEFAULT_DICTIONARY[lang]) {
                dict = DEFAULT_DICTIONARY[lang];
            }

            $('#lang-selector').val(lang);
            $('#current-lang-lbl').text(lang.toUpperCase());
            updateResetButtonLabel(lang);
            dictEditor.setValue(JSON.stringify(dict, null, 4));
        }).fail(function() {
            let dict = DEFAULT_DICTIONARY[lang] || {};
            updateResetButtonLabel(lang);
            dictEditor.setValue(JSON.stringify(dict, null, 4));
        });
    }

    function renderLangSelector() {
        const sel = $('#lang-selector').empty();
        availableLangs.forEach(k => {
            sel.append(`<option value="${k}">${k.toUpperCase()}</option>`);
        });
        sel.val(currentLang);
    }

    window.switchLanguage = function(newLang) {
        if (currentLang === newLang) return;
        currentLang = newLang;
        loadLanguageData(newLang);
    }

    function updateResetButtonLabel(lang) {
        $('#btn-reset-default').text('🔄 Заводской сброс (' + lang.toUpperCase() + ')');
    }

    window.addNewLanguage = function() {
        const code = prompt("Введите код нового языка (например, 'es', 'de', 'fr'):");
        if (!code || code.trim() === '') return;
        const langCode = code.trim().toLowerCase();

        if (availableLangs.includes(langCode)) {
            alert("❌ Этот язык уже существует!");
            return;
        }

        availableLangs.push(langCode);
        renderLangSelector();

        // Переключаемся на новый язык, оставляя в редакторе текущий JSON (как болванку)
        currentLang = langCode;
        $('#lang-selector').val(currentLang);
        $('#current-lang-lbl').text(currentLang.toUpperCase());
        updateResetButtonLabel(currentLang);
        showToast(`Язык ${langCode.toUpperCase()} создан! Отредактируйте JSON и нажмите "Сохранить в БД".`);
    }

    window.deleteLanguage = function() {
        if (availableLangs.length <= 1) {
            alert("❌ Нельзя удалить последний язык в системе!");
            return;
        }

        if (confirm(`Вы уверены, что хотите НАВСЕГДА удалить язык [${currentLang.toUpperCase()}] из БД?`)) {
            $.ajax({
                url: '/api/locale',
                type: 'DELETE',
                contentType: 'application/json',
                data: JSON.stringify({ lang: currentLang }),
                success: function() {
                    showToast(`Язык ${currentLang.toUpperCase()} удален.`);
                    loadLanguagesList(); // Перезагружаем список
                },
                error: function(xhr) {
                    alert("Ошибка удаления: " + xhr.responseText);
                }
            });
        }
    }

    // === ЛОГИКА ОБЪЕДИНЕНИЯ СЛОВАРЕЙ (MERGE) ===
    window.handleFileUpload = function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                pendingMergeJson = JSON.parse(e.target.result);
                $('#merge-modal').css('display', 'flex').hide().fadeIn(200);
            } catch(err) {
                alert("❌ Ошибка чтения файла! Убедитесь, что это корректный JSON.");
            }
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    window.executeMerge = function() {
        const mode = $('input[name="merge_mode"]:checked').val();
        let currentDict = {};

        try {
            currentDict = JSON.parse(dictEditor.getValue());
        } catch(e) {
            currentDict = {}; // Если в редакторе была ошибка синтаксиса, начинаем с нуля
        }

        if (mode === 'overwrite') {
            const total = Object.keys(pendingMergeJson).length;
            dictEditor.setValue(JSON.stringify(pendingMergeJson, null, 4));
            alert(`⚠️ Полная перезапись выполнена.\nЗагружено ключей: ${total}\n\nНе забудьте нажать "Сохранить язык в БД"!`);
        } else {
            let added = 0;
            let updated = 0;
            let skipped = 0;

            for (let key in pendingMergeJson) {
                if (!(key in currentDict)) {
                    // Ключа нет - добавляем
                    currentDict[key] = pendingMergeJson[key];
                    added++;
                } else if (currentDict[key] !== pendingMergeJson[key]) {
                    // Ключ есть, но значение отличается
                    if (mode === 'merge_all') {
                        currentDict[key] = pendingMergeJson[key];
                        updated++;
                    } else {
                        // Если режим "только новые", пропускаем обновление
                        skipped++;
                    }
                }
            }

            dictEditor.setValue(JSON.stringify(currentDict, null, 4));

            alert(`📊 Статистика объединения:\n\n➕ Добавлено новых ключей: ${added}\n🔄 Обновлено существующих: ${updated}\n⏭ Пропущено: ${skipped}\n\n✅ Итого ключей в словаре: ${Object.keys(currentDict).length}\n\nНе забудьте нажать "Сохранить язык в БД"!`);
        }

        $('#merge-modal').fadeOut(150);
        pendingMergeJson = null;
    }

    window.resetToDefault = function() {
        if (confirm(`ВНИМАНИЕ! Это заменит текущий текст в редакторе на базовый (заводской) словарь для языка [${currentLang.toUpperCase()}]. Вы потеряете все ручные правки.\nПродолжить?`)) {
            // Берем либо дефолтный словарь для текущего языка, либо болванку английского (если язык совсем кастомный)
            let dict = DEFAULT_DICTIONARY[currentLang] || DEFAULT_DICTIONARY["en"];
            dictEditor.setValue(JSON.stringify(dict, null, 4));
            showToast("Словарь восстановлен в редакторе. Не забудьте нажать 'Сохранить в БД'!");
        }
    }

    window.saveDictionaryToDB = function() {
        let jsonToSave;
        try {
            jsonToSave = JSON.parse(dictEditor.getValue());
        } catch(e) {
            alert("❌ Ошибка! Невалидный JSON. Проверьте синтаксис в редакторе.");
            return;
        }

        $.ajax({
            url: '/api/locale',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ lang: currentLang, data: jsonToSave }),
            success: function() {
                showToast(`✅ Словарь [${currentLang.toUpperCase()}] успешно сохранен!`);

                // ВРЕМЕННЫЙ МОСТ: Обновляем старую структуру localStorage,
                // чтобы портал не сломался, пока мы не обновили utils.js
                try {
                    let oldPortalDict = JSON.parse(localStorage.getItem('portal_dictionary') || '{}');
                    oldPortalDict[currentLang] = jsonToSave;
                    localStorage.setItem('portal_dictionary', JSON.stringify(oldPortalDict));
                } catch(e) {}

                // Мгновенное обновление UI
                if (typeof applyLanguage === 'function') applyLanguage(localStorage.getItem('app_lang') || 'ru');
                if (window.parent && typeof window.parent.applyLanguage === 'function') {
                    window.parent.applyLanguage(localStorage.getItem('app_lang') || 'ru');
                }
            },
            error: function(xhr) {
                alert("Ошибка при сохранении: " + xhr.responseText);
            }
        });
    }
</script>
</body>
