<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Детали потока интеграции</title>
    <!-- Библиотека jQuery -->
    <script src="libs/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* === ЛОКАЛЬНЫЕ СТИЛИ === */
        body {
            background: #f4f7f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Шапка */
        .page-header {
            height: 60px;
            background: #2c3e50;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .back-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.25); }

        /* Визуализация потока (Стрелка) */
        .flow-visual {
            display: flex;
            align-items: center;
            gap: 20px;
            justify-content: center;
            background: white;
            padding: 15px;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }
        .flow-badge {
            font-size: 16px;
            font-weight: bold;
            color: #334155;
            padding: 8px 20px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* Основная рабочая область (Скролл) */
        .main-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .two-cols {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .system-card {
            flex: 1;
            min-width: 400px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .card-head {
            padding: 12px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            font-size: 14px;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Цветовое кодирование */
        .sender-head { border-top: 4px solid #10b981; }   /* Зеленый */
        .receiver-head { border-top: 4px solid #3b82f6; } /* Синий */

        .card-body { padding: 20px; }

        /* Элементы формы */
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 12px; color: #333; }

        select, input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            margin-bottom: 15px;
            box-sizing: border-box;
            font-size: 13px;
        }
        select:focus, input:focus, textarea:focus { outline: none; border-color: #3b82f6; }

        /* Текстовая область для кода/структур */
        .code-area {
            width: 100%;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            min-height: 250px;
            padding: 10px;
            resize: vertical;
            border: 1px solid #ccc;
            background: #fafafa;
            color: #333;
            border-radius: 4px;
            box-sizing: border-box;
            line-height: 1.5;
        }

        /* Footer Action Bar */
        .footer-bar {
            background: #fff;
            border-top: 1px solid #ccc;
            padding: 15px 30px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 30px;
            flex-shrink: 0;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            align-items: center;
            height: 100%;
        }

        /* Кнопки */
        button.save-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            display: flex; align-items: center; gap: 8px;
            transition: background 0.2s;
        }
        button.save-btn:hover { background: #15803d; }
        button.save-btn:disabled { background: #9ca3af; cursor: not-allowed; }

        button.mapper-btn {
            background: #ffffff;
            border: 2px solid #3b82f6;
            color: #3b82f6;
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.2s;
        }
        button.mapper-btn:hover { background: #eff6ff; border-color: #2563eb; color: #2563eb; }

        /* Кастомная кнопка загрузки файла */
        .file-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            cursor: pointer;
        }
        .file-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .upload-label {
            display: inline-block;
            background: #e2e8f0;
            color: #475569;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #cbd5e1;
            transition: 0.2s;
        }
        .upload-label:hover { background: #cbd5e1; }

    </style>
</head>
<body>

<!-- 1. HEADER -->
<div class="page-header">
    <button class="back-btn" onclick="goBack()">← Назад к списку потоков</button>
    <div style="font-size:16px; font-weight:600;">Конфигурация Потока Данных</div>
    <div style="font-size:12px; color:#ccc;">Task ID: <span id="tid" style="color:white;font-weight:bold;">...</span></div>
</div>

<!-- 2. FLOW VISUAL HEADER -->
<div class="flow-visual">
    <div style="margin-right: 30px;">
        <label style="margin-bottom: 5px;">Общий тип взаимодействия:</label>
        <select id="in_type" style="width: 250px; margin-bottom: 0;">
            <option value="sync">Синхронный (REST / SOAP)</option>
            <option value="async">Асинхронный (JMS / Kafka)</option>
            <option value="file">Файловый обмен (SFTP / S3)</option>
            <option value="db">База данных (ETL / JDBC)</option>
        </select>
    </div>

    <div style="display:flex; align-items:center; gap:15px;">
        <div class="flow-badge" id="disp_s">Sender</div>
        <div style="display:flex; flex-direction:column; align-items:center;">
            <span style="font-size:24px; color:#cbd5e1; line-height:1;">&rarr;</span>
        </div>
        <div class="flow-badge" id="disp_r">Receiver</div>
    </div>
</div>

<!-- 3. MAIN CONTENT -->
<div class="main-scroll-area">
    <div class="two-cols">

        <!-- ЛЕВАЯ КОЛОНКА: ОТПРАВИТЕЛЬ -->
        <div class="system-card sender-head">
            <div class="card-head">
                <span>📤 ОТПРАВИТЕЛЬ (Source)</span>
                <!-- File Upload -->
                <div class="file-btn-wrapper">
                    <span class="upload-label">📂 Загрузить файл</span>
                    <input type="file" onchange="loadFile(this, '#struct_in', '#fmt_in')">
                </div>
            </div>
            <div class="card-body">
                <div style="display:flex; gap:15px;">
                    <div style="flex:1">
                        <label>Протокол (Outbound)</label>
                        <select id="proto_in">
                            <option value="">-- Выберите --</option>
                            <optgroup label="Web Services">
                                <option value="REST">REST / HTTP</option>
                                <option value="SOAP">SOAP / XML</option>
                                <option value="GRAPHQL">GraphQL</option>
                            </optgroup>
                            <optgroup label="Messaging / Event">
                                <option value="KAFKA">Apache Kafka</option>
                                <option value="IBM_MQ">IBM MQ / JMS</option>
                                <option value="RABBIT">RabbitMQ</option>
                                <option value="ACTIVEMQ">ActiveMQ</option>
                            </optgroup>
                            <optgroup label="Data Storage">
                                <option value="POSTGRES">PostgreSQL</option>
                                <option value="ORACLE">Oracle DB</option>
                                <option value="MSSQL">MS SQL Server</option>
                                <option value="SFTP">SFTP / FTP</option>
                                <option value="S3">S3 Object Storage</option>
                            </optgroup>
                        </select>
                    </div>
                    <div style="flex:1">
                        <label>Формат данных</label>
                        <input type="text" id="fmt_in" placeholder="Авто (напр. JSON)">
                    </div>
                </div>

                <label>Структура данных (Payload / DDL):</label>
                <textarea id="struct_in" class="code-area" placeholder='Вставьте JSON пример, XML схему или SQL DDL...'></textarea>
                <div style="text-align:right; font-size:11px; color:#999; margin-top:4px;">*Загрузится в левую часть Маппера</div>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: ПОЛУЧАТЕЛЬ -->
        <div class="system-card receiver-head">
            <div class="card-head">
                <span>📥 ПОЛУЧАТЕЛЬ (Target)</span>
                <div class="file-btn-wrapper">
                    <span class="upload-label">📂 Загрузить файл</span>
                    <input type="file" onchange="loadFile(this, '#struct_out', '#fmt_out')">
                </div>
            </div>
            <div class="card-body">
                <div style="display:flex; gap:15px;">
                    <div style="flex:1">
                        <label>Протокол (Inbound)</label>
                        <select id="proto_out">
                            <option value="">-- Выберите --</option>
                            <optgroup label="Web Services">
                                <option value="REST">REST / HTTP</option>
                                <option value="SOAP">SOAP / XML</option>
                            </optgroup>
                            <optgroup label="Messaging">
                                <option value="KAFKA">Apache Kafka</option>
                                <option value="IBM_MQ">IBM MQ / JMS</option>
                            </optgroup>
                            <optgroup label="Data Storage">
                                <option value="POSTGRES">PostgreSQL</option>
                                <option value="ORACLE">Oracle DB</option>
                                <option value="SFTP">SFTP / FTP</option>
                            </optgroup>
                        </select>
                    </div>
                    <div style="flex:1">
                        <label>Формат данных</label>
                        <input type="text" id="fmt_out" placeholder="Авто (напр. JSON)">
                    </div>
                </div>

                <label>Целевая структура данных:</label>
                <textarea id="struct_out" class="code-area" placeholder='Вставьте ожидаемый JSON или структуру таблицы...'></textarea>
                <div style="text-align:right; font-size:11px; color:#999; margin-top:4px;">*Загрузится в правую часть Маппера</div>
            </div>
        </div>

    </div>
</div>

<!-- 4. FOOTER ACTIONS -->
<div class="footer-bar">
    <div style="flex:1;">
        <label style="margin-bottom:5px; display:block;">Техническое описание (Комментарии, триггеры, расписание):</label>
        <input type="text" id="desc" placeholder="Например: Поток запускается по таймеру каждые 10 минут..." style="margin:0; width:100%;">
    </div>

    <div class="action-btns">
        <!-- Открыть Маппер -->
        <button onclick="openMapper()" class="mapper-btn" title="Перейти к настройке связей полей">
            <span style="font-size:16px;">🔗</span> Открыть Маппер
        </button>

        <!-- Сохранить -->
        <button onclick="saveFlow()" id="btn-save" class="save-btn">
            <span style="font-size:16px;">💾</span> Сохранить
        </button>
    </div>
</div>

<script>
    // === INIT & PARAMS ===
    const p = new URLSearchParams(location.search);
    const TASK_ID = p.get('task_id');
    const FLOW_ORDER = p.get('flow_order');

    $(function(){
        // Проверка параметров
        if(!TASK_ID || !FLOW_ORDER) {
            $('body').html('<div style="padding:40px;text-align:center;color:#dc2626;"><h3>Ошибка: Неверная ссылка.</h3><p>Нет ID задачи или номера потока. Вернитесь к списку задач.</p></div>');
            return;
        }

        $('#tid').text(TASK_ID);
        loadFlowInfo();
        loadFlowDetails();
    });

    // === LOADING DATA ===

    function loadFlowInfo() {
        // Загружаем имена систем для заголовка
        $.get(`/api/flows?task_id=${TASK_ID}`, function(list) {
            if(list && list.length) {
                const idx = parseInt(FLOW_ORDER) - 1;
                if(list[idx]) {
                    $('#disp_s').text(list[idx].sender);
                    $('#disp_r').text(list[idx].receiver);
                } else {
                    $('#disp_s').text('Неизвестно');
                    $('#disp_r').text('Неизвестно');
                }
            }
        });
    }

    function loadFlowDetails() {
        $.get(`/api/flow-details?task_id=${TASK_ID}&flow_order=${FLOW_ORDER}`, function(d) {
            if(!d || !d.id) {
                console.log("Данных нет, форма чистая.");
                return;
            }

            // Заполняем поля формы данными из БД
            $('#in_type').val(d.connection_type);
            $('#desc').val(d.description);

            // SENDER
            $('#proto_in').val(d.protocol);
            $('#fmt_in').val(d.format);
            $('#struct_in').val(d.service_description); // Используем это поле для Source Struct

            // RECEIVER
            // Убедитесь, что ваш Server.groovy поддерживает новые колонки (protocol_out и т.д.)
            if(d.protocol_out) $('#proto_out').val(d.protocol_out);
            if(d.format_out) $('#fmt_out').val(d.format_out);
            if(d.target_description) $('#struct_out').val(d.target_description);
        });
    }

    // === SAVE ACTION ===

    function saveFlow() {
        const btn = $('#btn-save');
        const oldHtml = btn.html();
        btn.prop('disabled',true).text('Сохранение...');

        // 1. Собираем данные из формы
        const payload = {
            task_id: parseInt(TASK_ID),
            flow_order: parseInt(FLOW_ORDER),
            connection_type: $('#in_type').val(),
            description: $('#desc').val(),

            // Sender config
            protocol: $('#proto_in').val(),
            format: $('#fmt_in').val(),
            service_description: $('#struct_in').val(),

            // Receiver config
            protocol_out: $('#proto_out').val(),
            format_out: $('#fmt_out').val(),
            target_description: $('#struct_out').val()
        };

        // 2. ВАЖНЫЙ МОМЕНТ:
        // Поле 'file_path' используется Mapper.html для хранения координат связей (JSON).
        // Если мы просто сохраним payload выше, то поле 'file_path' на сервере затрется null-ом (если сервер делает полный UPDATE).
        // Поэтому, чтобы НЕ потерять нарисованный маппинг при сохранении настроек,
        // мы сначала спрашиваем у сервера "А что там сейчас в file_path?", и добавляем это в payload.

        $.get(`/api/flow-details?task_id=${TASK_ID}&flow_order=${FLOW_ORDER}`)
            .done(function(existingData) {
                // Если уже есть сохраненный маппинг, добавляем его в наш запрос сохранения
                if(existingData && existingData.file_path) {
                    payload.file_path = existingData.file_path;
                }

                // Теперь безопасно отправляем всё на сервер
                sendSaveRequest(payload, btn, oldHtml);
            })
            .fail(function() {
                // Если записи нет (первое сохранение), то маппинга тоже нет, просто сохраняем
                sendSaveRequest(payload, btn, oldHtml);
            });
    }

    function sendSaveRequest(payload, btn, oldHtml) {
        $.ajax({
            url: '/api/flow-details',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            success: function() {
                btn.html('✅ Сохранено');
                setTimeout(() => {
                    btn.html(oldHtml).prop('disabled', false);
                }, 1500);
            },
            error: function(xhr) {
                alert('Ошибка сохранения: ' + xhr.responseText);
                btn.html(oldHtml).prop('disabled', false);
            }
        });
    }

    // === MAPPER ===

    function openMapper() {
        // Сохраняем JSON-ы локально для быстрого подхвата маппером при открытии
        const src = $('#struct_in').val();
        const trg = $('#struct_out').val();

        localStorage.setItem('mapper_source', src || '{}');
        localStorage.setItem('mapper_target', trg || '{}');

        // Открываем маппер в новой вкладке, передавая параметры для работы с БД
        window.open(`mapper.html?task_id=${TASK_ID}&flow_order=${FLOW_ORDER}`, '_blank');
    }

    // === FILE LOADING UTILS ===

    window.loadFile = function(input, targetAreaId, fmtInputId) {
        const file = input.files[0];
        if (!file) return;

        // Пробуем угадать формат по расширению
        const ext = file.name.split('.').pop().toUpperCase();
        $(fmtInputId).val(ext);

        const reader = new FileReader();
        reader.onload = function(e) {
            let content = e.target.result;

            // Если это JSON, сделаем его красивым (pretty print)
            if (ext === 'JSON') {
                try {
                    const o = JSON.parse(content);
                    content = JSON.stringify(o, null, 4);
                } catch(err) {
                    // Если невалидный JSON, оставляем как текст
                    console.warn("JSON format error, inserting as text");
                }
            }

            $(targetAreaId).val(content);
        };
        reader.readAsText(file);

        // Сбрасываем input, чтобы можно было выбрать тот же файл снова
        input.value = '';
    };

    function goBack() {
        location.href = `service-org.html?id=${TASK_ID}`;
    }

</script>

</body>
</html>
