<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-i18n="fd_page_title">Детали потока интеграции</title>
    <script src="libs/jquery-3.6.0.min.js"></script>
    <script src="utils.js"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        /* === ПЕРЕМЕННЫЕ ДЛЯ ТЕМНОЙ ТЕМЫ === */
        :root {
            --bg-main: #f4f7f9;
            --bg-card: #ffffff;
            --bg-header: #2c3e50;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --card-head-bg: #f8fafc;
            --btn-sec-bg: #e2e8f0;
        }

        body.dark-theme {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-header: #0b1120;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --card-head-bg: #0f172a;
            --btn-sec-bg: #334155;
        }

        /* === БРОНЕБОЙНАЯ ИЗОЛЯЦИЯ ОТ style.css === */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            height: 100vh !important;
            overflow: hidden !important;
        }

        body {
            background: var(--bg-main) !important;
            display: flex !important;
            flex-direction: column !important;
            font-family: 'Inter', 'Segoe UI', sans-serif !important;
            color: var(--text-main) !important;
            transition: background 0.3s, color 0.3s;
            box-sizing: border-box !important;
        }

        /* Шапка */
        .page-header {
            height: 60px;
            background: var(--bg-header);
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }
        .back-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.25); }

        /* Визуализация потока (Стрелка) */
        .flow-visual {
            display: flex;
            align-items: center;
            gap: 20px;
            justify-content: center;
            background: var(--bg-card);
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            transition: 0.3s;
        }
        .flow-badge {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
            padding: 8px 20px;
            background: var(--card-head-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        /* Основная рабочая область (Скролл) */
        .main-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .two-cols {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .system-card {
            flex: 1;
            min-width: 400px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: 0.3s;
        }

        .card-head {
            padding: 12px 20px;
            background: var(--card-head-bg);
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            font-size: 14px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.3s;
        }

        /* Цветовое кодирование */
        .sender-head { border-top: 4px solid #10b981; }   /* Зеленый */
        .receiver-head { border-top: 4px solid #3b82f6; } /* Синий */

        .card-body { padding: 20px; }

        /* Элементы формы */
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 12px; color: var(--text-muted); transition: 0.3s; }

        select, input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 15px;
            box-sizing: border-box;
            font-size: 13px;
            background: var(--input-bg);
            color: var(--text-main);
            transition: 0.3s;
        }
        select:focus, input:focus, textarea:focus { outline: none; border-color: #3b82f6; }

        /* Текстовая область для кода/структур */
        .code-area {
            width: 100%;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            min-height: 250px;
            padding: 10px;
            resize: vertical;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            border-radius: 4px;
            box-sizing: border-box;
            line-height: 1.5;
            transition: 0.3s;
        }

        /* Footer Action Bar */
        .footer-bar {
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 30px;
            flex-shrink: 0;
            transition: 0.3s;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            align-items: center;
            height: 100%;
        }

        /* Кнопки */
        button.save-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            display: flex; align-items: center; gap: 8px;
            transition: background 0.2s;
        }
        button.save-btn:hover { background: #15803d; }
        button.save-btn:disabled { background: #9ca3af; cursor: not-allowed; }

        button.mapper-btn {
            background: transparent;
            border: 2px solid #3b82f6;
            color: #3b82f6;
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.2s;
        }
        button.mapper-btn:hover { background: rgba(59, 130, 246, 0.1); border-color: #2563eb; color: #2563eb; }

        /* Кастомная кнопка загрузки файла */
        .file-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            cursor: pointer;
        }
        .file-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .upload-label {
            display: inline-block;
            background: var(--btn-sec-bg);
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: 0.2s;
        }
        .upload-label:hover { filter: brightness(0.95); }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

<div class="page-header">
    <button class="back-btn" onclick="goBack()" data-i18n="fd_btn_back">← Назад к списку потоков</button>
    <div style="font-size:16px; font-weight:600;" data-i18n="fd_title">Конфигурация Потока Данных</div>
    <div style="font-size:12px; color:#ccc;">Task ID: <span id="tid" style="color:white;font-weight:bold;">...</span></div>
</div>

<div class="flow-visual">
    <div style="margin-right: 30px;">
        <label style="margin-bottom: 5px;" data-i18n="fd_lbl_type">Общий тип взаимодействия:</label>
        <select id="in_type" style="width: 250px; margin-bottom: 0;">
            <option value="sync" data-i18n="fd_opt_sync">Синхронный (REST / SOAP)</option>
            <option value="async" data-i18n="fd_opt_async">Асинхронный (JMS / Kafka)</option>
            <option value="file" data-i18n="fd_opt_file">Файловый обмен (SFTP / S3)</option>
            <option value="db" data-i18n="fd_opt_db">База данных (ETL / JDBC)</option>
        </select>
    </div>

    <div style="display:flex; align-items:center; gap:15px;">
        <div class="flow-badge" id="disp_s">Sender</div>
        <div style="display:flex; flex-direction:column; align-items:center;">
            <span style="font-size:24px; color:var(--border-color); line-height:1;">&rarr;</span>
        </div>
        <div class="flow-badge" id="disp_r">Receiver</div>
    </div>
</div>

<div class="main-scroll-area">
    <div class="two-cols">

        <div class="system-card sender-head">
            <div class="card-head">
                <span data-i18n="fd_lbl_sender">📤 ОТПРАВИТЕЛЬ (Source)</span>
                <div class="file-btn-wrapper">
                    <span class="upload-label" data-i18n="fd_btn_upload">📂 Загрузить файл</span>
                    <input type="file" onchange="loadFile(this, '#struct_in', '#fmt_in')">
                </div>
            </div>
            <div class="card-body">
                <div style="display:flex; gap:15px;">
                    <div style="flex:1">
                        <label data-i18n="fd_lbl_proto_out">Протокол (Outbound)</label>
                        <select id="proto_in">
                            <option value="" data-i18n="fd_opt_select">-- Выберите --</option>
                            <optgroup label="Web Services">
                                <option value="REST">REST / HTTP</option>
                                <option value="SOAP">SOAP / XML</option>
                                <option value="GRAPHQL">GraphQL</option>
                            </optgroup>
                            <optgroup label="Messaging / Event">
                                <option value="KAFKA">Apache Kafka</option>
                                <option value="IBM_MQ">IBM MQ / JMS</option>
                                <option value="RABBIT">RabbitMQ</option>
                                <option value="ACTIVEMQ">ActiveMQ</option>
                            </optgroup>
                            <optgroup label="Data Storage">
                                <option value="POSTGRES">PostgreSQL</option>
                                <option value="ORACLE">Oracle DB</option>
                                <option value="MSSQL">MS SQL Server</option>
                                <option value="SFTP">SFTP / FTP</option>
                                <option value="S3">S3 Object Storage</option>
                            </optgroup>
                        </select>
                    </div>
                    <div style="flex:1">
                        <label data-i18n="fd_lbl_fmt">Формат данных</label>
                        <select id="fmt_in">
                            <option value="JSON" selected>JSON</option>
                            <option value="XML">XML</option>
                            <option value="SOAP">SOAP</option>
                            <option value="Text">Text</option>
                            <option value="Binary">Binary</option>
                            <option value="Form-Data">Form-Data</option>
                        </select>
                    </div>
                </div>

                <label data-i18n="fd_lbl_struct_in">Структура данных (Payload / DDL):</label>
                <textarea id="struct_in" class="code-area" placeholder='Вставьте JSON пример, XML схему или SQL DDL...' data-i18n="fd_ph_struct_in"></textarea>
                <div style="text-align:right; font-size:11px; color:var(--text-muted); margin-top:4px;" data-i18n="fd_hint_in">*Загрузится в левую часть Маппера</div>
            </div>
        </div>

        <div class="system-card receiver-head">
            <div class="card-head">
                <span data-i18n="fd_lbl_receiver">📥 ПОЛУЧАТЕЛЬ (Target)</span>
                <div class="file-btn-wrapper">
                    <span class="upload-label" data-i18n="fd_btn_upload">📂 Загрузить файл</span>
                    <input type="file" onchange="loadFile(this, '#struct_out', '#fmt_out')">
                </div>
            </div>
            <div class="card-body">
                <div style="display:flex; gap:15px;">
                    <div style="flex:1">
                        <label data-i18n="fd_lbl_proto_in">Протокол (Inbound)</label>
                        <select id="proto_out">
                            <option value="" data-i18n="fd_opt_select">-- Выберите --</option>
                            <optgroup label="Web Services">
                                <option value="REST">REST / HTTP</option>
                                <option value="SOAP">SOAP / XML</option>
                            </optgroup>
                            <optgroup label="Messaging">
                                <option value="KAFKA">Apache Kafka</option>
                                <option value="IBM_MQ">IBM MQ / JMS</option>
                            </optgroup>
                            <optgroup label="Data Storage">
                                <option value="POSTGRES">PostgreSQL</option>
                                <option value="ORACLE">Oracle DB</option>
                                <option value="SFTP">SFTP / FTP</option>
                            </optgroup>
                        </select>
                    </div>
                    <div style="flex:1">
                        <label data-i18n="fd_lbl_fmt">Формат данных</label>
                        <select id="fmt_out">
                            <option value="JSON" selected>JSON</option>
                            <option value="XML">XML</option>
                            <option value="SOAP">SOAP</option>
                            <option value="Text">Text</option>
                            <option value="Binary">Binary</option>
                            <option value="Form-Data">Form-Data</option>
                        </select>
                    </div>
                </div>

                <label data-i18n="fd_lbl_struct_out">Целевая структура данных:</label>
                <textarea id="struct_out" class="code-area" placeholder='Вставьте ожидаемый JSON или структуру таблицы...' data-i18n="fd_ph_struct_out"></textarea>
                <div style="text-align:right; font-size:11px; color:var(--text-muted); margin-top:4px;" data-i18n="fd_hint_out">*Загрузится в правую часть Маппера</div>
            </div>
        </div>

    </div>
</div>

<div class="footer-bar">
    <div style="flex:1;">
        <label style="margin-bottom:5px; display:block;" data-i18n="fd_lbl_desc">Техническое описание (Комментарии, триггеры, расписание):</label>
        <input type="text" id="desc" placeholder="Например: Поток запускается по таймеру каждые 10 минут..." data-i18n="fd_ph_desc" style="margin:0; width:100%;">
    </div>

    <div class="action-btns">
        <button onclick="openMapper()" class="mapper-btn" title="Перейти к настройке связей полей">
            <span style="font-size:16px;">🔗</span> <span data-i18n="fd_btn_mapper">Открыть Маппер</span>
        </button>

        <button onclick="saveFlow()" id="btn-save" class="save-btn">
            <span style="font-size:16px;">💾</span> <span data-i18n="fd_btn_save">Сохранить</span>
        </button>
    </div>
</div>

<script>
    // Универсальная функция перевода
    function t(key, defaultStr) {
        try {
            const lang = localStorage.getItem('app_lang') || 'ru';
            const dictStr = localStorage.getItem('portal_dictionary');
            if (dictStr) {
                const dict = JSON.parse(dictStr)[lang];
                if (dict && dict[key]) return dict[key];
            }
        } catch(e) {}
        return defaultStr;
    }

    // === INIT & PARAMS ===
    const p = new URLSearchParams(location.search);
    const TASK_ID = p.get('task_id');
    const FLOW_ORDER = p.get('flow_order');

    $(function(){
        if(typeof initLocalization === 'function') initLocalization();
        const isDark = localStorage.getItem('global_dark_theme') === 'true';
        if(typeof applyTheme === 'function') applyTheme(isDark);

        if(!TASK_ID || !FLOW_ORDER) {
            $('body').html(`<div style="padding:40px;text-align:center;color:#dc2626;"><h3>${t('fd_err_invalid_link', 'Ошибка: Неверная ссылка.')}</h3><p>${t('fd_err_no_id', 'Нет ID задачи или номера потока. Вернитесь к списку задач.')}</p></div>`);
            return;
        }

        $('#tid').text(TASK_ID);
        loadFlowInfo();
        loadFlowDetails();
    });

    // === LOADING DATA ===

    function loadFlowInfo() {
        $.get(`/api/flows?task_id=${TASK_ID}`, function(list) {
            if(list && list.length) {
                const idx = parseInt(FLOW_ORDER) - 1;
                if(list[idx]) {
                    $('#disp_s').text(list[idx].sender);
                    $('#disp_r').text(list[idx].receiver);
                } else {
                    $('#disp_s').text(t('fd_unknown', 'Неизвестно'));
                    $('#disp_r').text(t('fd_unknown', 'Неизвестно'));
                }
            }
        });
    }

    function loadFlowDetails() {
        $.get(`/api/flow-details?task_id=${TASK_ID}&flow_order=${FLOW_ORDER}`, function(d) {
            if(!d || !d.id) return;

            $('#in_type').val(d.connection_type);
            $('#desc').val(d.description);

            // SENDER
            $('#proto_in').val(d.protocol);

            if(d.format) {
                if ($('#fmt_in').find(`option[value="${d.format}"]`).length === 0) $('#fmt_in').append(new Option(d.format, d.format));
                $('#fmt_in').val(d.format);
            }
            $('#struct_in').val(d.service_description);

            // RECEIVER
            if(d.protocol_out) $('#proto_out').val(d.protocol_out);

            if(d.format_out) {
                if ($('#fmt_out').find(`option[value="${d.format_out}"]`).length === 0) $('#fmt_out').append(new Option(d.format_out, d.format_out));
                $('#fmt_out').val(d.format_out);
            }
            if(d.target_description) $('#struct_out').val(d.target_description);
        });
    }

    // === SAVE ACTION ===

    function saveFlow() {
        const btn = $('#btn-save');
        const oldHtml = btn.html();
        btn.prop('disabled',true).html(`<span style="font-size:16px;">💾</span> ${t('fd_saving', 'Сохранение...')}`);

        const payload = {
            task_id: parseInt(TASK_ID),
            flow_order: parseInt(FLOW_ORDER),
            connection_type: $('#in_type').val(),
            description: $('#desc').val(),
            protocol: $('#proto_in').val(),
            format: $('#fmt_in').val(),
            service_description: $('#struct_in').val(),
            protocol_out: $('#proto_out').val(),
            format_out: $('#fmt_out').val(),
            target_description: $('#struct_out').val()
        };

        $.get(`/api/flow-details?task_id=${TASK_ID}&flow_order=${FLOW_ORDER}`)
            .done(function(existingData) {
                if(existingData && existingData.file_path) {
                    try { payload.mappings = JSON.parse(existingData.file_path); } catch(e) { payload.mappings = []; }
                } else {
                    payload.mappings = [];
                }
                sendSaveRequest(payload, btn, oldHtml);
            })
            .fail(function() {
                payload.mappings = [];
                sendSaveRequest(payload, btn, oldHtml);
            });
    }

    function sendSaveRequest(payload, btn, oldHtml) {
        $.ajax({
            url: '/api/flow-details',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            success: function() {
                btn.html(`✅ ${t('fd_saved', 'Сохранено')}`);
                setTimeout(() => {
                    btn.html(oldHtml).prop('disabled', false);
                }, 1500);
            },
            error: function(xhr) {
                alert(t('fd_err_save', 'Ошибка сохранения: ') + xhr.responseText);
                btn.html(oldHtml).prop('disabled', false);
            }
        });
    }

    // === MAPPER ===

    function openMapper() {
        const src = $('#struct_in').val();
        const trg = $('#struct_out').val();

        localStorage.setItem('mapper_source', src || '{}');
        localStorage.setItem('mapper_target', trg || '{}');

        window.open(`mapper.html?task_id=${TASK_ID}&flow_order=${FLOW_ORDER}`, '_blank');
    }

    // === FILE LOADING UTILS ===

    window.loadFile = function(input, targetAreaId, fmtInputId) {
        const file = input.files[0];
        if (!file) return;

        const ext = file.name.split('.').pop().toUpperCase();

        if ($(fmtInputId).find(`option[value="${ext}"]`).length === 0) {
            $(fmtInputId).append(new Option(ext, ext));
        }
        $(fmtInputId).val(ext);

        const reader = new FileReader();
        reader.onload = function(e) {
            let content = e.target.result;

            if (ext === 'JSON') {
                try {
                    const o = JSON.parse(content);
                    content = JSON.stringify(o, null, 4);
                } catch(err) {
                    console.warn("JSON format error, inserting as text");
                }
            }

            $(targetAreaId).val(content);
        };
        reader.readAsText(file);
        input.value = '';
    };

    function goBack() {
        location.href = `service-org.html?id=${TASK_ID}`;
    }

    function escapeHtml(text) {
        if (!text) return "";
        return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
