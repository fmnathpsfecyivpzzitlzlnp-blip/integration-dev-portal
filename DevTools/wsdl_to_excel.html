<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-i18n="w2e_page_title">WSDL to Excel Structure</title>

    <script src="libs/jquery-3.6.0.min.js"></script>
    <script src="utils.js"></script>

    <link rel="stylesheet" href="libs/codemirror.min.css">
    <link rel="stylesheet" href="libs/dracula.min.css">
    <script src="libs/codemirror.min.js"></script>
    <script src="libs/xml.min.js"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        /* === ПЕРЕМЕННЫЕ ДЛЯ ТЕМНОЙ ТЕМЫ === */
        :root {
            --bg-main: #f4f7f9;
            --bg-card: #ffffff;
            --bg-header: #f8fafc;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --btn-sec-bg: #e2e8f0;
            --btn-sec-hover: #cbd5e1;
        }

        body.dark-theme {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-header: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --btn-sec-bg: #334155;
            --btn-sec-hover: #475569;
        }

        /* === БРОНЕБОЙНАЯ ИЗОЛЯЦИЯ ОТ style.css === */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            height: 100vh !important;
            overflow: hidden !important;
        }

        body {
            background: var(--bg-main) !important;
            padding: 20px !important;
            font-family: 'Inter', 'Segoe UI', sans-serif !important;
            display: flex !important;
            flex-direction: column !important;
            box-sizing: border-box !important;
            color: var(--text-main) !important;
            transition: background 0.3s, color 0.3s;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .header h2 { color: var(--text-main); transition: 0.3s; margin: 0; font-size: 22px; }
        .header p { color: var(--text-muted); transition: 0.3s; margin: 4px 0 0 0; font-size: 12px; max-width: 700px; line-height: 1.4; }

        .btn { padding: 8px 15px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn.primary { background: #3b82f6; color: white; }
        .btn.primary:hover { background: #2563eb; }
        .btn.secondary { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn.secondary:hover { filter: brightness(0.95); }

        .workspace {
            flex: 1; display: flex; flex-direction: column; background: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            overflow: hidden; transition: background 0.3s, border-color 0.3s; min-height: 0;
        }

        .panel-head {
            background: var(--bg-header); padding: 12px 15px; border-bottom: 1px solid var(--border-color);
            font-weight: 600; color: var(--text-main); display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; transition: background 0.3s, border-color 0.3s, color 0.3s;
        }

        /* CodeMirror на всю высоту */
        .CodeMirror { flex: 1; font-family: 'Consolas', monospace; font-size: 13px; height: 100% !important; background: var(--input-bg); color: var(--text-main); border-top: none; }

        /* Блок ошибок */
        .error-box { display: none; padding: 12px 15px; background: rgba(220, 38, 38, 0.1); color: #ef4444; font-family: 'Consolas', monospace; font-size: 13px; border-bottom: 1px solid rgba(220, 38, 38, 0.3); word-break: break-all; }
        .error-line-bg { background-color: rgba(220, 38, 38, 0.2) !important; }

        /* Скроллбары */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

<div class="header">
    <div style="display: flex; align-items: center; gap: 15px;">
        <button onclick="window.location.href='index.html'" class="btn secondary" data-i18n="btn_home">🏠 Домой</button>
        <div>
            <h2 data-i18n="w2e_title">Экспорт структуры WSDL в Excel</h2>
            <p data-i18n="w2e_desc">Вставьте ваш код WSDL (или XSD схемы) в поле ниже и нажмите кнопку. Система извлечет все структуры (ComplexTypes), поля, типы данных, кардинальность и документацию!</p>
        </div>
    </div>
    <div>
        <button class="btn primary" id="exportBtn" style="background: #8b5cf6; border-color: #8b5cf6;" data-i18n="w2e_btn_export">📥 Скачать структуру (Excel)</button>
    </div>
</div>

<div class="workspace">
    <div class="panel-head">
        <span data-i18n="w2e_lbl_editor">WSDL / XSD Payload</span>
    </div>
    <div id="error-panel" class="error-box"></div>
    <textarea id="xml-input"></textarea>
</div>

<script>
    let editor;
    let errorLineHandle = null;

    $(function () {
        if(typeof initLocalization === 'function') initLocalization();
        const isDark = localStorage.getItem('global_dark_theme') === 'true';
        if(typeof applyTheme === 'function') applyTheme(isDark);

        const cmTheme = isDark ? "dracula" : "default";

        editor = CodeMirror.fromTextArea(document.getElementById('xml-input'), {
            mode: "xml",
            lineNumbers: true,
            matchBrackets: true,
            theme: cmTheme
        });

        window.addEventListener('themeChanged', function(e) {
            editor.setOption('theme', e.detail.isDark ? 'dracula' : 'default');
        });

        editor.on('change', clearError);

        const exampleWsdl = `<?xml version="1.0" encoding="UTF-8"?>
<wsdl:definitions xmlns:wsdl="http://schemas.xmlsoap.org/wsdl/">
    <wsdl:types>
      <xsd:schema xmlns:xsd="http://www.w3.org/2001/XMLSchema">
         <xsd:complexType name="dt_ForceUpdateKpiFactValues_RQ">
            <xsd:annotation>
               <xsd:documentation xml:lang="RU">Запрос на обновление значений KPI</xsd:documentation>
            </xsd:annotation>
            <xsd:sequence>
               <xsd:element name="ENTITY_ID" type="xsd:integer">
                  <xsd:annotation>
                     <xsd:documentation>Идентификатор показателя</xsd:documentation>
                  </xsd:annotation>
               </xsd:element>
            </xsd:sequence>
         </xsd:complexType>
      </xsd:schema>
   </wsdl:types>
</wsdl:definitions>`;
        editor.setValue(exampleWsdl);

        $('#exportBtn').on('click', function() {
            clearError();

            let xmlText = editor.getValue().trim();

            // Заменяем "кривые" кавычки из Word/PDF на нормальные двойные
            xmlText = xmlText.replace(/[\u201C\u201D\u00AB\u00BB]/g, '"').replace(/[\u2018\u2019]/g, "'");

            if (xmlText !== editor.getValue()) {
                editor.setValue(xmlText);
            }

            if (!xmlText) {
                const msg = typeof window.t === 'function' ? window.t('w2e_err_empty', "Пожалуйста, вставьте WSDL-код.") : "Пожалуйста, вставьте WSDL-код.";
                $('#error-panel').text(`❌ ${msg}`).show();
                return;
            }

            // Быстрая проверка валидности XML перед отправкой
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "application/xml");
            const errorNode = xmlDoc.querySelector("parsererror");

            if (errorNode) {
                const errorMsg = errorNode.textContent;
                // Пытаемся выцепить номер строки из нативной ошибки браузера
                const match = errorMsg.match(/line number (\d+)/i) || errorMsg.match(/line\s+(\d+)/i);
                if (match) {
                    const lineNum = parseInt(match[1], 10) - 1;
                    errorLineHandle = editor.addLineClass(lineNum, 'background', 'error-line-bg');
                    editor.scrollIntoView({line: lineNum, ch: 0}, 60);
                }
                const msgErrPrefix = typeof window.t === 'function' ? window.t('w2e_err_syntax', "Ошибка синтаксиса XML: ") : "Ошибка синтаксиса XML: ";
                $('#error-panel').text(`❌ ${msgErrPrefix}${errorMsg}`).show();
                return;
            }

            // Отправляем форму на сервер
            var form = $('<form></form>').attr('action', '/api/wsdl-to-excel').attr('method', 'post');
            form.append($('<input></input>').attr('type', 'hidden').attr('name', 'xml').attr('value', xmlText));
            form.appendTo('body').submit().remove();
        });
    });

    function clearError() {
        $('#error-panel').hide();
        if (errorLineHandle !== null) {
            editor.removeLineClass(errorLineHandle, 'background', 'error-line-bg');
            errorLineHandle = null;
        }
    }

    function escapeHtml(text) {
        if (!text) return "";
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
